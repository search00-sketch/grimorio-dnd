{id:"enlace-rary",nombre:"Enlace Telepático de Rary",nivel:5,escuela:"Adivinación",clases:["Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"9 metros",componentes:"V, S, M (una pareja de tazas de cristal conectadas por un tubo de cristal hueco)",duracion:"1 hora",concentracion:false,ritual:false,desc:"Este hechizo crea un vínculo telepático entre vos mismo y hasta ocho criaturas dispuestas al alcance, durando mientras el hechizo esté activo. Las criaturas designadas pueden comunicarse telepáticamente entre sí a través de cualquier distancia, siempre que estén en el mismo plano de existencia.",fuente:"SRD 5.2"},

{id:"invertir-gravedad",nombre:"Invertir la Gravedad",nivel:7,escuela:"Transmutación",clases:["Druida","Hechicero","Mago"],tiempo:"1 acción",alcance:"30 metros",componentes:"V, S, M (una barra de hierro imantada y un trozo de piedra pómez)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Este hechizo invierte la gravedad en un cilindro de 15 metros de radio y 30 metros de alto centrado en un punto al alcance, durante la duración. Todas las criaturas y objetos que no estén asegurados en la zona caen 'hacia arriba' y golpean el techo del área, o flotan si no hay techo.",fuente:"SRD 5.2"},
{id:"palabra-divina",nombre:"Palabra Divina",nivel:7,escuela:"Evocación",clases:["Clérigo"],tiempo:"1 acción adicional",alcance:"9 metros",componentes:"V",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Pronunciás una palabra divina, imbuida con el poder que dio forma al mundo al principio de los tiempos. Elegí cualquier cantidad de criaturas que puedas ver al alcance. Cada objetivo que pueda oírte debe superar una salvación de Carisma o sufrir un efecto según sus puntos de golpe actuales, desde ensordecido hasta destierro instantáneo.",fuente:"SRD 5.2"},
{id:"excursion-eterea",nombre:"Excursión Etérea",nivel:7,escuela:"Transmutación",clases:["Clérigo","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S",duracion:"Hasta 8 horas",concentracion:false,ritual:false,desc:"Vos y hasta tres criaturas voluntarias que puedas tocar salís del plano material y entráis en el Plano Etéreo. Permanecéis en el Plano Etéreo hasta que el hechizo termine, momento en el que volvéis de inmediato al Plano Material en las ubicaciones que ocupaban al desvanecerse el hechizo.",fuente:"SRD 5.2"},
{id:"proyectar-imagen",nombre:"Proyectar Imagen",nivel:7,escuela:"Ilusionismo",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"900 metros",componentes:"V, S, M (una figurilla de tela pequeña con tu semejanza, por valor de al menos 5 po)",duracion:"Hasta 1 día",concentracion:true,ritual:false,desc:"Creás una ilusión de vos mismo en un punto que puedas ver al alcance. La ilusión dura mientras mantengas la concentración, hasta un máximo de un día. Podés ver y oír a través de la ilusión como si estuvieras en su ubicación, y podés hacer que hable y se mueva como quieras.",fuente:"SRD 5.2"},

{id:"antipatia-simpatia",nombre:"Antipatía/Simpatía",nivel:8,escuela:"Encantamiento",clases:["Druida","Mago"],tiempo:"1 hora",alcance:"18 metros",componentes:"V, S, M (para antipatía, esencia de vinagre; para simpatía, azúcar refinada, miel y leche, o algo similarmente atractivo)",duracion:"10 días",concentracion:false,ritual:false,desc:"Este hechizo atrae o repele a criaturas de un tipo que elijas. Elegís un fenómeno o cierto tipo de criatura y un objeto al alcance no más grande que un cubo de 60 metros de lado. Luego elegís antipatía o simpatía. Durante la duración, criaturas de ese tipo evitan el objeto (antipatía) o se ven fuertemente atraídas hacia él (simpatía).",fuente:"SRD 5.2"},
{id:"nube-incendiaria",nombre:"Nube Incendiaria",nivel:8,escuela:"Conjuración",clases:["Druida","Hechicero","Mago"],tiempo:"1 acción",alcance:"45 metros",componentes:"V, S, M (un poco de tabaco en polvo)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Un banco de nube gris humeante que se retuerce con brasas anaranjadas aparece en una esfera de 9 metros de radio centrada en un punto al alcance. Cuando la nube aparece, cada criatura totalmente dentro de ella debe hacer una salvación de Destreza, sufriendo 10d8 de daño de fuego si falla, o la mitad si acierta.",fuente:"SRD 5.2"},
{id:"cautiverio",nombre:"Cautiverio",nivel:9,escuela:"Abjuración",clases:["Bardo","Clérigo","Hechicero","Mago"],tiempo:"1 hora",alcance:"9 metros",componentes:"V, S, M (una piedra semipreciosa de al menos 500 po tallada a modo de miniatura del contenedor usado como componente adicional)",duracion:"Hasta que se disipe",concentracion:false,ritual:false,desc:"Creás un mandato mágico contra una criatura que puedas ver al alcance, forzándola a un confinamiento permanente. El objetivo debe superar una salvación de Sabiduría o quedar atado. El hechizo tiene fuerza y efecto limitados contra ciertas criaturas de gran poder.",fuente:"SRD 5.2"},
{id:"muro-prismatico",nombre:"Muro Prismático",nivel:9,escuela:"Abjuración",clases:["Mago"],tiempo:"1 acción",alcance:"36 metros",componentes:"V, S",duracion:"Hasta que se disipe",concentracion:false,ritual:false,desc:"Un muro brillante y multicolor de luz protege un área contra intrusiones físicas y de energía, y contra escrutinio. Elegís una superficie al alcance no mayor que 30 metros de ancho y 30 metros de alto. El muro consiste en siete capas de luz, cada una de un color diferente, con propiedades distintas.",fuente:"SRD 5.2"},

{id:"vinculo-protector",nombre:"Vínculo Protector",nivel:2,escuela:"Abjuración",clases:["Clérigo","Paladín"],tiempo:"1 acción",alcance:"9 metros",componentes:"V, S, M (dos anillos de metal engarzados, uno para cada criatura)",duracion:"1 hora",concentracion:false,ritual:false,desc:"Este hechizo forja un vínculo mágico protector entre dos criaturas dispuestas al alcance. Mientras ambas estén a 9 metros entre sí, cada una desvía parte del daño que la otra sufre hacia sí misma.",fuente:"SRD 5.2"},

{id:"fragmento-mental",nombre:"Fragmento Mental",nivel:0,escuela:"Encantamiento",clases:["Bardo","Brujo","Hechicero","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Vos lanzás un fragmento astillado de pura energía psíquica hacia una criatura al alcance. Realizá un ataque de conjuro a distancia; si acierta, el objetivo sufre 1d6 de daño psíquico y tiene desventaja en la próxima salvación de Constitución que haga para mantener la concentración en un conjuro antes del final de su próximo turno.",mejora:"El daño aumenta en 1d6 en los niveles 5, 11 y 17.",fuente:"SRD 5.2"},
{id:"tronar",nombre:"Tronar",nivel:0,escuela:"Evocación",clases:["Bardo","Brujo","Druida","Hechicero","Mago"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Chasqueás los dedos en un punto que elijas a menos de 3 metros. El sonido de un trueno estalla desde ese punto y cada criatura a 1,5 metros de él debe superar una salvación de Constitución o sufrir 1d8 de daño de trueno.",mejora:"El daño aumenta en 1d8 en los niveles 5, 11 y 17.",fuente:"SRD 5.2"},
{id:"voluta-estelar",nombre:"Voluta Estelar",nivel:0,escuela:"Evocación",clases:["Bardo","Druida","Hechicero","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Una diminuta voluta de luz estelar se dispara hacia una criatura al alcance. Realizá un ataque de conjuro a distancia; si acierta, el objetivo sufre 1d8 de daño radiante, y recuperás puntos de golpe iguales a la mitad del daño infligido si tenés menos puntos de golpe que tu máximo.",mejora:"El daño aumenta en 1d8 en los niveles 5, 11 y 17.",fuente:"SRD 5.2"},
{id:"estallido-magico",nombre:"Estallido Mágico",nivel:0,escuela:"Evocación",clases:["Hechicero"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Creás una explosión de energía mágica cruda y la disparás hacia una criatura al alcance. Elegí un tipo de daño entre ácido, frío, fuego, eléctrico, veneno, psíquico o trueno. Realizá un ataque de conjuro a distancia; si acierta, el objetivo sufre 1d8 de daño del tipo elegido. Si sacás el mismo número en dos o más de los dados usados para el daño de este hechizo, ganás 1 punto de hechicería, sin poder ganar más de uno así por turno.",mejora:"El daño aumenta en 1d8 en los niveles 5, 11 y 17.",fuente:"SRD 5.2"},
{id:"amistad-truco",nombre:"Amistad",nivel:0,escuela:"Encantamiento",clases:["Bardo","Brujo","Hechicero"],tiempo:"1 acción",alcance:"9 metros",componentes:"S, M (un pellizco de carbón)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Ganás temporalmente la simpatía de una criatura de tu elección al alcance. Aunque la criatura no se de cuenta de tu magia, debe superar una salvación de Sabiduría o quedar hechizada por vos mientras dure el hechizo. Cuando el hechizo termine, la criatura se da cuenta de que fue hechizada por magia.",fuente:"SRD 5.2"},

{id:"abrir",nombre:"Abrir",nivel:2,escuela:"Transmutación",clases:["Bardo","Hechicero","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Elegís una cerradura que puedas ver al alcance, como la que asegura una puerta, cofre o grilletes. Un objeto o criatura sujeta con la cerradura queda desbloqueado. Si abrís una cerradura de esta forma, cualquier trampa vinculada a la cerradura se activa igual.",fuente:"SRD 5.2"},
{id:"arma-elemental",nombre:"Arma Elemental",nivel:3,escuela:"Transmutación",clases:["Druida","Explorador","Paladín"],tiempo:"1 acción adicional",alcance:"Toque",componentes:"V, S",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Un arma no mágica que toques se convierte en un arma mágica durante la duración. Elegís uno de los siguientes tipos de daño: ácido, frío, fuego, eléctrico o trueno. Mientras dure el hechizo, el arma tiene un bono de +1 a las tiradas de ataque y de daño, e inflige 1d4 de daño adicional del tipo elegido al impactar.",mejora:"El bono aumenta a +2 con espacio de nivel 5-6, y a +3 con nivel 7+.",fuente:"SRD 5.2"},
{id:"creacion",nombre:"Creación",nivel:5,escuela:"Ilusionismo",clases:["Hechicero","Mago"],tiempo:"1 minuto",alcance:"9 metros",componentes:"V, S, M (un pequeño trozo de materia similar al objeto que deseás crear)",duracion:"Especial",concentracion:false,ritual:false,desc:"Sacás luz y oscuridad del Plano Etéreo para dar forma a un objeto sólido y no vivo dentro del alcance. El objeto puede ser de un material vegetal o mineral que hayas visto antes, hasta un cubo de 9 metros de lado. Los objetos creados con materiales más raros duran menos tiempo.",fuente:"SRD 5.2"},
{id:"crear-destruir-agua",nombre:"Crear o Destruir Agua",nivel:1,escuela:"Transmutación",clases:["Clérigo","Druida"],tiempo:"1 acción",alcance:"9 metros",componentes:"V, S, M (una gota de agua si creás agua, o un pellizco de polvo si la destruís)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Vos creás o destruís hasta 40 litros de agua dentro del alcance. Podés crear agua potable limpia o destruirla, o destruir niebla en un cubo de 9 metros de lado.",mejora:"Con espacios de nivel superior podés afectar 10 litros adicionales, o un cubo 3 metros más grande, por cada espacio adicional.",fuente:"SRD 5.2"},
{id:"detectar-bien-mal",nombre:"Detectar el Bien y el Mal",nivel:1,escuela:"Adivinación",clases:["Clérigo","Paladín"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Durante el hechizo, sabés si hay alguna celestial, infernal o muerto viviente a 9 metros de vos, así como dónde está cualquier lugar o objeto que haya sido consagrado o profanado.",fuente:"SRD 5.2"},
{id:"ensueno",nombre:"Ensueño",nivel:5,escuela:"Ilusionismo",clases:["Bardo","Brujo","Mago"],tiempo:"1 minuto",alcance:"Especial",componentes:"V, S, M (un puñado de arena, una gota de tinta de calamar y una pluma tomada de una criatura dormida)",duracion:"8 horas",concentracion:false,ritual:false,desc:"Este hechizo le da forma a los sueños de una criatura dispuesta que conozcas y que esté durmiendo. Escogés a un mensajero para que entre en el mundo onírico del objetivo, y podéis conversar mientras dure el hechizo.",fuente:"SRD 5.2"},
{id:"localizar-animales-plantas",nombre:"Localizar Animales o Plantas",nivel:2,escuela:"Adivinación",clases:["Bardo","Druida","Explorador"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S, M (una brizna de hierba)",duracion:"Instantánea",concentracion:false,ritual:true,desc:"Describís o nombráis un tipo específico de bestia o planta. Vos sentís la dirección hacia el ejemplar más cercano de esa especie dentro de 5 kilómetros, siempre que exista al menos uno en ese radio.",fuente:"SRD 5.2"},
{id:"palabra-resplandor",nombre:"Palabra de Resplandor",nivel:0,escuela:"Evocación",clases:["Clérigo"],tiempo:"1 acción especial",alcance:"9 metros",componentes:"V",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Pronunciás una palabra divina de poder, imbuida con una fracción de la energía que impulsa el multiverso. Elegí hasta un total de cuatro puntos de golpe, entre criaturas que puedas ver al alcance. Cada objetivo cegado, envenenado, aterrorizado o con la mitad de sus puntos de golpe puede recuperar puntos de golpe.",mejora:"El total de puntos de golpe que podés afectar aumenta en los niveles 5, 11 y 17.",fuente:"SRD 5.2"},
{id:"purificar-comida-bebida",nombre:"Purificar Comida y Bebida",nivel:1,escuela:"Transmutación",clases:["Clérigo","Druida","Paladín"],tiempo:"1 acción",alcance:"3 metros",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:true,desc:"Toda la comida y bebida no mágica dentro de una esfera de 1,5 metros de radio centrada en un punto al alcance queda purificada y libre de veneno y enfermedad.",fuente:"SRD 5.2"},
{id:"salto",nombre:"Salto",nivel:1,escuela:"Transmutación",clases:["Druida","Explorador","Hechicero","Mago"],tiempo:"1 acción adicional",alcance:"Toque",componentes:"V, S, M (una pata trasera de saltamontes)",duracion:"1 minuto",concentracion:false,ritual:false,desc:"Tocás a una criatura. La distancia de salto de esa criatura se triplica mientras dure el hechizo.",fuente:"SRD 5.2"},
{id:"vigor-arcano",nombre:"Vigor Arcano",nivel:1,escuela:"Abjuración",clases:["Hechicero","Mago"],tiempo:"1 acción adicional",alcance:"Uno mismo",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Canalizás energía arcana para reforzar tu cuerpo. Elegí un espacio de conjuro de nivel 1 o superior que tengas disponible y no hayas gastado; recuperás puntos de golpe iguales al doble del nivel de ese espacio.",fuente:"SRD 5.2"},
{id:"rafaga-viento",nombre:"Ráfaga de Viento",nivel:2,escuela:"Evocación",clases:["Druida","Explorador","Hechicero","Mago"],tiempo:"1 acción",alcance:"Uno mismo (línea de 18 m)",componentes:"V, S, M (una pluma de ave)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Una ráfaga de viento fuerte se forma y sopla en la dirección que elijas desde vos, en una línea de 18 metros de largo y 3 metros de ancho. Cada criatura que empiece su turno en la línea debe superar una salvación de Fuerza o ser empujada 4,5 metros lejos de vos en la dirección en que sopla el viento.",fuente:"SRD 5.2"},
{id:"cuchillo-hielo",nombre:"Cuchillo de Hielo",nivel:1,escuela:"Conjuración",clases:["Druida","Explorador","Hechicero","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S, M (una gota de agua o un trocito de hielo)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Creás una esquirla de hielo puntiaguda y la lanzás hacia una criatura al alcance. Realizá un ataque de conjuro a distancia; si acierta, el objetivo sufre 1d10 de daño de perforación. Ya sea que acierte o no, la esquirla explota en fragmentos afilados al impactar, y cada criatura a 1,5 metros del objetivo debe superar una salvación de Destreza o sufrir 2d6 de daño de frío.",mejora:"El daño de frío aumenta en 1d6 por cada espacio de conjuro por encima del nivel 1.",fuente:"SRD 5.2"},
{id:"infligir-heridas",nombre:"Infligir Heridas",nivel:1,escuela:"Nigromancia",clases:["Clérigo"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Un ataque necrótico marchito surge de tu mano tocada por la muerte. Realizá un ataque de conjuro cuerpo a cuerpo contra una criatura al alcance. Si acierta, el objetivo sufre 3d10 de daño necrótico.",mejora:"El daño aumenta en 1d10 por cada espacio de conjuro por encima del nivel 1.",fuente:"SRD 5.2"},
{id:"aura-vitalidad",nombre:"Aura de Vitalidad",nivel:3,escuela:"Abjuración",clases:["Clérigo","Paladín"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"La vitalidad fluye a través de vos, curando heridas cercanas. Se crea un aura de energía curativa que emana de vos en un radio de 9 metros mientras dure el hechizo. Mientras el aura persiste, podés usar tu acción adicional para elegir una criatura dentro de ella, incluido vos, y esa criatura recupera 2d6 de puntos de golpe.",fuente:"SRD 5.2"},
{id:"engañar-mislead",nombre:"Engañar",nivel:5,escuela:"Ilusionismo",clases:["Bardo","Brujo","Mago"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"S",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Te volvés invisible al mismo tiempo que aparece una ilusión idéntica a vos en tu ubicación. La ilusión dura mientras el hechizo esté activo, pero la invisibilidad termina si atacás o lanzás un conjuro. Podés ver y oír a través de la ilusión como si estuvieras en su ubicación, y podés hacer que hable y se mueva de forma convincente.",fuente:"SRD 5.2"},
{id:"conjurar-elementales-menores",nombre:"Conjurar Elementales Menores",nivel:4,escuela:"Conjuración",clases:["Druida","Hechicero","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Invocás espíritus elementales que adoptan la forma de bestias, apareciendo en espacios desocupados al alcance. Elegís una forma entre varias opciones y aparece la cantidad correspondiente de bestias espirituales elementales para luchar a tu lado, obedeciendo tus órdenes mentales.",fuente:"SRD 5.2"},
{id:"conjurar-elemental",nombre:"Conjurar Elemental",nivel:5,escuela:"Conjuración",clases:["Druida","Hechicero","Mago"],tiempo:"1 acción",alcance:"27 metros",componentes:"V, S",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Invocás a un espíritu elemental. Elige aire, tierra, fuego o agua para determinar la forma que adopta la criatura, la cual aparece en un espacio desocupado al alcance y lucha a tu lado, obedeciendo tus órdenes mentales.",fuente:"SRD 5.2"},
{id:"conjurar-feerico",nombre:"Conjurar Feérico",nivel:4,escuela:"Conjuración",clases:["Bardo","Brujo","Druida"],tiempo:"1 acción",alcance:"27 metros",componentes:"V, S",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Invocás a un espíritu feérico. Elige una forma de entre varias opciones; la criatura aparece en un espacio desocupado al alcance y lucha a tu lado, obedeciendo tus órdenes mentales.",fuente:"SRD 5.2"},
{id:"conjurar-celestial",nombre:"Conjurar Celestial",nivel:7,escuela:"Conjuración",clases:["Clérigo","Druida"],tiempo:"1 acción",alcance:"27 metros",componentes:"V, S",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Invocás a un espíritu celestial que adopta la forma de tu elección: un ave o una bestia alada de tamaño Grande. La criatura aparece en un espacio desocupado al alcance y lucha a tu lado, obedeciendo tus órdenes mentales.",fuente:"SRD 5.2"},
{id:"invocar-elemental",nombre:"Invocar Elemental",nivel:4,escuela:"Conjuración",clases:["Druida","Explorador","Hechicero","Mago"],tiempo:"1 acción",alcance:"27 metros",componentes:"V, S",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Invocás a un espíritu elemental que aparece en un espacio desocupado al alcance. Elegís su forma entre varias opciones disponibles, y la criatura lucha a tu lado siguiendo tus órdenes mentales mientras dure el hechizo.",fuente:"SRD 5.2"},
{id:"castigo-divino",nombre:"Castigo Divino",nivel:1,escuela:"Evocación",clases:["Paladín"],tiempo:"1 acción adicional",alcance:"Uno mismo",componentes:"V",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"La próxima vez que impactes a una criatura con un ataque con arma cuerpo a cuerpo durante la duración del hechizo, tu arma resplandece con luz sagrada, y el ataque inflige 2d8 de daño radiante adicional al objetivo, o 3d8 si es un muerto viviente o un infernal.",mejora:"El daño adicional aumenta en 1d8 por cada espacio de conjuro por encima del nivel 1.",fuente:"SRD 5.2"},
{id:"consagrar",nombre:"Consagrar",nivel:5,escuela:"Abjuración",clases:["Clérigo"],tiempo:"1 hora",alcance:"9 metros",componentes:"V, S, M (agua bendita o sagrada e incienso por valor de al menos 1000 po, que se consumen)",duracion:"24 horas",concentracion:false,ritual:false,desc:"Consagrás terreno en un radio de 18 metros centrado en un punto al alcance durante la duración. Elegís uno o más de varios efectos beneficiosos, como que las criaturas muertas vivientes en el área tengan desventaja en tiradas de ataque, o que las criaturas amistosas ganen puntos de golpe temporales.",fuente:"SRD 5.2"},
{id:"crear-comida-agua",nombre:"Crear Comida y Agua",nivel:3,escuela:"Conjuración",clases:["Clérigo","Paladín"],tiempo:"1 acción",alcance:"9 metros",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Creás comida y agua nutritivas y potables en el suelo o en contenedores al alcance, suficientes para alimentar a 24 criaturas durante 24 horas. La comida es sencilla pero sabrosa, y se puede combinar con carne o pescado ya presente.",fuente:"SRD 5.2"},

{id:"animar-muertos",nombre:"Animar a los Muertos",nivel:3,escuela:"Nigromancia",clases:["Clérigo","Mago"],tiempo:"1 minuto",alcance:"3 metros",componentes:"V, S, M (una gota de sangre, un pellizco de tierra de cementerio y un trozo de carne o hueso)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Este hechizo crea un muerto viviente obediente. Elegís un cadáver o un montón de huesos de una criatura de tamaño Mediano o Pequeña al alcance. Tu magia y el mandato que pronuncies obligan a esos restos a levantarse de la tumba como un zombi (para un cadáver) o esqueleto (para huesos), y obedecer tus órdenes verbales.",mejora:"Podés animar dos criaturas adicionales por cada espacio de conjuro por encima del nivel 3.",fuente:"SRD 5.2"},
{id:"aliado-planar",nombre:"Aliado Planar",nivel:6,escuela:"Conjuración",clases:["Clérigo"],tiempo:"10 minutos",alcance:"18 metros",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Convocás a una criatura de un plano de existencia distinto al tuyo para que te ayude. Aparece en un espacio desocupado al alcance y permanece hasta que complete la tarea que le encomiendes a cambio de un pago. Los seres poderosos pueden pedir favores sustanciales por su ayuda.",fuente:"SRD 5.2"},
{id:"aura-pureza",nombre:"Aura de Pureza",nivel:4,escuela:"Abjuración",clases:["Clérigo","Paladín"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Un aura de energía purificadora te rodea en un radio de 9 metros durante la duración. El área se mueve con vos y está centrada en vos. Mientras esté en el aura, cada criatura no muerta viviente ni infernal, incluido vos, tiene ventaja en salvaciones contra ser envenenada y resistencia al daño de veneno.",fuente:"SRD 5.2"},
{id:"aura-sagrada",nombre:"Aura Sagrada",nivel:8,escuela:"Abjuración",clases:["Clérigo","Paladín"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S, M (un pequeño frasco de agua sagrada)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Una luz divina irradia de vos en un radio de 9 metros durante la duración. Cada criatura amistosa en el aura ganá ventaja en tiradas de salvación, y las criaturas hostiles tienen desventaja en tiradas de ataque contra cualquier criatura amistosa dentro del aura.",fuente:"SRD 5.2"},
{id:"barrera-cuchillas",nombre:"Barrera de Cuchillas",nivel:6,escuela:"Evocación",clases:["Clérigo"],tiempo:"1 acción",alcance:"27 metros",componentes:"V, S, M (un frasco pequeño lleno de esquirlas metálicas afiladas)",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Creás una muralla vertical de cuchillas giratorias que hace las veces de barrera. La muralla aparece dentro del alcance y dura mientras el hechizo esté activo. Podés hacer que la muralla tenga hasta 30 metros de largo, 6 metros de alto y 1,5 metros de espesor, o forme un anillo cerrado de hasta 6 metros de radio.",mejora:"El daño aumenta en 1d10 por cada espacio de conjuro por encima del nivel 6.",fuente:"SRD 5.2"},
{id:"brazos-hadar",nombre:"Brazos de Hadar",nivel:1,escuela:"Conjuración",clases:["Brujo"],tiempo:"1 acción",alcance:"Uno mismo (radio de 3 m)",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Extendés tus brazos y de ellos brotan tentáculos oscuros de un vacío interdimensional. Cada criatura en un radio de 3 metros a tu alrededor debe hacer una salvación de Fuerza, sufriendo 2d6 de daño necrótico y no pudiendo usar reacciones hasta su próximo turno si falla, o la mitad del daño si acierta.",mejora:"El daño aumenta en 1d6 por cada espacio de conjuro por encima del nivel 1.",fuente:"SRD 5.2"},
{id:"hambre-hadar",nombre:"Hambre de Hadar",nivel:3,escuela:"Conjuración",clases:["Brujo"],tiempo:"1 acción",alcance:"45 metros",componentes:"V, S",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Vos rasgás un agujero hacia el Vacío, un lugar de oscuridad absoluta y frío devastador. Cada criatura en un cubo de 6 metros de lado centrado en un punto al alcance debe hacer una salvación de Destreza. El área queda llena de una oscuridad profunda, y cualquier criatura que empiece su turno allí sufre 2d6 de daño frío.",mejora:"El daño aumenta en 1d6 por cada espacio de conjuro por encima del nivel 3.",fuente:"SRD 5.2"},
{id:"caldero-tasha",nombre:"Caldero Burbujeante de Tasha",nivel:6,escuela:"Conjuración",clases:["Brujo","Hechicero","Mago"],tiempo:"1 minuto",alcance:"9 metros",componentes:"V, S, M (una rana o sapo disecado)",duracion:"Hasta 1 hora",concentracion:false,ritual:false,desc:"Invocás un caldero mágico burbujeante lleno de una poción efervescente. Cada criatura que puedas ver al alcance puede beber una porción como acción, obteniendo un efecto aleatorio entre varias pociones posibles (curación, invisibilidad, fuego gigante, entre otras).",fuente:"SRD 5.2"},
{id:"cambiar-forma",nombre:"Cambiar de Forma",nivel:9,escuela:"Transmutación",clases:["Druida","Hechicero","Mago"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S, M (una figurilla tallada con la imagen de la forma elegida)",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Asumís la forma de una criatura diferente durante la duración. Podés elegir cualquier criatura que hayas visto antes, con un valor de desafío igual o menor a tu nivel. Podés transformarte en esa forma tantas veces como quieras mientras dure el hechizo, sin usar una acción para hacerlo.",fuente:"SRD 5.2"},
{id:"carcaj-veloz",nombre:"Carcaj Veloz",nivel:5,escuela:"Transmutación",clases:["Explorador"],tiempo:"1 acción adicional",alcance:"Uno mismo",componentes:"V, S, M (un carcaj con al menos un proyectil)",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Creás dos carcajes espectrales flotantes que dura mientras el hechizo esté activo. Cada vez que hagas un ataque con un arma a distancia, podés extraer uno o más proyectiles idénticos a uno que ya tengas de los carcajes en lugar de tu equipo normal.",fuente:"SRD 5.2"},

{id:"castigo-abrumador",nombre:"Castigo Abrumador",nivel:4,escuela:"Encantamiento",clases:["Paladín"],tiempo:"1 acción adicional",alcance:"Uno mismo",componentes:"V",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"La próxima vez que impactes a una criatura con un ataque con arma cuerpo a cuerpo antes de que termine el hechizo, tu arma resuena con energía abrumadora, y el ataque inflige 4d8 de daño de fuerza adicional. El objetivo también debe superar una salvación de Fuerza o quedar derribado.",mejora:"El daño adicional aumenta en 1d8 por cada espacio de conjuro por encima del nivel 4.",fuente:"SRD 5.2"},
{id:"castigo-brillante",nombre:"Castigo Brillante",nivel:2,escuela:"Transmutación",clases:["Paladín"],tiempo:"1 acción adicional",alcance:"Uno mismo",componentes:"V",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"La próxima vez que impactes a una criatura con un ataque con arma cuerpo a cuerpo antes de que termine el hechizo, tu arma resplandece con una luz cegadora, y el ataque inflige 2d8 de daño radiante adicional. El objetivo y cada criatura a 3 metros de él deben superar una salvación de Constitución o quedar cegadas hasta el final de tu próximo turno.",mejora:"El daño adicional aumenta en 1d8 por cada espacio de conjuro por encima del nivel 2.",fuente:"SRD 5.2"},
{id:"castigo-cegador",nombre:"Castigo Cegador",nivel:3,escuela:"Evocación",clases:["Paladín"],tiempo:"1 acción adicional",alcance:"Uno mismo",componentes:"V",duracion:"Instantánea",concentracion:false,ritual:false,desc:"La próxima vez que impactes a una criatura con un ataque con arma cuerpo a cuerpo antes de que termine el hechizo, tu arma destella con luz solar pura, y el ataque inflige 3d10 de daño radiante adicional al objetivo. Además, si el objetivo no es inmune a quedar cegado, debe superar una salvación de Constitución o quedar cegado durante 1 minuto.",mejora:"El daño adicional aumenta en 1d10 por cada espacio de conjuro por encima del nivel 3.",fuente:"SRD 5.2"},
{id:"castigo-furioso",nombre:"Castigo Furioso",nivel:1,escuela:"Nigromancia",clases:["Paladín"],tiempo:"1 acción adicional",alcance:"Uno mismo",componentes:"V",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"La próxima vez que impactes a una criatura con un ataque con arma cuerpo a cuerpo antes de que termine el hechizo, tu arma resplandece con energía necrótica siniestra, y el ataque inflige 2d6 de daño necrótico adicional. Además, si el objetivo es una criatura que no sea un constructo o muerto viviente, debe superar una salvación de Sabiduría o quedar asustada de vos hasta que el hechizo termine.",mejora:"El daño adicional aumenta en 1d6 por cada espacio de conjuro por encima del nivel 1.",fuente:"SRD 5.2"},
{id:"manto-cruzado",nombre:"Manto del Cruzado",nivel:3,escuela:"Transmutación",clases:["Paladín"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Energía sagrada emana de vos, formando un aura de 9 metros de radio durante la duración. Mientras dure, cada vez que una criatura amistosa en el aura impacte con un ataque con arma, esa criatura puede infligir 1d4 de daño radiante adicional al objetivo.",fuente:"SRD 5.2"},

{id:"dañar",nombre:"Dañar",nivel:6,escuela:"Nigromancia",clases:["Clérigo","Druida","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Elegís una criatura que puedas ver al alcance, y una energía maligna la invade. El objetivo debe hacer una salvación de Constitución. Si falla, sufre 14d6 de daño necrótico, o la mitad si acierta. El daño no puede reducir los puntos de golpe del objetivo por debajo de 1.",fuente:"SRD 5.2"},
{id:"carne-piedra",nombre:"De la Carne a la Piedra",nivel:6,escuela:"Transmutación",clases:["Clérigo","Druida","Hechicero","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S, M (una pizca de tierra y agua)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Intentás transformar en piedra a una criatura que puedas ver al alcance. Si su cuerpo está hecho de materia sólida, esa criatura debe superar una salvación de Constitución o quedar petrificada mientras dure el hechizo.",fuente:"SRD 5.2"},
{id:"esfera-otiluke-congelante",nombre:"Esfera Congelante de Otiluke",nivel:6,escuela:"Evocación",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"36 metros",componentes:"V, S, M (una pequeña esfera de cristal)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Una esfera helada de energía disparada desde tu mano golpea a cualquier objeto al alcance y estalla en una explosión de frío. Cada criatura en una esfera de 18 metros de radio debe hacer una salvación de Constitución, sufriendo 10d6 de daño de frío si falla, o la mitad si acierta.",mejora:"El daño aumenta en 1d6 por cada espacio de conjuro por encima del nivel 6.",fuente:"SRD 5.2"},
{id:"esfera-otiluke-resiliente",nombre:"Esfera Elástica de Otiluke",nivel:4,escuela:"Abjuración",clases:["Mago"],tiempo:"1 acción",alcance:"9 metros",componentes:"V, S, M (dos hemisferios de cristal transparente diminutos)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Una esfera brillante de fuerza envuelve a una criatura o un objeto de tamaño Grande o menor al alcance. Una criatura no dispuesta debe superar una salvación de Destreza para evitar quedar atrapada. Nada, ni físico ni mágico, puede pasar a través de la barrera, entrar en ella ni afectar a criaturas dentro.",fuente:"SRD 5.2"},
{id:"disipar-bien-mal",nombre:"Disipar el Bien y el Mal",nivel:5,escuela:"Abjuración",clases:["Clérigo","Paladín"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S, M (agua sagrada o agua bendecida especialmente)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Poder celestial, feérico o infernal os protege a vos, otorgándoos beneficios protectores contra criaturas de otros planos: celestiales, elementales, feéricos, infernales y muertos vivientes tienen desventaja en tiradas de ataque contra vos, y no podéis quedar hechizados, asustados ni poseídos por ellos.",fuente:"SRD 5.2"},
{id:"elementalismo",nombre:"Elementalismo",nivel:0,escuela:"Transmutación",clases:["Druida","Hechicero","Mago"],tiempo:"1 acción o 10 minutos (ritual)",alcance:"3 metros",componentes:"S",duracion:"Instantánea o especial",concentracion:false,ritual:true,desc:"Este truco te permite manipular uno de los cuatro elementos: aire, tierra, fuego o agua, creando un efecto sutil según el elemento elegido. Además, si dedicás 10 minutos, podés crear un efecto elemental más duradero y vistoso a partir de una lista de opciones ligadas a cada elemento.",fuente:"SRD 5.2"},
{id:"golpe-apresador",nombre:"Golpe Apresador",nivel:1,escuela:"Conjuración",clases:["Explorador"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V",duracion:"Instantánea",concentracion:false,ritual:false,desc:"La próxima vez que impactes a una criatura con un ataque con arma antes de que termine el hechizo, zarcillos espinosos y mágicos intentan apresar al objetivo. Además del daño normal del ataque, el objetivo debe superar una salvación de Fuerza o quedar apresado durante 1 minuto.",mejora:"Podés apuntar a una criatura adicional por cada espacio de conjuro por encima del nivel 1.",fuente:"SRD 5.2"},
{id:"golpe-viento-acerado",nombre:"Golpe de Viento Acerado",nivel:5,escuela:"Conjuración",clases:["Explorador","Hechicero","Mago"],tiempo:"1 acción",alcance:"9 metros",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Vos os teletransportáis hasta a cinco criaturas que puedas ver al alcance, atacando a cada una con un arma cuerpo a cuerpo espectral al llegar. Realizá un ataque de conjuro cuerpo a cuerpo separado contra cada objetivo; si acierta, el objetivo sufre 6d10 de daño de fuerza.",mejora:"El daño aumenta en 1d10 por cada espacio de conjuro por encima del nivel 5.",fuente:"SRD 5.2"},
{id:"golpe-flamigero",nombre:"Golpe Flamígero",nivel:5,escuela:"Evocación",clases:["Clérigo"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S, M (una chispa de yesca)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Un pilar vertical de fuego divino se abate desde el cielo en un cilindro de 3 metros de radio y 12 metros de alto, centrado en un punto al alcance. Cada criatura en el cilindro debe hacer una salvación de Destreza, sufriendo 4d6 de daño de fuego más 4d6 de daño radiante si falla, o la mitad si acierta.",mejora:"Cada tipo de daño aumenta en 1d6 por cada espacio de conjuro por encima del nivel 5.",fuente:"SRD 5.2"},

{id:"marchitar",nombre:"Marchitar",nivel:4,escuela:"Nigromancia",clases:["Brujo","Druida","Explorador","Hechicero","Mago"],tiempo:"1 acción",alcance:"27 metros",componentes:"V, S, M (una serpiente cascabel disecada)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Necrosás la carne de hasta tres criaturas que puedas ver al alcance. Cada objetivo debe hacer una salvación de Constitución, sufriendo 4d8 de daño necrótico y quedando envenenado hasta el final de tu próximo turno si falla, o la mitad del daño si acierta.",mejora:"El daño aumenta en 1d8 por cada espacio de conjuro por encima del nivel 4.",fuente:"SRD 5.2"},

{id:"rociada-prismatica",nombre:"Rociada Prismática",nivel:7,escuela:"Evocación",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"Uno mismo (cono de 18 m)",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Ocho rayos de luz de colores diferentes salen disparados de tu mano. Cada criatura en un cono de 18 metros debe tirar contra dos rayos aleatorios, cada uno con su propio efecto según el color: daño elemental, ceguera, petrificación, y otros efectos devastadores.",fuente:"SRD 5.2"},
{id:"saber-druidico",nombre:"Saber Druídico",nivel:0,escuela:"Transmutación",clases:["Druida"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Susurrás con la voz de la naturaleza para obtener conocimiento. Nombrás algo dentro de una categoría de tu elección, como un animal, planta o fenómeno natural, y recibís de tu deidad o espíritu patrón un dato interesante sobre esa cosa.",fuente:"SRD 5.2"},

{id:"sentidos-bestia",nombre:"Sentidos de la Bestia",nivel:2,escuela:"Adivinación",clases:["Druida","Explorador"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S",duracion:"Hasta 1 hora",concentracion:true,ritual:true,desc:"Podés tocar a una bestia voluntaria para experimentar el mundo a través de sus sentidos mientras dure el hechizo. Podés usar tu acción para ver a través de sus ojos y oír lo que oye hasta el final de tu próximo turno, ganando los beneficios de sus sentidos especiales.",fuente:"SRD 5.2"},

let state = { search:"", nivel:null, escuela:null, clase:"", conc:false, rit:false, soloFav:false, soloPrep:false };
let favoritos = new Set();

function cargarFavoritos(){
  try{
    const raw = localStorage.getItem('grimorio_favoritos');
    if(raw){ favoritos = new Set(JSON.parse(raw)); }
  }catch(e){ favoritos = new Set(); }
  render();
}
function guardarFavoritos(){
  try{ localStorage.setItem('grimorio_favoritos', JSON.stringify([...favoritos])); }catch(e){}
}
function toggleFav(id){
  if(favoritos.has(id)) favoritos.delete(id); else favoritos.add(id);
  guardarFavoritos();
  render();
}
function togglePrep(id){
  const p = personajeActivo;
  if(!p || p._soloLectura) return;
  if(!p.conjurosPreparados) p.conjurosPreparados = [];
  const i = p.conjurosPreparados.indexOf(id);
  if(i>=0) p.conjurosPreparados.splice(i,1); else p.conjurosPreparados.push(id);
  guardarPersonajeFirestore(p);
  render();
}

});

function filtrar(){
  return SPELLS.filter(s=>{
    if(state.search && !s.nombre.toLowerCase().includes(state.search)) return false;
    if(state.nivel!==null && s.nivel!==state.nivel) return false;
    if(state.escuela && s.escuela!==state.escuela) return false;
    if(state.clase && !s.clases.includes(state.clase)) return false;
    if(state.conc && !s.concentracion) return false;
    if(state.rit && !s.ritual) return false;
    if(state.soloFav && !favoritos.has(s.id)) return false;
    if(state.soloPrep){
      if(!personajeActivo || !(personajeActivo.conjurosPreparados||[]).includes(s.id)) return false;
    }
    return true;
  });
}

function pipsHtml(nivel, color){
  if(nivel===0) return `<span class="cantrip-tag" style="--sc:${color}">Truco</span>`;
  let html = '<div class="level-pips">';
  for(let i=1;i<=9;i++){ html += `<div class="pip ${i<=nivel?'on':''}" style="--sc:${color}"></div>`; }
  html += '</div>';
  return html;
}

const grid = document.getElementById('grid');

function render(){
  const list = filtrar();
  grid.innerHTML = '';
  if(list.length===0){
    grid.innerHTML = `<div class="empty-state"><div class="glyph">✦</div>No se encontraron hechizos con esos filtros.</div>`;
    return;
  }
  list.sort((a,b)=> a.nivel-b.nivel || a.nombre.localeCompare(b.nombre));
  list.forEach(s=>{
    const meta = SCHOOL_META[s.escuela] || {c:"var(--gold)"};
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--sc', meta.c);
    card.tabIndex = 0;
    card.innerHTML = `
      <button class="fav-btn ${favoritos.has(s.id)?'on':''}" style="--sc:${meta.c}" aria-label="Favorito">★</button>
      ${personajeActivo && !personajeActivo._soloLectura ?`<button class="prep-btn ${(personajeActivo.conjurosPreparados||[]).includes(s.id)?'on':''}" style="--sc:${meta.c}" aria-label="Preparado">📖</button>`:''}
      ${pipsHtml(s.nivel, meta.c)}
      <h3>${s.nombre}</h3>
      <div class="school">${s.escuela}</div>
      <div class="tags">
        ${s.concentracion?'<span class="tag-mini">Conc.</span>':''}
        ${s.ritual?'<span class="tag-mini">Ritual</span>':''}
      </div>
    `;
    card.querySelector('.fav-btn').onclick = (e)=>{ e.stopPropagation(); toggleFav(s.id); };
    const prepBtn = card.querySelector('.prep-btn');
    if(prepBtn){ prepBtn.onclick = (e)=>{ e.stopPropagation(); togglePrep(s.id); }; }
    card.onclick = ()=> abrirFicha(s);
    card.onkeydown = (e)=>{ if(e.key==='Enter') abrirFicha(s); };
    grid.appendChild(card);
  });
}

function bonoCompetencia(nivel){
  if(nivel>=17) return 6; if(nivel>=13) return 5; if(nivel>=9) return 4; if(nivel>=5) return 3; return 2;
}
function mod(score){ return Math.floor((Number(score||10)-10)/2); }
function fmtMod(n){ return (n>=0?'+':'') + n; }

let misPersonajes = [];
let compartidosConmigo = [];
let personajeActivoId = null;
let personajeActivo = null;

function actualizarPersonajeActivo(){
  personajeActivo = [...misPersonajes, ...compartidosConmigo].find(p=>p.id===personajeActivoId) || null;
  renderActiveCharBar();
  render();
}

function renderActiveCharBar(){
  const bar = document.getElementById('activeCharBar');
  if(!personajeActivo){ bar.style.display='none'; return; }
  const p = personajeActivo;
  const bc = bonoCompetencia(p.nivel||1);
  const car = p.caracteristicaConjuros;
  let cd = '—', ataque = '—';
  if(car){
    const m = mod(p.caracteristicas ? p.caracteristicas[car] : 10);
    cd = 8 + bc + m; ataque = fmtMod(bc + m);
  }
  bar.style.display='flex';
  bar.innerHTML = `
    <div class="info">Personaje activo: <b>${p.nombre}</b> · ${p.clase||''} nivel ${p.nivel||1} ${p._soloLectura?'(compartido)':''}
      <div class="stats-pills">
        <span class="pill-stat">CD conjuros ${cd}</span>
        <span class="pill-stat">Ataque ${ataque}</span>
        <span class="pill-stat">Comp. +${bc}</span>
      </div>
    </div>
    <button class="quit-btn" id="quitCharBtn">Desactivar</button>
  `;
  document.getElementById('quitCharBtn').onclick = ()=>{ personajeActivoId=null; actualizarPersonajeActivo(); };
}

// Firestore listeners
let unsubMios = null, unsubCompartidos = null;
function iniciarListenersPersonajes(){
  if(unsubMios) unsubMios();
  if(unsubCompartidos) unsubCompartidos();

  const qMios = query(collection(db,'personajes'), where('propietarioUid','==', currentUser.uid));
  unsubMios = onSnapshot(qMios, (snap)=>{
    misPersonajes = snap.docs.map(d=>({ id: d.id, ...d.data(), _soloLectura:false }));
    renderListasPersonajes();
    actualizarPersonajeActivo();
  }, (err)=>{ console.error('Error listener mios:', err); });

  const qCompartidos = query(collection(db,'personajes'), where('compartidoCon','array-contains', currentUserEmail));
  unsubCompartidos = onSnapshot(qCompartidos, (snap)=>{
    compartidosConmigo = snap.docs.map(d=>({ id: d.id, ...d.data(), _soloLectura:true }));
    renderListasPersonajes();
    actualizarPersonajeActivo();
  }, (err)=>{ console.error('Error listener compartidos:', err); });
}

  const bc = bonoCompetencia(p.nivel||1);

}

      </div>
    `).join('');
  }

    el.onclick = ()=>{
      const id = el.dataset.id;

      abrirEditorPersonaje(p);
    };
  });
}

function renderEditorPersonaje(){

  const ro = p._soloLectura;
  const disabledAttr = ro ? 'disabled' : '';
  const bc = bonoCompetencia(p.nivel||1);

  const abilitiesHtml = ABILITIES.map(a=>`
    <div class="ability-box">

    return `<div class="save-skill-row">
      <input type="checkbox" data-save="${a.key}" ${comp?'checked':''} ${disabledAttr}>

      <span class="ss-bonus">${fmtMod(bonus)}</span>

    const exp = (p.habilidadesExp||[]).includes(s.key);
    const bonus = mod(p.caracteristicas[s.hab]) + (exp ? bc*2 : (comp?bc:0));
    return `<div class="save-skill-row">
      <input type="checkbox" data-skill="${s.key}" ${comp||exp?'checked':''} ${disabledAttr}>
      <input type="checkbox" data-skill-exp="${s.key}" ${exp?'checked':''} ${disabledAttr} title="Experticia" style="accent-color:var(--gold);">
      <span class="ss-name">${s.nombre} <span style="opacity:.5;font-size:10.5px;">(${s.hab})</span></span>
      <span class="ss-bonus">${fmtMod(bonus)}</span>
    </div>`;
  }).join('');

  const conjurosHtml = (p.conjurosPreparados||[]).map(id=>{
    const s = SPELLS.find(x=>x.id===id);
    if(!s) return '';
    return `<span class="prepared-chip">${s.nombre} ${ro?'':'<button data-quitar-conjuro="'+id+'">✕</button>'}</span>`;
  }).join('') || '<span style="font-size:12.5px;color:var(--ink-soft);">Ninguno todavía.</span>';

  const compartidosHtml = (p.compartidoCon||[]).map(email=>`
    <span class="share-chip">${email} ${ro?'':'<button data-quitar-compartir="'+email+'">✕</button>'}</span>
  `).join('') || '<span style="font-size:12.5px;color:var(--ink-soft);">No compartido con nadie.</span>';

  charSheetEl.innerHTML = `
    <button class="close-btn" aria-label="Cerrar">✕</button>
    ${ro ? '<div class="readonly-banner">👁️ Estás viendo un personaje compartido. Solo lectura.</div>' : ''}
    <h2 style="font-family:'Cinzel',serif;margin:6px 0 14px;">${p.nombre || 'Nuevo personaje'}</h2>

    <span class="cf-label">Nombre</span>
    <div class="cf-row"><input type="text" id="pf-nombre" value="${p.nombre||''}" ${disabledAttr}></div>

    <div class="two-col">
      <div>
        <span class="cf-label">Clase</span>
        <div class="cf-row"><select id="pf-clase" ${disabledAttr}>
          <option value="">— Elegir —</option>
          ${Object.keys(CLASE_DATA).map(c=>`<option value="${c}" ${p.clase===c?'selected':''}>${c}</option>`).join('')}
        </select></div>
      </div>
      <div>
        <span class="cf-label">Subclase</span>
        <div class="cf-row"><input type="text" id="pf-subclase" value="${p.subclase||''}" ${disabledAttr}></div>
      </div>
    </div>
    <div class="two-col">
      <div>
        <span class="cf-label">Raza / Linaje</span>
        <div class="cf-row"><select id="pf-raza" ${disabledAttr}>
          <option value="">— Elegir —</option>
          ${Object.keys(RAZA_DATA).map(r=>`<option value="${r}" ${p.raza===r?'selected':''}>${r}</option>`).join('')}
        </select></div>
        <div id="razaInfoBox" style="font-size:11.5px;color:var(--ink-soft);margin:-4px 0 4px;line-height:1.4;">${p.raza && RAZA_DATA[p.raza] ? RAZA_DATA[p.raza].rasgos : ''}</div>
        <div id="linajeWrap" style="${LINAJE_DATA[p.raza] ? '' : 'display:none;'}">
          <span class="cf-label">Linaje</span>
          <div class="cf-row"><select id="pf-linaje" ${disabledAttr}>
            <option value="">— Elegir —</option>
            ${(LINAJE_DATA[p.raza]||[]).map(l=>`<option value="${l.nombre}" ${p.linaje===l.nombre?'selected':''}>${l.nombre}</option>`).join('')}
          </select></div>
          <div id="linajeInfoBox" style="font-size:11.5px;color:var(--ink-soft);margin:-4px 0 4px;line-height:1.4;">${(()=>{ const opts = LINAJE_DATA[p.raza]||[]; const sel = opts.find(l=>l.nombre===p.linaje); return sel ? sel.rasgos : ''; })()}</div>
        </div>
      </div>
      <div>
        <span class="cf-label">Trasfondo</span>
        <div class="cf-row"><select id="pf-trasfondo" ${disabledAttr}>
          <option value="">— Elegir —</option>
          ${Object.keys(TRASFONDO_DATA).map(t=>`<option value="${t}" ${p.trasfondo===t?'selected':''}>${t}</option>`).join('')}
        </select></div>
      </div>
    </div>
    <div class="two-col">
      <div>
        <span class="cf-label">Alineamiento</span>
        <div class="cf-row"><select id="pf-alineamiento" ${disabledAttr}>
          <option value="">— Elegir —</option>
          ${ALINEAMIENTOS.map(a=>`<option value="${a}" ${p.alineamiento===a?'selected':''}>${a}</option>`).join('')}
        </select></div>
      </div>
      <div>
        <span class="cf-label">Nivel</span>
        <div class="cf-row"><input type="number" id="pf-nivel" value="${p.nivel||1}" min="1" max="20" ${disabledAttr}></div>
      </div>
    </div>

    <div class="char-section-title">Características</div>
    <div class="ability-grid">${abilitiesHtml}</div>

    <div class="two-col">
      <div>
        <div class="char-section-title" style="margin-top:0;">Salvaciones</div>
        <div class="save-skill-grid">${savesHtml}</div>
      </div>
      <div>
        <div class="char-section-title" style="margin-top:0;">Combate</div>
        <div class="cf-row">
          <div style="flex:1;"><span class="cf-label">CA</span><input type="number" id="pf-ca" value="${p.ca||10}" ${disabledAttr}></div>
          <div style="flex:1;"><span class="cf-label">Velocidad (m)</span><input type="number" id="pf-vel" value="${p.velocidad||9}" ${disabledAttr}></div>
        </div>
        <div class="cf-row">
          <div style="flex:1;"><span class="cf-label">PG máximos</span><input type="number" id="pf-pgmax" value="${p.pgMax||10}" ${disabledAttr}></div>
          <div style="flex:1;"><span class="cf-label">PG actuales</span><input type="number" id="pf-pgact" value="${p.pgActual!=null?p.pgActual:10}" ${disabledAttr}></div>
        </div>
        <div class="cf-row">
          <div style="flex:1;"><span class="cf-label">PG temporales</span><input type="number" id="pf-pgtemp" value="${p.pgTemp||0}" ${disabledAttr}></div>
          <div style="flex:1;"><span class="cf-label">Dado de golpe</span><input type="text" id="pf-dado" value="${p.dadoGolpe||'d8'}" ${disabledAttr}></div>
        </div>
      </div>
    </div>

    <div class="char-section-title">Habilidades</div>
    <div class="save-skill-grid">${skillsHtml}</div>
    <div style="font-size:10.5px;color:var(--ink-soft);margin:-6px 0 14px;">✔ segunda casilla = experticia (doble competencia)</div>

    <div class="char-section-title">Conjuros</div>
    <div class="cf-row">
      <div style="flex:1;">
        <span class="cf-label">Característica de conjuros</span>
        <select id="pf-caracconj" ${disabledAttr}>
          <option value="">— Ninguna —</option>
          <option value="int" ${p.caracteristicaConjuros==='int'?'selected':''}>Inteligencia</option>
          <option value="sab" ${p.caracteristicaConjuros==='sab'?'selected':''}>Sabiduría</option>
          <option value="car" ${p.caracteristicaConjuros==='car'?'selected':''}>Carisma</option>
        </select>
      </div>
    </div>
    <div style="margin-bottom:6px;">${conjurosHtml}</div>
    ${ro?'':`<input type="text" id="pf-buscar-conjuro" placeholder="Buscar conjuro para agregar…" style="width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--ink-soft);background:#fffdf5;font-size:13px;">
    <div class="spell-picker-list" id="spellPickerList"></div>`}

    <div class="char-section-title">Equipo</div>
    <div class="cf-row"><textarea id="pf-equipo" ${disabledAttr}>${p.equipo||''}</textarea></div>

    <div class="char-section-title">Rasgos y dotes</div>
    <div class="cf-row"><textarea id="pf-rasgos" ${disabledAttr}>${p.rasgos||''}</textarea></div>

    <div class="char-section-title">Notas</div>
    <div class="cf-row"><textarea id="pf-notas" ${disabledAttr}>${p.notas||''}</textarea></div>

    ${!ro ? `
    <div class="char-section-title">Compartir personaje</div>
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:4px;">La persona debe tener una cuenta creada en el Grimorio con ese email (por ejemplo, tu master).</div>
    <div class="share-row">
      <input type="email" id="pf-compartir-email" placeholder="email@ejemplo.com">
      <button class="cc-btn primary" id="btnCompartir" style="padding:0 14px;border-radius:8px;background:var(--gold);border:none;font-weight:700;">Compartir</button>
    </div>
    <div style="margin-top:6px;">${compartidosHtml}</div>
    ` : ''}

    <div class="char-actions-row">
      ${!ro ? '<button class="btn-save" id="btnGuardarPersonaje">Guardar</button>' : ''}
      ${!ro && p.id ? '<button class="btn-delete" id="btnBorrarPersonaje">Borrar personaje</button>' : ''}
    </div>
  `;

  charSheetEl.querySelector('.close-btn').onclick = cerrarEditorPersonaje;

  if(!ro){
    // campos simples: se sincronizan al objeto en cada cambio para que un
    // re-render disparado por OTRO campo (características, habilidades, etc.)
    // no los pise con el valor viejo.
    const simpleFieldBindings = [
      ['#pf-nombre','nombre','text'], ['#pf-subclase','subclase','text'],
      ['#pf-nivel','nivel','int'], ['#pf-ca','ca','int'], ['#pf-vel','velocidad','int'],
      ['#pf-pgmax','pgMax','int'], ['#pf-pgact','pgActual','int'], ['#pf-pgtemp','pgTemp','int'],
      ['#pf-dado','dadoGolpe','text'], ['#pf-equipo','equipo','text'],
      ['#pf-rasgos','rasgos','text'], ['#pf-notas','notas','text']
    ];
    simpleFieldBindings.forEach(([sel,key,tipo])=>{
      const inp = charSheetEl.querySelector(sel);
      if(!inp) return;
      inp.oninput = ()=>{
        editorPersonajeActual[key] = tipo==='int' ? (Number(inp.value)||0) : inp.value;
      };
    });

    charSheetEl.querySelectorAll('[data-ab]').forEach(inp=>{
      inp.oninput = ()=>{ editorPersonajeActual.caracteristicas[inp.dataset.ab] = Number(inp.value)||10; renderEditorPersonaje(); };
    });
    charSheetEl.querySelectorAll('[data-save]').forEach(inp=>{
      inp.onchange = ()=>{
        const k = inp.dataset.save;
        editorPersonajeActual.salvacionesComp = editorPersonajeActual.salvacionesComp || [];
        const arr = editorPersonajeActual.salvacionesComp;
        const i = arr.indexOf(k);
        if(inp.checked && i<0) arr.push(k);
        if(!inp.checked && i>=0) arr.splice(i,1);
        renderEditorPersonaje();
      };
    });
    charSheetEl.querySelectorAll('[data-skill]').forEach(inp=>{
      inp.onchange = ()=>{
        const k = inp.dataset.skill;
        editorPersonajeActual.habilidadesComp = editorPersonajeActual.habilidadesComp || [];
        const arr = editorPersonajeActual.habilidadesComp;
        const i = arr.indexOf(k);
        if(inp.checked && i<0) arr.push(k);
        if(!inp.checked && i>=0){ arr.splice(i,1); }
        if(!inp.checked){
          const eArr = editorPersonajeActual.habilidadesExp||[];
          const ei = eArr.indexOf(k); if(ei>=0) eArr.splice(ei,1);
        }
        renderEditorPersonaje();
      };
    });
    charSheetEl.querySelectorAll('[data-skill-exp]').forEach(inp=>{
      inp.onchange = ()=>{
        const k = inp.dataset.skillExp;
        editorPersonajeActual.habilidadesExp = editorPersonajeActual.habilidadesExp || [];
        const arr = editorPersonajeActual.habilidadesExp;
        const i = arr.indexOf(k);
        if(inp.checked && i<0){
          arr.push(k);
          const cArr = editorPersonajeActual.habilidadesComp||[];
          if(!cArr.includes(k)) cArr.push(k);
        }
        if(!inp.checked && i>=0) arr.splice(i,1);
        renderEditorPersonaje();
      };
    });

    const buscarInput = charSheetEl.querySelector('#pf-buscar-conjuro');
    const pickerList = charSheetEl.querySelector('#spellPickerList');
    function renderPicker(term){
      const t = (term||'').toLowerCase();
      const matches = t.length<2 ? [] : SPELLS.filter(s=>s.nombre.toLowerCase().includes(t)).slice(0,25);
      pickerList.innerHTML = matches.map(s=>{
        const checked = (editorPersonajeActual.conjurosPreparados||[]).includes(s.id);
        return `<div class="spell-picker-item ${checked?'checked':''}" data-add-conjuro="${s.id}"><span>${s.nombre} <span style="opacity:.5;">(nvl ${s.nivel})</span></span>${checked?'✓':'+'}</div>`;
      }).join('');
      pickerList.querySelectorAll('[data-add-conjuro]').forEach(el=>{
        el.onclick = ()=>{
          const id = el.dataset.addConjuro;
          editorPersonajeActual.conjurosPreparados = editorPersonajeActual.conjurosPreparados || [];
          const arr = editorPersonajeActual.conjurosPreparados;
          const i = arr.indexOf(id);
          if(i<0) arr.push(id); else arr.splice(i,1);
          // guardamos al toque si el personaje ya existe, para no depender
          // de que se acuerden de tocar "Guardar" antes de cerrar la ficha
          if(editorPersonajeActual.id) guardarPersonajeFirestore(editorPersonajeActual);
          renderEditorPersonaje();
          // renderEditorPersonaje() reconstruyó el DOM: el buscarInput viejo
          // quedó desconectado, hay que re-buscar el nuevo y re-disparar la búsqueda
          const nuevoBuscar = charSheetEl.querySelector('#pf-buscar-conjuro');
          if(nuevoBuscar){
            nuevoBuscar.value = term;
            nuevoBuscar.focus();
            nuevoBuscar.dispatchEvent(new Event('input'));
          }
        };
      });
    }
    if(buscarInput){ buscarInput.oninput = ()=> renderPicker(buscarInput.value); }
    charSheetEl.querySelectorAll('[data-quitar-conjuro]').forEach(btn=>{
      btn.onclick = ()=>{
        const id = btn.dataset.quitarConjuro;
        const arr = editorPersonajeActual.conjurosPreparados||[];
        const i = arr.indexOf(id); if(i>=0) arr.splice(i,1);
        if(editorPersonajeActual.id) guardarPersonajeFirestore(editorPersonajeActual);
        renderEditorPersonaje();
      };
    });

    charSheetEl.querySelector('#pf-caracconj').onchange = (e)=>{ editorPersonajeActual.caracteristicaConjuros = e.target.value; };

    const selClase = charSheetEl.querySelector('#pf-clase');
    if(selClase){
      selClase.onchange = (e)=>{
        editorPersonajeActual.clase = e.target.value;
        const d = CLASE_DATA[e.target.value];
        if(d){
          editorPersonajeActual.dadoGolpe = d.dado;
          editorPersonajeActual.salvacionesComp = [...d.salvaciones];
        }
        renderEditorPersonaje();
      };
    }
    const selRaza = charSheetEl.querySelector('#pf-raza');
    if(selRaza){
      selRaza.onchange = (e)=>{
        editorPersonajeActual.raza = e.target.value;
        editorPersonajeActual.linaje = ''; // se resetea al cambiar de raza
        const d = RAZA_DATA[e.target.value];
        if(d){ editorPersonajeActual.velocidad = d.velocidad; }
        renderEditorPersonaje();
      };
    }
    const selLinaje = charSheetEl.querySelector('#pf-linaje');
    if(selLinaje){
      selLinaje.onchange = (e)=>{
        editorPersonajeActual.linaje = e.target.value;
        renderEditorPersonaje();
      };
    }
    const selTrasfondo = charSheetEl.querySelector('#pf-trasfondo');
    if(selTrasfondo){
      selTrasfondo.onchange = (e)=>{
        editorPersonajeActual.trasfondo = e.target.value;
        const d = TRASFONDO_DATA[e.target.value];
        if(d){
          editorPersonajeActual.habilidadesComp = editorPersonajeActual.habilidadesComp || [];
          d.habilidades.forEach(h=>{ if(!editorPersonajeActual.habilidadesComp.includes(h)) editorPersonajeActual.habilidadesComp.push(h); });
        }
        renderEditorPersonaje();
      };
    }
    const selAlineamiento = charSheetEl.querySelector('#pf-alineamiento');
    if(selAlineamiento){
      selAlineamiento.onchange = (e)=>{ editorPersonajeActual.alineamiento = e.target.value; };
    }

    const btnCompartir = charSheetEl.querySelector('#btnCompartir');
    if(btnCompartir){
      btnCompartir.onclick = ()=>{
        const inp = charSheetEl.querySelector('#pf-compartir-email');
        const email = inp.value.trim().toLowerCase();
        if(!email || !email.includes('@')) return;
        editorPersonajeActual.compartidoCon = editorPersonajeActual.compartidoCon || [];
        if(!editorPersonajeActual.compartidoCon.includes(email)) editorPersonajeActual.compartidoCon.push(email);
        inp.value='';
        renderEditorPersonaje();
      };
    }
    charSheetEl.querySelectorAll('[data-quitar-compartir]').forEach(btn=>{
      btn.onclick = ()=>{
        const email = btn.dataset.quitarCompartir;
        const arr = editorPersonajeActual.compartidoCon||[];
        const i = arr.indexOf(email); if(i>=0) arr.splice(i,1);
        renderEditorPersonaje();
      };
    });

    charSheetEl.querySelector('#btnGuardarPersonaje').onclick = async ()=>{
      const p2 = editorPersonajeActual;
      p2.nombre = charSheetEl.querySelector('#pf-nombre').value.trim() || 'Sin nombre';
      p2.clase = charSheetEl.querySelector('#pf-clase').value.trim();
      p2.subclase = charSheetEl.querySelector('#pf-subclase').value.trim();
      p2.raza = charSheetEl.querySelector('#pf-raza').value.trim();
      p2.linaje = editorPersonajeActual.linaje || '';
      p2.trasfondo = charSheetEl.querySelector('#pf-trasfondo').value.trim();
      p2.alineamiento = charSheetEl.querySelector('#pf-alineamiento').value.trim();
      p2.nivel = Math.min(20, Math.max(1, Number(charSheetEl.querySelector('#pf-nivel').value)||1));
      p2.ca = Number(charSheetEl.querySelector('#pf-ca').value)||10;
      p2.velocidad = Number(charSheetEl.querySelector('#pf-vel').value)||9;
      p2.pgMax = Number(charSheetEl.querySelector('#pf-pgmax').value)||10;
      p2.pgActual = Number(charSheetEl.querySelector('#pf-pgact').value)||0;
      p2.pgTemp = Number(charSheetEl.querySelector('#pf-pgtemp').value)||0;
      p2.dadoGolpe = charSheetEl.querySelector('#pf-dado').value.trim() || 'd8';
      p2.equipo = charSheetEl.querySelector('#pf-equipo').value;
      p2.rasgos = charSheetEl.querySelector('#pf-rasgos').value;
      p2.notas = charSheetEl.querySelector('#pf-notas').value;
      await guardarPersonajeFirestore(p2);
      cerrarEditorPersonaje();
    };

    const btnBorrar = charSheetEl.querySelector('#btnBorrarPersonaje');
    if(btnBorrar){
      btnBorrar.onclick = async ()=>{
        if(!confirm('¿Seguro que querés borrar este personaje? No se puede deshacer.')) return;
        await deleteDoc(doc(db, 'personajes', editorPersonajeActual.id));
        if(personajeActivoId === editorPersonajeActual.id){ personajeActivoId = null; }
        cerrarEditorPersonaje();
      };
    }
  }
}

async function guardarPersonajeFirestore(p){
  const data = { ...p };
  delete data._soloLectura;
  const id = data.id;
  delete data.id;
  data.actualizadoEn = serverTimestamp();
  if(!id){
    data.creadoEn = serverTimestamp();
    const ref = await addDoc(collection(db,'personajes'), data);
    editorPersonajeActual.id = ref.id;
    // un personaje recién creado queda activo automáticamente, si no
    // nunca se podría usar el filtro "Preparados" sin ir a activarlo aparte
    personajeActivoId = ref.id;
    actualizarPersonajeActivo();
  } else {
    await updateDoc(doc(db,'personajes', id), data);
  }
}

cargarFavoritos();
</script>
</body>
</html>
