{id:"virote-encantado",nombre:"Virote Encantado",nivel:1,escuela:"Evocación",clases:["Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"9 metros",componentes:"V, S, M (un trozo de cobre en forma de anzuelo pequeño)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Un rayo de energía crepitante se dispara hacia una criatura al alcance. Realizá un ataque de conjuro a distancia; si acierta, el objetivo sufre 1d12 de daño eléctrico y queda afectado por este hechizo mientras dure. Como acción en turnos posteriores, podés infligir automáticamente 1d12 de daño eléctrico adicional al objetivo.",mejora:"El daño inicial aumenta en 1d12 por cada espacio de conjuro por encima del nivel 1.",fuente:"SRD 5.2"},
{id:"vida-falsa",nombre:"Falsa Vida",nivel:1,escuela:"Nigromancia",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S, M (un trocito de carne de cerdo o carne curada)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Reforzás tu vitalidad mediante una simulación macabra de vida. Ganás 1d4+4 puntos de golpe temporales por la duración del hechizo.",mejora:"Ganás 5 puntos de golpe temporales adicionales por cada espacio de conjuro por encima del nivel 1.",fuente:"SRD 5.2"},
{id:"orden",nombre:"Orden",nivel:1,escuela:"Adivinación",clases:["Clérigo","Paladín"],tiempo:"1 acción",alcance:"18 metros",componentes:"V",duracion:"1 asalto",concentracion:false,ritual:false,desc:"Le das una orden de una sola palabra a una criatura que puedas ver al alcance, como huir, caer, quieto, rendirse o nadar. El objetivo debe superar una salvación de Sabiduría o seguir la orden en su próximo turno.",mejora:"Podés apuntar a una criatura adicional por cada espacio por encima del nivel 1.",fuente:"SRD 5.2"},
{id:"risa-histerica",nombre:"Risa Horrible de Tasha",nivel:1,escuela:"Encantamiento",clases:["Bardo","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"9 metros",componentes:"V, S, M (una pluma de gallina)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"El objetivo que elijas al alcance percibe todo como hilarante y estalla en carcajadas si este hechizo le afecta. El objetivo debe superar una salvación de Sabiduría o quedar afectado, cayendo derribado y con la condición de incapacitado mientras ríe incontrolablemente.",fuente:"SRD 5.2"},

{id:"visibilidad-detectar",nombre:"Sordera/ceguera",nivel:2,escuela:"Nigromancia",clases:["Bardo","Clérigo","Hechicero","Mago"],tiempo:"1 acción",alcance:"9 metros",componentes:"V",duracion:"1 minuto",concentracion:false,ritual:false,desc:"Podés cegar o ensordecer a un enemigo. Elegí una criatura que puedas ver al alcance para que haga una salvación de Constitución. Si falla, queda cegada o ensordecida (a tu elección) mientras dure el hechizo.",mejora:"Podés apuntar a una criatura adicional por cada espacio de conjuro por encima del nivel 2.",fuente:"SRD 5.2"},
{id:"borron",nombre:"Emborronar",nivel:2,escuela:"Ilusionismo",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Tu forma se vuelve borrosa, cambiando y ondulando ante los ojos de todos los que te miran. Mientras dure el hechizo, cualquier criatura tiene desventaja en las tiradas de ataque contra vos. Un atacante es inmune a este efecto si no depende de la vista, como con visión ciega, o si puede ver a través de ilusiones, como con visión verdadera.",fuente:"SRD 5.2"},
{id:"agrandar-reducir",nombre:"Agrandar/Reducir",nivel:2,escuela:"Transmutación",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"9 metros",componentes:"V, S, M (esencia de haba curada al humo o una pizca de médula de gigante)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Hacés que una criatura u objeto que puedas ver al alcance crezca o se encoja durante la duración del hechizo. Elegí una criatura o un objeto no portado ni llevado por nadie. Si la criatura no está dispuesta, tiene derecho a una salvación de Constitución. Si tiene éxito, el hechizo no tiene efecto.",fuente:"SRD 5.2"},
{id:"esfera-llameante",nombre:"Esfera de Llamas",nivel:2,escuela:"Conjuración",clases:["Druida","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S, M (un poco de grasa animal)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Una esfera de fuego de 1,5 metros de diámetro aparece en un espacio abierto de tu elección al alcance y persiste mientras dure el hechizo. Cualquier criatura que termine su turno a 1,5 metros de la esfera debe superar una salvación de Destreza o sufrir 2d6 de daño de fuego.",mejora:"El daño aumenta en 1d6 por cada espacio de conjuro por encima del nivel 2.",fuente:"SRD 5.2"},
{id:"flecha-acida-melf",nombre:"Flecha Ácida de Melf",nivel:2,escuela:"Evocación",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"27 metros",componentes:"V, S, M (polvo de raíz de ombú y estiércol de gusano)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Una flecha silbante de ácido se dispara hacia un objetivo al alcance. Realizá un ataque de conjuro a distancia; si acierta, el objetivo sufre 4d4 de daño ácido de inmediato y 2d4 de daño ácido adicional al final de su próximo turno.",mejora:"El daño inicial aumenta en 1d4 por cada espacio de conjuro por encima del nivel 2.",fuente:"SRD 5.2"},
{id:"truco-cuerda",nombre:"Truco de la Cuerda",nivel:2,escuela:"Conjuración",clases:["Bardo","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S, M (un trozo de cuerda de seda fina de 15 cm)",duracion:"1 hora",concentracion:false,ritual:false,desc:"Lanzás un extremo de una cuerda de seda de 18 metros hacia el aire. El extremo superior se sostiene por sí solo, y la cuerda es lo bastante rígida para subir por ella. En la parte superior aparece una entrada a un espacio extradimensional que dura mientras el hechizo esté activo.",fuente:"SRD 5.2"},
{id:"trepar-arana",nombre:"Trepar cual Arácnido",nivel:2,escuela:"Transmutación",clases:["Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S, M (una gota de brea o resina de abeto)",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Hasta que el hechizo termine, una criatura voluntaria que toques gana la habilidad de moverse arriba, abajo y a través de superficies verticales y boca abajo por techos, dejando las manos libres. El objetivo también gana una velocidad trepando igual a su velocidad caminando.",fuente:"SRD 5.2"},
{id:"calentar-metal",nombre:"Calentar Metal",nivel:2,escuela:"Transmutación",clases:["Druida"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S, M (un trozo de hierro y una llama)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Elegís un objeto de metal manufacturado, como un arma o un juego de herraduras, que puedas ver al alcance. Hacés que el objeto se ponga incandescente al rojo vivo. Cualquier criatura en contacto físico con el objeto sufre 2d8 de daño de fuego cuando lo lanzás y de nuevo cada vez que uses tu acción para mantener este efecto hasta el final del hechizo.",fuente:"SRD 5.2"},

{id:"maldecir",nombre:"Imponer Maldición",nivel:3,escuela:"Nigromancia",clases:["Bardo","Clérigo","Hechicero","Mago"],tiempo:"1 acción",alcance:"9 metros",componentes:"V, S, M (fetiche funerario)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Maldecís a una criatura que puedas ver al alcance. Hasta que el hechizo termine, elegís uno de varios efectos al lanzarlo: desventaja en pruebas de característica o salvaciones de una característica elegida, desventaja en tiradas de ataque contra vos, o daño necrótico adicional de tu elección cuando le impactes con un ataque.",mejora:"Con espacios de nivel 4-8 la duración se extiende, y con nivel 9 se vuelve permanente hasta que se disipe.",fuente:"SRD 5.2"},
{id:"fingir-muerte",nombre:"Fingir Muerte",nivel:3,escuela:"Nigromancia",clases:["Bardo","Clérigo","Druida"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S, M (una pizca de tierra de cementerio)",duracion:"1 hora",concentracion:false,ritual:false,desc:"Tocás a una criatura voluntaria y la hacés caer en un estado cataléptico indistinguible de la muerte. Durante la duración, el objetivo parece muerto ante cualquier inspección externa y ante hechizos usados para determinar el estado de la criatura.",fuente:"SRD 5.2"},
{id:"idiomas",nombre:"Don de Lenguas",nivel:3,escuela:"Adivinación",clases:["Bardo","Clérigo"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S, M (una pequeña porción de hollín y hierbas de olor)",duracion:"1 hora",concentracion:false,ritual:false,desc:"Este hechizo otorga a la criatura que toques la capacidad de entender cualquier idioma hablado que oiga. Además, cuando el objetivo habla, cualquier criatura que conozca al menos un idioma y pueda oírlo entiende lo que dice.",fuente:"SRD 5.2"},
{id:"respirar-agua",nombre:"Respirar bajo el Agua",nivel:3,escuela:"Transmutación",clases:["Druida","Explorador","Hechicero","Mago"],tiempo:"1 acción",alcance:"9 metros",componentes:"V, S, M (una pajita corta de junco)",duracion:"24 horas",concentracion:false,ritual:true,desc:"Este hechizo otorga a hasta diez criaturas dispuestas que puedas ver al alcance la capacidad de respirar bajo el agua hasta que el hechizo termine. Las criaturas afectadas también conservan su modo normal de respiración.",fuente:"SRD 5.2"},
{id:"enviar-mensaje",nombre:"Recado",nivel:3,escuela:"Adivinación",clases:["Bardo","Clérigo","Hechicero","Mago"],tiempo:"1 acción",alcance:"Ilimitado",componentes:"V, S, M (un trozo de cobre y una aguja de hierro fina)",duracion:"1 asalto",concentracion:false,ritual:false,desc:"Enviás un mensaje breve de veinticinco palabras o menos a una criatura con la que estés familiarizado. La criatura oye el mensaje en su mente, reconoce quién lo envía y puede responder de la misma forma inmediatamente.",fuente:"SRD 5.2"},

{id:"escudo-fuego",nombre:"Escudo de Fuego",nivel:4,escuela:"Evocación",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S, M (una pizca de fósforo o un insecto luminoso)",duracion:"Hasta 10 minutos",concentracion:false,ritual:false,desc:"Un manto etéreo de llamas rodea tu cuerpo mientras dure el hechizo, arrojando luz brillante en un radio de 3 metros y luz tenue 3 metros más. Podés elegir que las llamas emitan calor o frío. Mientras el manto arda, tenés resistencia al otro tipo de daño (frío o fuego) y cualquier criatura que te golpee con un ataque cuerpo a cuerpo sufre 2d8 de daño del tipo elegido.",fuente:"SRD 5.2"},
{id:"forma-piedra",nombre:"Moldear la Piedra",nivel:4,escuela:"Transmutación",clases:["Clérigo","Druida","Mago"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S, M (piedra caliza, arcilla o granito sin trabajar)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Tocás un objeto de piedra de tamaño Mediano o menor, o una sección de piedra de hasta 3 metros de lado, y lo moldeás en cualquier forma que sirva a tus propósitos.",fuente:"SRD 5.2"},
{id:"localizar-criatura",nombre:"Localizar Criatura",nivel:4,escuela:"Adivinación",clases:["Clérigo","Paladín","Explorador","Brujo","Mago"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S, M (un trocito de piel de sabueso)",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Describís o nombráis a una criatura familiar que puedas ver al alcance. Sentís la dirección hacia la ubicación de esa criatura, siempre que esté a menos de 1000 pies, y siempre que no esté detrás de agua corriente que os separe.",fuente:"SRD 5.2"},

{id:"plaga-insectos",nombre:"Plaga de Insectos",nivel:5,escuela:"Conjuración",clases:["Clérigo","Druida"],tiempo:"1 acción",alcance:"90 metros",componentes:"V, S, M (una langosta o saltamontes)",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Insectos voraces y mordedores llenan una esfera de 6 metros de radio centrada en un punto al alcance. La esfera persiste mientras dure el hechizo. Cada criatura que empiece su turno en el área debe superar una salvación de Constitución, sufriendo 4d10 de daño de perforación si falla, o la mitad si acierta.",mejora:"El daño aumenta en 1d10 por cada espacio de conjuro por encima del nivel 5.",fuente:"SRD 5.2"},
{id:"telequinesis",nombre:"Telequinesis",nivel:5,escuela:"Transmutación",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Ganás la capacidad de mover o manipular criaturas u objetos con el poder de tu mente. Cuando lanzás el hechizo y como acción en turnos posteriores, podés ejercer tu voluntad sobre una criatura u objeto que puedas ver al alcance, moviéndolo o forzando una prueba de característica según su tamaño.",fuente:"SRD 5.2"},
{id:"erudicion-leyendas",nombre:"Conocer las Leyendas",nivel:5,escuela:"Adivinación",clases:["Bardo","Clérigo","Mago"],tiempo:"1 minuto",alcance:"Uno mismo",componentes:"V, S, M (incienso por valor de 250 po que se consume, y libros de consulta por valor de al menos 500 po)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Nombrás o describís a una persona, lugar u objeto. El hechizo trae a tu memoria una leyenda relacionada con lo que nombraste, información que podría incluir la historia del lugar u objeto, o los sucesos importantes relacionados con la persona.",fuente:"SRD 5.2"},

{id:"palabra-retroceso",nombre:"Palabra de Regreso",nivel:6,escuela:"Abjuración",clases:["Clérigo"],tiempo:"1 acción",alcance:"Toque",componentes:"V",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Pronunciás una palabra de poder que puede transportar a otros a un lugar de seguridad al alcance de tu voz, y podés lanzar este hechizo antes de completar tus movimientos en el mismo turno. Elegís hasta cinco criaturas dispuestas que puedas ver al alcance. Un santuario preestablecido y designado como parte de una ceremonia religiosa reaparece en tu mente, transportando instantáneamente a las criaturas elegidas a ese lugar.",fuente:"SRD 5.2"},
{id:"crear-muerto-viviente",nombre:"Crear Muerto Viviente",nivel:6,escuela:"Nigromancia",clases:["Clérigo"],tiempo:"1 minuto",alcance:"3 metros",componentes:"V, S, M (piedras semipreciosas incrustadas en los ojos del cadáver, por valor de al menos 150 po)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Este hechizo os permite corromper cadáveres para crear hasta tres gules bajo vuestro control. Cada gul actúa como aliado bajo vuestras órdenes verbales, siguiéndoos y obedeciéndoos.",fuente:"SRD 5.2"},

{id:"mansion-magnifica",nombre:"Mansión Magnífica de Mordenkainen",nivel:7,escuela:"Conjuración",clases:["Bardo","Mago"],tiempo:"1 minuto",alcance:"90 metros",componentes:"V, S, M (una miniatura de puerta y una llave, ambas de marfil)",duracion:"Hasta 24 horas",concentracion:false,ritual:false,desc:"Conjurás una morada extradimensional dentro del alcance que dura mientras el hechizo esté activo. Elegís la ubicación de una entrada al edificio, en la forma de una puerta de 3 metros de alto y 1,5 metros de ancho. La morada contiene tantas habitaciones amuebladas como desees, atendidas por servidores espectrales.",fuente:"SRD 5.2"},

{id:"luz",nombre:"Luz",nivel:0,escuela:"Evocación",clases:["Bardo","Clérigo","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"Toque",componentes:"V, M (una luciérnaga o musgo fosforescente)",duracion:"1 hora",concentracion:false,ritual:false,desc:"Tocás un objeto que no mida más de 3 metros en ninguna dimensión. Hasta que el hechizo termine, el objeto emite luz brillante en un radio de 6 metros y luz tenue 6 metros más. La luz puede ser de cualquier color que elijas. Cubrir completamente el objeto con algo opaco bloquea la luz.",fuente:"SRD 5.2"},
{id:"guardia-cuchillas",nombre:"Guardia de Cuchillas",nivel:0,escuela:"Abjuración",clases:["Hechicero","Brujo","Mago"],tiempo:"1 acción adicional",alcance:"Uno mismo",componentes:"V, S",duracion:"Hasta 1 asalto",concentracion:true,ritual:false,desc:"Vientos filosos rodean tu cuerpo hasta el final de tu próximo turno, otorgándote resistencia al daño contundente, perforante y cortante infligido por ataques con armas.",fuente:"SRD 5.2"},
{id:"crear-llama",nombre:"Crear Llama",nivel:0,escuela:"Conjuración",clases:["Druida"],tiempo:"1 acción",alcance:"9 metros",componentes:"V, S",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Creás una llama parpadeante en la palma de tu mano y la lanzás hacia un objetivo al alcance. Realizá un ataque de conjuro a distancia contra el objetivo; si acierta, sufre 1d8 de daño de fuego.",mejora:"El daño aumenta en 1d8 en los niveles 5, 11 y 17.",fuente:"SRD 5.2"},
{id:"piedad-moribundos",nombre:"Piedad con los Moribundos",nivel:0,escuela:"Nigromancia",clases:["Clérigo"],tiempo:"1 acción",alcance:"9 metros",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Tocás con tu magia a una criatura que tenga 0 puntos de golpe. La criatura se estabiliza y queda consciente si es posible.",fuente:"SRD 5.2"},

{id:"disfrazarse",nombre:"Disfrazarse",nivel:1,escuela:"Ilusionismo",clases:["Bardo","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S",duracion:"Hasta 1 hora",concentracion:false,ritual:false,desc:"Cambiás tu apariencia mientras dure el hechizo. Elegís cualquier forma humanoide de tamaño similar al tuyo, o podés hacer sutiles cambios en tus propios rasgos. La ilusión afecta cómo te ves, sientes al tacto, suenas y hueles, pero no puede duplicar una criatura específica que no conozcas.",fuente:"SRD 5.2"},
{id:"heroismo",nombre:"Heroísmo",nivel:1,escuela:"Encantamiento",clases:["Bardo","Paladín"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Una criatura voluntaria que toques se llena de valentía. Hasta que el hechizo termine, el objetivo es inmune a quedar asustado y gana puntos de golpe temporales iguales a tu modificador de la característica de lanzamiento de conjuros al inicio de cada uno de sus turnos.",fuente:"SRD 5.2"},
{id:"imagen-silenciosa",nombre:"Imagen Silenciosa",nivel:1,escuela:"Ilusionismo",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S, M (un mechón de lana)",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Creás la imagen de un objeto, criatura u otro fenómeno visible que no mida más de un cubo de 4,5 metros de lado, siempre que puedas verla al alcance. La imagen aparece en un punto que elijas y persiste mientras dure el hechizo. No tiene sonido, olor ni efectos especiales.",fuente:"SRD 5.2"},
{id:"perdicion",nombre:"Perdición",nivel:1,escuela:"Encantamiento",clases:["Clérigo"],tiempo:"1 acción",alcance:"9 metros",componentes:"V, S, M (una gota de sangre)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Hasta tres criaturas de tu elección que puedas ver al alcance deben hacer una salvación de Carisma. Los objetivos que fallen quedan afectados mientras dure el hechizo. Cuando un objetivo afectado hace una tirada de ataque o una salvación antes de que el hechizo termine, debe tirar 1d4 y restarlo del resultado.",fuente:"SRD 5.2"},
{id:"sirviente-invisible",nombre:"Sirviente Invisible",nivel:1,escuela:"Conjuración",clases:["Bardo","Hechicero","Mago"],tiempo:"1 acción",alcance:"9 metros",componentes:"V, S, M (un trozo de cuerda y madera)",duracion:"1 hora",concentracion:false,ritual:true,desc:"Este hechizo crea una fuerza invisible, sin sentidos, del tamaño de un espacio Mediano, que dura mientras el hechizo esté activo en un punto que elijas al alcance. El sirviente realiza tareas simples que le ordenes: puede recoger y mover objetos, limpiar, remendar y servir comida.",fuente:"SRD 5.2"},
{id:"susurros-discordantes",nombre:"Susurros Discordantes",nivel:1,escuela:"Encantamiento",clases:["Bardo"],tiempo:"1 reacción (cuando una criatura al alcance te ataca)",alcance:"18 metros",componentes:"V, M (un fragmento de concha rota)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Susurrás una frase disonante que solo una criatura al alcance puede oír, azotando su mente con dolor psíquico. El objetivo debe superar una salvación de Sabiduría o sufrir 3d6 de daño psíquico y no poder usar reacciones hasta el inicio de su próximo turno.",mejora:"El daño aumenta en 1d6 por cada espacio de conjuro por encima del nivel 1.",fuente:"SRD 5.2"},
{id:"texto-ilusorio",nombre:"Texto Ilusorio",nivel:1,escuela:"Ilusionismo",clases:["Bardo","Brujo","Mago"],tiempo:"1 minuto",alcance:"Toque",componentes:"V, S, M (tinta de calamar y una pluma)",duracion:"Hasta que se disipe",concentracion:false,ritual:true,desc:"Escribís un texto en una superficie y lo impregnás con una ilusión sutil que altera cómo aparece ante los lectores. Vos y las criaturas que designes ven el texto real, mientras que cualquier otra criatura ve un mensaje diferente que elijas al lanzar el hechizo.",fuente:"SRD 5.2"},
{id:"zancada-prodigiosa",nombre:"Zancada Prodigiosa",nivel:1,escuela:"Transmutación",clases:["Bardo","Druida","Explorador","Hechicero","Mago"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S, M (una pequeña correa de cuero atada alrededor del pie)",duracion:"1 hora",concentracion:false,ritual:false,desc:"La velocidad de una criatura que toques aumenta en 3 metros mientras dure el hechizo. El hechizo también le otorga resistencia a cualquier efecto que reduzca su velocidad.",fuente:"SRD 5.2"},
{id:"detectar-venenos",nombre:"Detectar Venenos y Enfermedades",nivel:1,escuela:"Adivinación",clases:["Clérigo","Druida","Paladín","Explorador"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S, M (una hoja de acebo)",duracion:"Hasta 10 minutos",concentracion:true,ritual:true,desc:"Durante el hechizo, sabés la ubicación y el tipo de venenos, criaturas venenosas y enfermedades dentro de 9 metros de vos. Sabés la ubicación de cualquier cosa así en un objeto o criatura que puedas ver al alcance, pero no cuánto veneno o enfermedad presente hay.",fuente:"SRD 5.2"},

{id:"compulsion",nombre:"Compulsión",nivel:4,escuela:"Encantamiento",clases:["Bardo"],tiempo:"1 acción adicional",alcance:"9 metros",componentes:"V, S",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Creás un efecto de encantamiento que aprovecha las profundidades de la mente de una criatura. Cada criatura que puedas ver al alcance debe superar una salvación de Sabiduría o quedar afectada. En cada uno de tus turnos posteriores, podés usar tu acción para dirigir la dirección de movimiento de las criaturas afectadas.",fuente:"SRD 5.2"},
{id:"hechizar-monstruo",nombre:"Hechizar Monstruo",nivel:4,escuela:"Encantamiento",clases:["Bardo","Druida","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"9 metros",componentes:"V, S, M (una pieza de plata por valor de al menos 10 po)",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Intentás encantar a una criatura que puedas ver al alcance. Debe superar una salvación de Sabiduría o quedar hechizada por vos mientras dure el hechizo. La criatura hechizada te considera un conocido amistoso.",fuente:"SRD 5.2"},
{id:"terreno-alucinatorio",nombre:"Terreno Alucinatorio",nivel:4,escuela:"Ilusionismo",clases:["Druida","Hechicero","Mago"],tiempo:"10 minutos",alcance:"45 metros",componentes:"V, S, M (una piedra, una rama y un trozo de tela verde)",duracion:"Hasta 24 horas",concentracion:false,ritual:false,desc:"Hacés que el terreno natural en un cubo de 45 metros de lado al alcance parezca, suene, huela y sienta al tacto como otro tipo de terreno natural. Las características físicas subyacentes del terreno no cambian, por lo que las criaturas físicamente interactuando con él descubrirán la ilusión mediante el tacto.",fuente:"SRD 5.2"},
{id:"encontrar-camino",nombre:"Encontrar el Camino",nivel:6,escuela:"Adivinación",clases:["Bardo","Clérigo","Druida"],tiempo:"1 minuto",alcance:"Uno mismo",componentes:"V, S, M (un juego de huesos adivinatorios, varillas de bambú o hierbas talladas por valor de al menos 100 po)",duracion:"Hasta 1 día",concentracion:false,ritual:false,desc:"Este hechizo te ayuda a encontrar el camino hacia un destino específico. Podés lanzar este hechizo sobre vos mismo o sobre una criatura voluntaria. Mientras dure, la criatura afectada conoce la dirección y distancia más corta hacia su destino elegido, mientras ambos estén en el mismo plano de existencia.",fuente:"SRD 5.2"},
{id:"festin-heroes",nombre:"Festín de Héroes",nivel:6,escuela:"Conjuración",clases:["Clérigo","Druida"],tiempo:"10 minutos",alcance:"9 metros",componentes:"V, S, M (un cofre dorado con especias e incienso por valor de 1000 po, que se consume)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Invocás un festín, que incluye comida y bebida abundantes, adecuado para el número de criaturas que elijas al alcance. Las criaturas que participen del festín ganan varios beneficios: inmunidad al miedo y al veneno durante 24 horas, y un aumento en su máximo de puntos de golpe.",fuente:"SRD 5.2"},
{id:"mal-ojo",nombre:"Mal de Ojo",nivel:6,escuela:"Nigromancia",clases:["Druida"],tiempo:"1 acción",alcance:"27 metros",componentes:"V",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Durante el hechizo, tus ojos se vuelven negros y adquieres la capacidad de lanzar una mirada maligna. En cada uno de tus turnos antes de que el hechizo termine, podés usar tu acción para mirar fijamente a una criatura al alcance y elegir uno de varios efectos malignos que puede provocarle.",fuente:"SRD 5.2"},
{id:"espejismo-arcano",nombre:"Espejismo Arcano",nivel:7,escuela:"Ilusionismo",clases:["Bardo","Druida","Mago"],tiempo:"1 acción",alcance:"Ilimitado",componentes:"V, S, M (una piedra, una rama y un trozo de tela verde)",duracion:"Hasta 10 días",concentracion:false,ritual:false,desc:"Creás la ilusión de un área de terreno natural o de un ambiente urbano que cubre un área de hasta 150 metros de lado y persiste mientras dure el hechizo. La ilusión puede incluir vistas, sonidos, olores y temperaturas apropiados para el terreno que estés simulando.",fuente:"SRD 5.2"},

{id:"armadura-agathys",nombre:"Armadura de Agathys",nivel:1,escuela:"Abjuración",clases:["Brujo"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S, M (una gota de agua)",duracion:"1 hora",concentracion:false,ritual:false,desc:"Un frío mágico protector te envuelve, otorgándote 5 puntos de golpe temporales mientras dure el hechizo. Si una criatura te golpea con un ataque cuerpo a cuerpo mientras tenés esos puntos de golpe temporales, sufre 5 de daño de frío.",mejora:"Tanto los puntos de golpe temporales como el daño de frío aumentan en 5 por cada espacio de conjuro por encima del nivel 1.",fuente:"SRD 5.2"},
{id:"caparazon-antivida",nombre:"Caparazón Antivida",nivel:5,escuela:"Abjuración",clases:["Clérigo","Druida"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Una barrera invisible te rodea y se mueve con vos, con un radio de 3 metros. La barrera dura mientras el hechizo esté activo. Impide el paso a criaturas y a la mayoría de daño que no provenga de constructos ni de muertos vivientes.",fuente:"SRD 5.2"},
{id:"clon",nombre:"Clon",nivel:8,escuela:"Nigromancia",clases:["Mago"],tiempo:"1 hora",alcance:"Toque",componentes:"V, S, M (diamante por valor de 1000 po y al menos 1 pulgada cúbica de carne de la criatura a clonar, dentro de un contenedor con líquidos alquímicos por valor de 2000 po)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Este hechizo crea un cuerpo incorpóreo que después crece hasta convertirse en un duplicado de una criatura viviente, como una forma de asegurarte contra la muerte. Este cuerpo, alojado dentro de un contenedor sellado, madura y se vuelve un clon idéntico de la criatura original al cabo de 120 días.",fuente:"SRD 5.2"},
{id:"circulo-muerte",nombre:"Círculo de Muerte",nivel:6,escuela:"Nigromancia",clases:["Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S, M (esferas de plata por valor de al menos 500 po)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Un aura negativa de energía siniestra irrumpe en una esfera de 9 metros de radio centrada en un punto al alcance. Cada criatura en el área debe hacer una salvación de Constitución, sufriendo 8d6 de daño necrótico si falla, o la mitad si acierta.",mejora:"El daño aumenta en 2d6 por cada espacio de conjuro por encima del nivel 6.",fuente:"SRD 5.2"},
{id:"circulo-teletransportacion",nombre:"Círculo de Teletransportación",nivel:5,escuela:"Conjuración",clases:["Bardo","Hechicero","Mago"],tiempo:"10 minutos",alcance:"3 metros",componentes:"V, M (diamante en polvo por valor de 50 po, que se consume)",duracion:"1 asalto",concentracion:false,ritual:false,desc:"Trazás un círculo de teletransportación de 3 metros de diámetro en el suelo y lo cargás con energía que conecta con un círculo permanente de teletransportación que elijas y que hayas visto previamente.",fuente:"SRD 5.2"},
{id:"circulo-magico",nombre:"Círculo Mágico",nivel:3,escuela:"Abjuración",clases:["Clérigo","Paladín","Brujo","Mago"],tiempo:"1 minuto",alcance:"3 metros",componentes:"V, S, M (agua bendita o sagrada por valor de al menos 100 po, que se consume)",duracion:"Hasta 1 hora",concentracion:false,ritual:false,desc:"Trazás un círculo de 3 metros de radio en el suelo al alcance. Durante el hechizo, celestiales, elementales, feéricos, infernales o muertos vivientes (según elijas) tienen desventaja en las tiradas de ataque contra criaturas dentro del círculo, y no pueden cruzarlo por medios no físicos.",fuente:"SRD 5.2"},
{id:"contorno-borroso",nombre:"Contorno Borroso",nivel:2,escuela:"Ilusionismo",clases:["Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Tu forma se vuelve borrosa, cambiando y ondulando ante los ojos de todos los que te miran. Mientras dure el hechizo, cualquier criatura tiene desventaja en las tiradas de ataque contra vos.",fuente:"SRD 5.2"},
{id:"controlar-clima",nombre:"Controlar el Clima",nivel:8,escuela:"Transmutación",clases:["Clérigo","Druida","Mago"],tiempo:"10 minutos",alcance:"Uno mismo (radio de 3,2 km)",componentes:"V, S, M (una vara de incienso y hierbas quemadas al aire libre)",duracion:"Hasta 8 horas",concentracion:true,ritual:false,desc:"Cambiás el clima en el área en la que estás lanzando el hechizo. Debés estar al aire libre para lanzar este hechizo. Cambiar el clima gradualmente lleva 1d4x10 minutos, y podés establecer el clima que se avecina eligiendo entre varias condiciones.",fuente:"SRD 5.2"},

{id:"gaseosa",nombre:"Forma Gaseosa",nivel:3,escuela:"Transmutación",clases:["Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S, M (una gasa fina y humo)",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Podés hacer que una criatura voluntaria que toques, junto con todo lo que lleve puesto y portando, se transforme en una nube brumosa hasta el final de la duración. Mientras dure, la forma gaseosa no puede atacar, manipular objetos ni hablar.",fuente:"SRD 5.2"},
{id:"favor-divino",nombre:"Favor Divino",nivel:1,escuela:"Abjuración",clases:["Paladín"],tiempo:"1 acción adicional",alcance:"Uno mismo",componentes:"V",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Tu oración imbuye tus ataques con energía divina. Hasta que el hechizo termine, tus ataques con armas cuerpo a cuerpo infligen 1d4 de daño radiante adicional al impactar.",fuente:"SRD 5.2"},
{id:"geas",nombre:"Geas",nivel:5,escuela:"Encantamiento",clases:["Bardo","Clérigo","Druida","Paladín","Hechicero","Mago"],tiempo:"1 minuto",alcance:"18 metros",componentes:"V",duracion:"30 días",concentracion:false,ritual:false,desc:"Le impones un mandato mágico a una criatura que puedas ver al alcance, obligándola a llevar a cabo algún servicio o abstenerse de alguna acción o curso de actividad según dictes. La criatura debe entender tu idioma o el hechizo no tiene efecto. Una criatura no dispuesta debe superar una salvación de Sabiduría para evitar el efecto.",fuente:"SRD 5.2"},
{id:"grasa",nombre:"Grasa",nivel:1,escuela:"Conjuración",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S, M (un trozo de tocino)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Un fluido negro y resbaladizo cae al suelo en un cuadrado de 3 metros de lado centrado en un punto al alcance, convirtiéndolo en terreno difícil mientras dure el hechizo. Cuando la grasa aparece, cada criatura de pie en el área debe superar una salvación de Destreza o caer derribada.",fuente:"SRD 5.2"},
{id:"jaula-fuerza",nombre:"Jaula de Fuerza",nivel:7,escuela:"Evocación",clases:["Brujo","Mago"],tiempo:"1 acción",alcance:"30 metros",componentes:"V, S, M (rejillas de plata pura por valor de al menos 1500 po)",duracion:"Hasta 1 hora",concentracion:false,ritual:false,desc:"Una jaula invisible de fuerza mágica surge en un punto que elijas al alcance. La jaula puede tener forma de celda con barrotes o de caja sellada, hasta 6 metros de lado, o de esfera hueca de hasta 6 metros de diámetro.",fuente:"SRD 5.2"},
{id:"laberinto",nombre:"Laberinto",nivel:8,escuela:"Conjuración",clases:["Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S, M (arroz cocido, seda y una tela de araña)",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Desterrás a una criatura que puedas ver al alcance a un laberinto demiplanar. El objetivo permanece allí mientras dure el hechizo o hasta que encuentre la salida del laberinto mediante una prueba de Inteligencia con CD 20 al final de cada uno de sus turnos.",fuente:"SRD 5.2"},
{id:"llama-permanente",nombre:"Llama Permanente",nivel:2,escuela:"Evocación",clases:["Clérigo","Mago"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S, M (rubí en polvo por valor de 50 po, que se consume)",duracion:"Hasta que se disipe",concentracion:false,ritual:false,desc:"Con un toque, hacés que una llama constante y no mágica del tamaño de una antorcha aparezca en un objeto que estés tocando. La llama arroja luz brillante en un radio de 6 metros y luz tenue 6 metros más.",fuente:"SRD 5.2"},
{id:"mano-bigby",nombre:"Mano de Bigby",nivel:5,escuela:"Evocación",clases:["Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"36 metros",componentes:"V, S, M (guantelete de cuero)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Creás una mano grande y espectral de fuerza al alcance. Cuando la lanzás y como acción en turnos posteriores, la mano puede realizar acciones como empuñar un escudo, agarrar a una criatura, golpear a una criatura, o interponerse entre vos y un atacante.",fuente:"SRD 5.2"},
{id:"muro-espinas",nombre:"Muro de Espinas",nivel:6,escuela:"Conjuración",clases:["Druida"],tiempo:"1 acción",alcance:"36 metros",componentes:"V, S, M (una espina)",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Vos hacéis que una muralla de zarzas espinosas y densamente enredadas brote de un punto al alcance. Cuando el hechizo se lanza, cualquier criatura en el área donde aparece la muralla sufre 7d8 de daño de perforación.",mejora:"El daño aumenta en 1d8 por cada espacio de conjuro por encima del nivel 6.",fuente:"SRD 5.2"},
{id:"muro-viento",nombre:"Muro de Viento",nivel:3,escuela:"Evocación",clases:["Druida","Explorador"],tiempo:"1 acción",alcance:"36 metros",componentes:"V, S, M (una pluma de ave)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Una muralla de viento fuerte se alza en un punto que elijas al alcance y persiste mientras dure el hechizo. La muralla puede tener hasta 15 metros de largo, 4,5 metros de alto y 0,3 metros de espesor. Puede dañar proyectiles, apagar llamas pequeñas y dispersar gas o niebla.",fuente:"SRD 5.2"},
{id:"nube-oscurecimiento",nombre:"Nube de Oscurecimiento",nivel:1,escuela:"Conjuración",clases:["Druida","Explorador","Hechicero","Mago"],tiempo:"1 acción",alcance:"36 metros",componentes:"V, S, M (una pizca de tierra de pantano)",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Aparece una esfera de niebla de 6 metros de radio centrada en un punto al alcance. La esfera se propaga por esquinas y el área queda muy difícil de ver. La esfera persiste mientras dure el hechizo, o hasta que un viento fuerte la disperse.",fuente:"SRD 5.2"},
{id:"nube-aniquiladora",nombre:"Nube Aniquiladora",nivel:5,escuela:"Conjuración",clases:["Druida","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"90 metros",componentes:"V, S, M (una pizca de esporas de hongo en polvo)",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Se forma una esfera de niebla amarillo verdosa venenosa de 6 metros de radio, centrada en un punto que elijas al alcance. La niebla persiste mientras dure el hechizo. Cada criatura totalmente dentro de la niebla al inicio de su turno debe hacer una salvación de Constitución, sufriendo 5d8 de daño venenoso si falla, o la mitad si acierta.",fuente:"SRD 5.2"},
{id:"ojo-arcano-mano-bigby",nombre:"Puerta Arcana",nivel:6,escuela:"Conjuración",clases:["Mago"],tiempo:"1 acción",alcance:"3 metros",componentes:"V, S, M (una jamba de puerta, un marco o un arco tallado de marfil, marfil sustituto, o madera dura por valor de al menos 5000 po)",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Creás una conexión vinculada entre dos puntos: un portal fijo que colocás en tu ubicación actual, y un portal enlazado que colocás en una ubicación familiar a hasta 150 metros de vos.",fuente:"SRD 5.2"},
{id:"prohibicion",nombre:"Prohibición",nivel:6,escuela:"Abjuración",clases:["Clérigo"],tiempo:"10 minutos",alcance:"Toque",componentes:"V, S, M (incienso rociado con agua bendita o sagrada por valor de al menos 1000 po, que se consume)",duracion:"1 año",concentracion:false,ritual:false,desc:"Protegés un área de hasta un cubo de 90 metros de lado durante la duración. Fuera del edificio o estructura al que el hechizo esté ligado, se puede vincular a un fenómeno concreto que impide el paso de criaturas de cierto tipo o alineamiento.",fuente:"SRD 5.2"},
{id:"proteccion-veneno",nombre:"Protección contra Veneno",nivel:2,escuela:"Abjuración",clases:["Clérigo","Druida","Paladín","Explorador"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S",duracion:"1 hora",concentracion:false,ritual:false,desc:"Tocás a una criatura. Si está envenenada, neutralizás el veneno. Si tiene más de un veneno afectándola, neutralizás uno que conozcas presente en ella. Durante la próxima hora, el objetivo gana ventaja en las salvaciones contra ser envenenado y tiene resistencia al daño de veneno.",fuente:"SRD 5.2"},
{id:"proyeccion-astral",nombre:"Proyección Astral",nivel:9,escuela:"Nigromancia",clases:["Clérigo","Mago"],tiempo:"1 hora",alcance:"3 metros",componentes:"V, S, M (una pizca de incienso, una gema por valor de al menos 1000 po por cada criatura viajando de esta forma)",duracion:"Especial",concentracion:false,ritual:false,desc:"Proyectás vos y hasta ocho criaturas dispuestas al alcance al Plano Astral. Los cuerpos físicos que dejáis atrás quedan en estado de animación suspendida, ligados a vuestro cuerpo astral por un cordón plateado.",fuente:"SRD 5.2"},
{id:"puerta-arcana",nombre:"Rayo Debilitador",nivel:2,escuela:"Nigromancia",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"36 metros",componentes:"V, S",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Un rayo negro y ondulante de energía debilitante se dispara hacia una criatura al alcance. Realizá un ataque de conjuro a distancia; si acierta, el objetivo sufre 2d8 de daño necrótico y su fuerza en tiradas de ataque cuerpo a cuerpo con armas se reduce a la mitad hasta el final del hechizo.",mejora:"El daño aumenta en 1d8 por cada espacio de conjuro por encima del nivel 2.",fuente:"SRD 5.2"},
{id:"rayo-solar",nombre:"Rayo Solar",nivel:6,escuela:"Evocación",clases:["Druida","Hechicero","Mago"],tiempo:"1 acción",alcance:"Uno mismo (línea de 18x1,5 m)",componentes:"V, S, M (una lupa)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Un rayo de luz radiante se dispara desde vos en una línea de 18 metros y 1,5 metros de ancho. Cada criatura en la línea debe hacer una salvación de Constitución, sufriendo 6d8 de daño radiante si falla, o la mitad si acierta. Cualquier criatura cegada por este hechizo permanece cegada hasta el final de su próximo turno.",fuente:"SRD 5.2"},
{id:"reencarnar",nombre:"Reencarnar",nivel:5,escuela:"Nigromancia",clases:["Druida"],tiempo:"1 hora",alcance:"Toque",componentes:"V, S, M (hierbas raras y ungüentos por valor de al menos 1000 po, que se consumen)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Este hechizo revive a una criatura muerta hace no más de 10 días. La criatura vuelve a la vida en una nueva forma corporal determinada al azar, y su alma debe estar libre y dispuesta a volver.",fuente:"SRD 5.2"},
{id:"reprension-infernal",nombre:"Reprensión Infernal",nivel:1,escuela:"Evocación",clases:["Brujo"],tiempo:"1 reacción (cuando sufrís daño de una criatura a 18 metros que podés ver)",alcance:"18 metros",componentes:"V",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Vos apuntás un dedo acusador y las palabras de condena maldicen a quien te hirió. La criatura que te causó el daño debe hacer una salvación de Destreza, sufriendo 2d10 de daño de fuego si falla, o la mitad si acierta.",mejora:"El daño aumenta en 1d10 por cada espacio de conjuro por encima del nivel 1.",fuente:"SRD 5.2"},
{id:"santuario",nombre:"Santuario",nivel:1,escuela:"Abjuración",clases:["Clérigo"],tiempo:"1 acción adicional",alcance:"9 metros",componentes:"V, S, M (una pequeña reliquia plateada)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Protegés a una criatura al alcance con este hechizo. Hasta que el hechizo termine, cualquier criatura que apunte al objetivo con un ataque o un conjuro dañino debe primero hacer una salvación de Sabiduría, o elegir un nuevo objetivo o perder el ataque o el conjuro.",fuente:"SRD 5.2"},
{id:"semiplano",nombre:"Semiplano",nivel:5,escuela:"Conjuración",clases:["Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S",duracion:"Hasta 1 hora",concentracion:false,ritual:false,desc:"Creás una puerta en un punto que elijas al alcance. La puerta es visible como un rectángulo de 3 por 1,5 metros y da a una estancia demiplanar vacía. La habitación existe hasta que el hechizo termina.",fuente:"SRD 5.2"},
{id:"telepatia",nombre:"Telepatía",nivel:8,escuela:"Adivinación",clases:["Mago"],tiempo:"1 acción",alcance:"Ilimitado",componentes:"V, S, M (par de esferas de cristal)",duracion:"24 horas",concentracion:false,ritual:false,desc:"Podés crear un vínculo telepático entre vos mismo y una criatura voluntaria con la que estés familiarizado, sin importar la distancia entre ambos, siempre que estéis en el mismo plano de existencia. Podéis intercambiar mensajes telepáticamente mientras dure el hechizo.",fuente:"SRD 5.2"},
{id:"tentaculos-evard",nombre:"Tentáculos Negros de Evard",nivel:4,escuela:"Conjuración",clases:["Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"27 metros",componentes:"V, S, M (un trozo de tentáculo de pulpo o calamar)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Zarcillos retorcidos de materia oscura y viscosa brotan del suelo en un área de 6 metros de lado al alcance. Durante la duración, esos tentáculos ocupan el área difícil de atravesar. Cada criatura que empiece su turno en el área debe superar una salvación de Fuerza o sufrir 3d6 de daño contundente y quedar apresada.",fuente:"SRD 5.2"},
{id:"terremoto",nombre:"Terremoto",nivel:8,escuela:"Evocación",clases:["Clérigo","Druida"],tiempo:"1 acción",alcance:"150 metros",componentes:"V, S, M (una pizca de tierra, un trozo de roca y una bola de arcilla)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Provocás un temblor violento en un punto que elijas en el suelo al alcance. Ondas visibles de fuerza irradian desde el punto en un radio de 30 metros. El terreno en el área se convierte en difícil de atravesar durante la duración, y pueden abrirse grietas.",fuente:"SRD 5.2"},
{id:"tormenta-hielo",nombre:"Tormenta de Hielo",nivel:4,escuela:"Evocación",clases:["Druida","Hechicero","Mago"],tiempo:"1 acción",alcance:"90 metros",componentes:"V, S, M (una pizca de polvo y algunas gotas de agua)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Una tormenta de hielo forma una esfera de 6 metros de radio centrada en un punto al alcance. Cada criatura en el área debe hacer una salvación de Destreza, sufriendo 2d8 de daño contundente más 4d6 de daño de frío si falla, o la mitad si acierta.",mejora:"El daño contundente aumenta en 1d8 por cada espacio de conjuro por encima del nivel 4.",fuente:"SRD 5.2"},
{id:"tsunami",nombre:"Tsunami",nivel:8,escuela:"Conjuración",clases:["Druida"],tiempo:"1 minuto",alcance:"900 metros",componentes:"V, S",duracion:"Hasta 6 asaltos",concentracion:true,ritual:false,desc:"Se forma una muralla de agua en un punto que puedas ver al nivel del suelo al alcance. Podés hacer que el muro tenga hasta 90 metros de largo, 90 metros de alto y 15 metros de espesor. La muralla dura mientras dure el hechizo, momento en el que colapsa y provoca daño devastador.",fuente:"SRD 5.2"},
{id:"hoja-fuego",nombre:"Hoja de Fuego",nivel:2,escuela:"Evocación",clases:["Druida"],tiempo:"1 acción adicional",alcance:"Uno mismo",componentes:"V, S, M (una hoja de zumaque)",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Evocás una hoja de fuego chispeante en tu mano libre. La hoja ilumina como una antorcha y dura mientras el hechizo esté activo. Podés usar tu acción para atacar con ella cuerpo a cuerpo. Si acierta, el objetivo sufre 3d6 de daño de fuego. La hoja te otorga ventaja en las pruebas de característica que hagas para agarrarte a algo con la mano libre.",mejora:"El daño aumenta en 1d6 por cada dos espacios de conjuro por encima del nivel 2.",fuente:"SRD 5.2"},

{id:"agarre-electrizante",nombre:"Agarre Electrizante",nivel:0,escuela:"Evocación",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S",duracion:"1 asalto",concentracion:false,ritual:false,desc:"Chispas relampagueantes saltan de tu mano hacia una criatura al alcance. Realizá un ataque de conjuro cuerpo a cuerpo contra el objetivo; tenés ventaja en la tirada si el objetivo lleva armadura de metal. Si acierta, sufre 1d8 de daño eléctrico y no puede usar reacciones hasta el inicio de su próximo turno.",mejora:"El daño aumenta en 1d8 en los niveles 5, 11 y 17.",fuente:"SRD 5.2"},
{id:"labia",nombre:"Labia",nivel:0,escuela:"Encantamiento",clases:["Bardo","Hechicero","Brujo"],tiempo:"1 acción",alcance:"9 metros",componentes:"V",duracion:"Hasta 1 minuto",concentracion:false,ritual:false,desc:"Le susurrás una distorsión mágica de la verdad a una criatura que puedas ver al alcance. Ganás ventaja en la siguiente prueba de Carisma que hagas para interactuar con esa criatura antes de que el hechizo termine.",fuente:"SRD 5.2"},

{id:"buenas-bayas",nombre:"Buenas Bayas",nivel:1,escuela:"Transmutación",clases:["Druida","Explorador"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S, M (una rama de acebo)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Hasta diez bayas aparecen en tu mano y quedan imbuidas de magia durante 24 horas. Una criatura puede usar su acción para comer una baya, recuperando 1 punto de golpe. Comer una baya también sirve como alimento durante un día.",fuente:"SRD 5.2"},
{id:"hablar-animales",nombre:"Hablar con los Animales",nivel:1,escuela:"Adivinación",clases:["Bardo","Druida","Explorador"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S",duracion:"10 minutos",concentracion:false,ritual:true,desc:"Ganás la capacidad de entender y comunicarte verbalmente con bestias durante la duración del hechizo. El conocimiento y la inteligencia de muchas bestias es limitado, así que podés obtener solo impresiones simples o información básica.",fuente:"SRD 5.2"},
{id:"rayo-nauseabundo",nombre:"Rayo Nauseabundo",nivel:1,escuela:"Nigromancia",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Un rayo repugnante y verdoso se dispara hacia una criatura al alcance. Realizá un ataque de conjuro a distancia; si acierta, el objetivo sufre 2d8 de daño de veneno y debe hacer una salvación de Constitución, quedando envenenado hasta el final de tu próximo turno si falla.",mejora:"El daño aumenta en 1d8 por cada espacio de conjuro por encima del nivel 1.",fuente:"SRD 5.2"},
{id:"disco-tenser",nombre:"Disco Flotante de Tenser",nivel:1,escuela:"Conjuración",clases:["Mago"],tiempo:"1 acción",alcance:"9 metros",componentes:"V, S, M (una gota de mercurio)",duracion:"1 hora",concentracion:false,ritual:false,desc:"Un disco horizontal y translúcido de fuerza aparece flotando a 1 metro sobre el suelo, en un punto que elijas al alcance. El disco dura mientras el hechizo esté activo y puede sostener hasta 500 libras. Flota a 1 metro del suelo y te sigue mientras te movés, permaneciendo siempre nivelado.",fuente:"SRD 5.2"},
{id:"duelo-forzado",nombre:"Duelo Forzado",nivel:1,escuela:"Abjuración",clases:["Paladín"],tiempo:"1 acción adicional",alcance:"9 metros",componentes:"V",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Intentás obligar a una criatura a un duelo. Una criatura que puedas ver al alcance debe superar una salvación de Sabiduría o quedar afectada mientras dure el hechizo. La criatura afectada tiene desventaja en tiradas de ataque contra criaturas que no seas vos, y debe hacer una salvación de Sabiduría cada vez que intente moverse a más de 9 metros de vos.",fuente:"SRD 5.2"},
{id:"castigo-abrasador",nombre:"Castigo Abrasador",nivel:1,escuela:"Evocación",clases:["Paladín"],tiempo:"1 acción adicional",alcance:"Uno mismo",componentes:"V",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"La próxima vez que impactes a una criatura con un ataque con arma cuerpo a cuerpo durante la duración del hechizo, tu arma llamea con fuego sagrado, y el ataque inflige 3d6 de daño de fuego adicional al objetivo. Además, el objetivo queda envuelto en llamas tenues que emiten luz e infligen daño de fuego cada turno.",mejora:"El daño adicional aumenta en 1d6 por cada espacio de conjuro por encima del nivel 1.",fuente:"SRD 5.2"},
{id:"castigo-desterrador",nombre:"Castigo Desterrador",nivel:1,escuela:"Abjuración",clases:["Paladín"],tiempo:"1 acción adicional",alcance:"Uno mismo",componentes:"V",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"La próxima vez que impactes a una criatura con un ataque con arma cuerpo a cuerpo antes de que el hechizo termine, tu arma resplandece con energía tenue, y el ataque inflige 2d8 de daño de fuerza adicional al objetivo. Además, si el objetivo no es nativo del plano de existencia en el que estás, debe superar una salvación de Carisma o ser desterrado.",mejora:"El daño adicional aumenta en 1d8 por cada espacio de conjuro por encima del nivel 1.",fuente:"SRD 5.2"},
{id:"castigo-atronador",nombre:"Castigo Atronador",nivel:1,escuela:"Evocación",clases:["Paladín"],tiempo:"1 acción adicional",alcance:"Uno mismo",componentes:"V",duracion:"Instantánea",concentracion:false,ritual:false,desc:"La próxima vez que impactes a una criatura con un ataque con arma cuerpo a cuerpo antes de que el hechizo termine, tu arma resuena con un trueno que se oye a 90 metros, y el ataque inflige 2d6 de daño de trueno adicional al objetivo. Además, si es una criatura Grande o menor, debe superar una salvación de Fuerza o ser empujada 3 metros y caer derribada.",mejora:"El daño adicional aumenta en 1d6 por cada espacio de conjuro por encima del nivel 1.",fuente:"SRD 5.2"},

{id:"arma-magica",nombre:"Arma Mágica",nivel:2,escuela:"Transmutación",clases:["Paladín","Hechicero","Mago"],tiempo:"1 acción adicional",alcance:"Toque",componentes:"V, S",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Tocás un arma no mágica. Hasta que el hechizo termine, esa arma se convierte en un arma mágica con un bono de +1 a las tiradas de ataque y de daño.",mejora:"Con espacio de nivel 4-5 el bono es +2; con nivel 6+ el bono es +3.",fuente:"SRD 5.2"},
{id:"boca-magica",nombre:"Boca Mágica",nivel:2,escuela:"Ilusionismo",clases:["Bardo","Hechicero","Mago"],tiempo:"1 hora",alcance:"9 metros",componentes:"V, S, M (un trozo de nido de avispas y una pizca de miel)",duracion:"Hasta que se disipe",concentracion:false,ritual:true,desc:"Implantás un mensaje dentro de un objeto al alcance, para que sea pronunciado cuando se cumpla una condición desencadenante que especifiques. Elegí el objeto que verá o escuchará al desencadenante; puede ser hasta 25 palabras, aunque podés hablar por más tiempo.",fuente:"SRD 5.2"},
{id:"fuerza-fantasmal",nombre:"Fuerza Fantasmal",nivel:2,escuela:"Ilusionismo",clases:["Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S, M (un poco de lana)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Creás una ilusión que solo una criatura al alcance puede ver. El objetivo debe superar una salvación de Inteligencia o quedar afectado. La ilusión puede incluir sonidos si dedicás una parte de tu concentración a este efecto. Un objetivo afectado interactúa con la ilusión como si fuera real, y puede sufrir daño psíquico de las imágenes hostiles.",fuente:"SRD 5.2"},
{id:"corona-locura",nombre:"Corona de la Locura",nivel:2,escuela:"Encantamiento",clases:["Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"36 metros",componentes:"V, S",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Una criatura de tu elección que puedas ver al alcance debe superar una salvación de Sabiduría o quedar hechizada por vos mientras dure el hechizo. Una corona de fuego morado aparece en la cabeza de la criatura afectada, y le impone tener que atacar a la criatura que vos elijas en cada uno de sus turnos.",fuente:"SRD 5.2"},
{id:"aliento-dragon",nombre:"Aliento de Dragón",nivel:2,escuela:"Transmutación",clases:["Druida","Hechicero","Brujo","Mago"],tiempo:"1 acción adicional",alcance:"Toque",componentes:"V, S, M (una pizca de azufre)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Tocás a una criatura voluntaria y le otorgás la capacidad de exhalar aliento de dragón. Elegís un tipo de daño entre ácido, veneno, frío, fuego o eléctrico. Hasta que el hechizo termine, el objetivo puede usar su acción para exhalar energía en un cono de 4,5 metros, con salvación de Destreza para infligir 3d6 de daño del tipo elegido.",mejora:"El daño aumenta en 1d6 por cada espacio de conjuro por encima del nivel 2.",fuente:"SRD 5.2"},
{id:"alterar-aspecto",nombre:"Alterar el Propio Aspecto",nivel:2,escuela:"Transmutación",clases:["Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Tu cuerpo cambia de forma mágicamente. Elegís entre dos opciones al lanzar el hechizo: cambiar tu apariencia física de forma sutil, o adaptar tu cuerpo para respirar bajo el agua o desarrollar membranas entre los dedos, mientras dure el hechizo.",fuente:"SRD 5.2"},
{id:"nystul",nombre:"Aura Mágica de Nystul",nivel:2,escuela:"Ilusionismo",clases:["Mago"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S, M (un pequeño trozo de seda)",duracion:"24 horas",concentracion:false,ritual:false,desc:"Tocás a un objeto o a una criatura, y creás una ilusión que hace que un examen superficial de magia (como el hechizo detectar magia) muestre resultados falsos que elijas al lanzarlo.",fuente:"SRD 5.2"},
{id:"hacer-anicos",nombre:"Hacer Añicos",nivel:2,escuela:"Evocación",clases:["Bardo","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S, M (un fragmento de cerámica quebrada)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Un estruendo repentino y agudo, doloroso a la audición, retumba desde un punto al alcance. Cada criatura en una esfera de 3 metros de radio centrada allí debe hacer una salvación de Constitución, sufriendo 3d8 de daño de trueno si falla, o la mitad si acierta.",mejora:"El daño aumenta en 1d8 por cada espacio de conjuro por encima del nivel 2.",fuente:"SRD 5.2"},
{id:"cerradura-arcana",nombre:"Cerradura Arcana",nivel:2,escuela:"Abjuración",clases:["Mago"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S, M (oro en polvo por valor de 25 po, que se consume)",duracion:"Hasta que se disipe",concentracion:false,ritual:false,desc:"Tocás una puerta, ventana o cierre cerrado, y la sellás mágicamente. Vos y las criaturas que designes cuando lancéis el hechizo podéis abrirla normalmente. También podés fijar una contraseña que, si se pronuncia a 1,5 metros del objeto, suspende este efecto durante 1 minuto.",fuente:"SRD 5.2"},
{id:"crecimiento-espinoso",nombre:"Crecimiento Espinoso",nivel:2,escuela:"Transmutación",clases:["Druida","Explorador"],tiempo:"1 acción",alcance:"45 metros",componentes:"V, S, M (siete espinas afiladas o un trozo de zarza)",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"El terreno en un cubo de 6 metros de lado al alcance se llena de vides y espinas retorcidas. El área se convierte en terreno difícil durante la duración. Cualquier criatura que se mueva por el área sufre 2d4 de daño de perforación por cada 1,5 metros que recorra.",fuente:"SRD 5.2"},
{id:"nube-dagas",nombre:"Nube de Dagas",nivel:2,escuela:"Conjuración",clases:["Bardo","Hechicero","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S, M (una daga o alfiler de plata)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Aparece una nube de dagas de vuelo constante que llena un cubo de 1,5 metros centrado en un punto al alcance. Una criatura sufre 4d4 de daño de cortante cuando entra en el hechizo por primera vez en un turno o cuando empieza su turno allí.",fuente:"SRD 5.2"},
{id:"augurio",nombre:"Augurio",nivel:2,escuela:"Adivinación",clases:["Clérigo"],tiempo:"1 minuto",alcance:"Uno mismo",componentes:"V, S, M (varas adivinatorias, huesos u otros objetos por valor de al menos 25 po)",duracion:"Instantánea",concentracion:false,ritual:true,desc:"Al lanzar este hechizo, recibís presagios de una acción específica que planeás realizar en la próxima media hora. El DM elige un resultado entre varios grados, desde fasto hasta funesto, según si el curso de acción probablemente traerá buenos o malos resultados.",fuente:"SRD 5.2"},
{id:"potenciar-caracteristica",nombre:"Potenciar Característica",nivel:2,escuela:"Transmutación",clases:["Bardo","Clérigo","Druida","Hechicero","Mago"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S, M (piel de camaleón)",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Tocás a una criatura y le otorgás ventaja en pruebas de una característica de tu elección durante la duración. Podés elegir entre Fuerza (Vigor), Destreza (Gato), Constitución (Resistencia del Oso), Inteligencia (Mente de Águila), Sabiduría (Ojos de Gato) o Carisma (Lengua de Elocuencia).",fuente:"SRD 5.2"},
{id:"clavo-mental",nombre:"Clavo Mental",nivel:2,escuela:"Nigromancia",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Envías una punzada de energía psíquica en la mente de una criatura al alcance. El objetivo debe hacer una salvación de Inteligencia, sufriendo 3d8 de daño psíquico y teniendo desventaja en la siguiente salvación que haga antes del final de tu próximo turno si falla, o la mitad del daño si acierta.",mejora:"El daño aumenta en 1d8 por cada espacio de conjuro por encima del nivel 2.",fuente:"SRD 5.2"},
{id:"embelesar",nombre:"Embelesar",nivel:2,escuela:"Encantamiento",clases:["Bardo","Druida"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S",duracion:"1 minuto",concentracion:false,ritual:false,desc:"Fascinás a las criaturas con tus palabras. Cada humanoide en una esfera de 9 metros de radio centrada en un punto al alcance que pueda oírte debe superar una salvación de Sabiduría o quedar fascinado durante la duración. Mientras estén fascinados, tienen desventaja en las pruebas de Sabiduría (Percepción) para detectar cosas que no seas vos.",fuente:"SRD 5.2"},
{id:"dulce-descanso",nombre:"Dulce Descanso",nivel:2,escuela:"Nigromancia",clases:["Bardo","Clérigo","Druida","Mago"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S, M (una moneda de plata colocada sobre cada ojo del cadáver)",duracion:"10 días",concentracion:false,ritual:false,desc:"Preservás el cuerpo de una criatura muerta que toques, para que quede a salvo de la descomposición durante la duración. Este hechizo también neutraliza los venenos y detiene la progresión natural de la enfermedad en el cuerpo.",fuente:"SRD 5.2"},
{id:"detectar-trampas",nombre:"Detectar Trampas",nivel:2,escuela:"Adivinación",clases:["Explorador"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Durante la duración, sos consciente de la presencia de cualquier trampa dentro de 36 metros de vos que sea mágica o mecánica en naturaleza, siempre que estén dentro de tu línea de visión.",fuente:"SRD 5.2"},

{id:"llamar-relampago",nombre:"Llamar al Relámpago",nivel:3,escuela:"Conjuración",clases:["Druida"],tiempo:"1 acción",alcance:"36 metros",componentes:"V, S",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Una gran nube de tormenta aparece en forma de cilindro de 3 metros de radio y 18 metros de alto, centrado en un punto que puedas ver a 45 metros por encima de vos. Cuando lanzás el hechizo, y como acción en turnos posteriores, podés hacer que un relámpago restalle desde la nube hacia un punto que elijas debajo de ella.",mejora:"El daño aumenta en 1d10 por cada espacio de conjuro por encima del nivel 3.",fuente:"SRD 5.2"},
{id:"ralentizar",nombre:"Ralentizar",nivel:3,escuela:"Transmutación",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"36 metros",componentes:"V, S, M (una pizca de melaza)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Alterás el flujo del tiempo en un lugar de tu elección, afectando hasta a seis criaturas de tu elección en un cubo de 12 metros de lado al alcance. Cada objetivo debe superar una salvación de Sabiduría o quedar afectado, con la velocidad reducida a la mitad y desventaja en salvaciones de Destreza.",fuente:"SRD 5.2"},
{id:"indetectable",nombre:"Indetectable",nivel:3,escuela:"Abjuración",clases:["Bardo","Explorador","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S, M (un pellizco de cera de oreja)",duracion:"Hasta 8 horas",concentracion:false,ritual:false,desc:"Durante el hechizo, un objeto que toques no puede ser detectado por magia de adivinación. El objeto no puede ser escrutado, ni ubicado por un hechizo como localizar objeto, y no puede ser rastreado.",fuente:"SRD 5.2"},
{id:"levantar-maldicion",nombre:"Levantar Maldición",nivel:3,escuela:"Abjuración",clases:["Bardo","Clérigo","Paladín"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Al tocar a una criatura, eliminás todas las maldiciones que la afecten. Si la maldición está ligada a un objeto maldito, este pierde su maldición, aunque cualquier otra propiedad mágica permanece.",fuente:"SRD 5.2"},
{id:"desplazamiento-blink",nombre:"Desplazamiento",nivel:3,escuela:"Transmutación",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S, M (un dado o par de dados de hueso)",duracion:"1 minuto",concentracion:false,ritual:false,desc:"Al lanzar este hechizo, entrás y salís del Plano Etéreo de forma intermitente. Al final de cada uno de tus turnos, tirá un d20; con un resultado de 11 o más, permanecés (o pasás) al Plano Etéreo hasta el inicio de tu próximo turno, momento en el que el efecto se repite. Al final del hechizo, volvés a tu plano de origen si estabas en el Etéreo.",fuente:"SRD 5.2"},
{id:"imagen-mayor",nombre:"Imagen Mayor",nivel:3,escuela:"Ilusionismo",clases:["Bardo","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"27 metros",componentes:"V, S, M (un poco de lana y azúcar en polvo)",duracion:"Hasta 10 minutos",concentracion:false,ritual:false,desc:"Creás la imagen de un objeto, criatura u otro fenómeno visible que no mida más de un cubo de 6 metros de lado. La imagen aparece en un punto al alcance y persiste durante la duración. Incluye efectos sonoros, olfativos y de temperatura menores.",fuente:"SRD 5.2"},
{id:"caminar-agua",nombre:"Caminar sobre el Agua",nivel:3,escuela:"Transmutación",clases:["Clérigo","Druida","Explorador","Hechicero"],tiempo:"1 acción",alcance:"9 metros",componentes:"V, S, M (un trocito de corcho)",duracion:"Hasta 1 hora",concentracion:false,ritual:false,desc:"Este hechizo otorga a hasta diez criaturas dispuestas que puedas ver al alcance la capacidad de moverse sobre cualquier superficie líquida, como agua, ácido, lodo, nieve, arenas movedizas o lava, como si fuera terreno firme.",fuente:"SRD 5.2"},
{id:"corcel-fantasma",nombre:"Corcel Fantasma",nivel:3,escuela:"Ilusionismo",clases:["Bardo","Mago"],tiempo:"1 minuto",alcance:"9 metros",componentes:"V",duracion:"1 hora",concentracion:false,ritual:false,desc:"Un corcel espectral aparece en el suelo en un punto al alcance, existiendo mientras dure el hechizo. Podés elegir la forma de un caballo, pero también puede tomar otra forma según el mundo de campaña. Cualquier criatura que designes al lanzar el hechizo puede montarlo.",fuente:"SRD 5.2"},
{id:"fundirse-piedra",nombre:"Fundirse con la Piedra",nivel:3,escuela:"Transmutación",clases:["Clérigo","Druida"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S",duracion:"8 horas",concentracion:false,ritual:false,desc:"Vos y hasta ocho criaturas dispuestas al alcance, tomadas de las manos formando un círculo, os fundís con una masa de piedra que toquéis. Vos y tus compañeros os volvéis parte de la piedra y quedáis indetectables mientras dure el hechizo.",fuente:"SRD 5.2"},
{id:"glifo-custodio",nombre:"Glifo Custodio",nivel:3,escuela:"Abjuración",clases:["Bardo","Clérigo","Mago"],tiempo:"1 hora",alcance:"Toque",componentes:"V, S, M (incienso y diamante en polvo por valor de 200 po, que se consume)",duracion:"Hasta que se disipe o se active",concentracion:false,ritual:false,desc:"Inscribís un glifo que causa un efecto mágico cuando se activa. Escribís el glifo en una superficie o dentro de un objeto que pueda cerrarse. Elegís las condiciones que activarán el glifo y el efecto que producirá: una explosión de energía dañina, o un hechizo de encantamiento o nigromancia que afecte a quien lo active.",fuente:"SRD 5.2"},
{id:"hablar-plantas",nombre:"Hablar con las Plantas",nivel:3,escuela:"Transmutación",clases:["Bardo","Druida","Explorador"],tiempo:"1 acción",alcance:"Uno mismo (radio de 9 m)",componentes:"V, S",duracion:"10 minutos",concentracion:false,ritual:false,desc:"Ganás la capacidad de comunicarte con plantas ordinarias y árboles durante la duración. Con esta comunicación, podés pedirles información simple sobre criaturas que hayan pasado cerca, y podés persuadirlas para que despejen un sendero o te ayuden de formas menores según su naturaleza.",fuente:"SRD 5.2"},
{id:"hablar-muertos",nombre:"Hablar con los Muertos",nivel:3,escuela:"Nigromancia",clases:["Bardo","Clérigo"],tiempo:"1 acción",alcance:"3 metros",componentes:"V, S, M (incienso y agua o vino como ofrenda)",duracion:"10 minutos",concentracion:false,ritual:false,desc:"Le otorgás la semblanza de vida a un cráneo o esqueleto que puedas ver al alcance, despertando su espíritu para que responda a las preguntas que le hagas. La criatura reconoce si está muerta y recuerda su identidad y las circunstancias generales de su muerte.",fuente:"SRD 5.2"},
{id:"crecimiento-vegetal",nombre:"Crecimiento Vegetal",nivel:3,escuela:"Transmutación",clases:["Druida"],tiempo:"1 acción",alcance:"45 metros",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Este hechizo canaliza vitalidad hacia las plantas dentro de un área específica. Hay dos versiones del hechizo, según el tiempo que dediques a lanzarlo. Si lo lanzás con 1 acción, todas las plantas normales en una esfera de 30 metros de radio se vuelven densas y enmarañadas.",fuente:"SRD 5.2"},

{id:"asesino-fantasmal",nombre:"Asesino Fantasmal",nivel:4,escuela:"Ilusionismo",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S, M (un pequeño trozo de licopodio en polvo)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Creás una ilusión ilusoria y terrible en la mente de una criatura que puedas ver al alcance. La víctima debe superar una salvación de Sabiduría o quedar asustada mientras dure el hechizo. Al inicio de cada uno de sus turnos mientras esté asustada así, el objetivo debe repetir la salvación, sufriendo 4d10 de daño psíquico si falla.",mejora:"El daño aumenta en 1d10 por cada espacio de conjuro por encima del nivel 4.",fuente:"SRD 5.2"},
{id:"aura-vida",nombre:"Aura de Vida",nivel:4,escuela:"Abjuración",clases:["Clérigo","Paladín"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Un aura de vitalidad emana de vos en un radio de 9 metros durante la duración. El área se mueve con vos y está centrada en vos. Cada criatura no muerta viviente en el área, incluida vos, gana resistencia al daño necrótico, y el máximo de puntos de golpe de cualquier criatura viviente en el área no puede ser reducido.",fuente:"SRD 5.2"},
{id:"guarda-muerte",nombre:"Guarda contra la Muerte",nivel:4,escuela:"Abjuración",clases:["Clérigo","Paladín"],tiempo:"1 acción",alcance:"9 metros",componentes:"V, S",duracion:"8 horas",concentracion:false,ritual:false,desc:"Vos tocás a una criatura y le otorgás protección contra la muerte. La primera vez que el objetivo caería a 0 puntos de golpe como resultado de sufrir daño, en cambio el objetivo se queda con 1 punto de golpe, y el hechizo termina.",fuente:"SRD 5.2"},
{id:"esfera-vitriolica",nombre:"Esfera Vitriólica",nivel:4,escuela:"Evocación",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"45 metros",componentes:"V, S, M (una vejiga de animal llena de ácido)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Lanzás una burbuja de ácido. Elegí un punto al alcance, y la burbuja explota en una esfera de 6 metros de radio allí. Cada criatura en el área debe hacer una salvación de Destreza, sufriendo 10d4 de daño ácido si falla, o la mitad si acierta.",mejora:"El daño aumenta en 2d4 por cada espacio de conjuro por encima del nivel 4.",fuente:"SRD 5.2"},
{id:"insecto-gigante",nombre:"Insecto Gigante",nivel:4,escuela:"Transmutación",clases:["Druida"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Transformás hasta diez ciempiés, tres arañas, cinco avispas o un escorpión que puedas ver al alcance en criaturas gigantes durante la duración. Un ciempiés se convierte en un ciempiés gigante, una araña en una araña gigante, y así sucesivamente, obedeciendo tus órdenes mentales.",fuente:"SRD 5.2"},
{id:"cofre-leomund",nombre:"Cofre Oculto de Leomund",nivel:4,escuela:"Conjuración",clases:["Mago"],tiempo:"1 minuto",alcance:"9 metros",componentes:"V, S, M (un pequeño cofre decorado por valor de al menos 5 po, construido para acomodar un espacio extradimensional)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Creás un espacio extradimensional en el que colocás un cofre especial. Podés hacer que ese espacio y el cofre reaparezcan en cualquier momento como acción, y de vuelta a su ubicación original con la misma acción.",fuente:"SRD 5.2"},
{id:"dominar-bestia",nombre:"Dominar Bestia",nivel:4,escuela:"Encantamiento",clases:["Druida","Explorador"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S, M (una tira de cuero)",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Intentás dominar la mente de una bestia que puedas ver al alcance. Debe superar una salvación de Sabiduría o quedar hechizada por vos mientras dure el hechizo. Mientras esté hechizada, podés comunicarte con ella y usar tu acción para decirle mentalmente cómo actuar en su próximo turno.",fuente:"SRD 5.2"},
{id:"fabricar",nombre:"Fabricar",nivel:4,escuela:"Transmutación",clases:["Mago"],tiempo:"10 minutos",alcance:"36 metros",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Transformás materia prima en un producto manufacturado con un propósito determinado. Elegís materia prima al alcance, como madera, piedra o tela cruda, y la convertís en un producto de forma similar hecho del mismo material, como una mesa de madera o un vestido de tela.",fuente:"SRD 5.2"},
{id:"controlar-agua",nombre:"Controlar Agua",nivel:4,escuela:"Transmutación",clases:["Clérigo","Druida"],tiempo:"1 acción",alcance:"90 metros",componentes:"V, S, M (una gota de agua y un pellizco de polvo)",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Hasta que el hechizo termine, controlás cualquier cuerpo de agua dentro del alcance y en tu línea de visión. Podés elegir de varios efectos cuando lanzás este hechizo, y podés cambiar el efecto elegido cada vez que uses tu acción mientras el hechizo esté activo: inundar terreno, hundir un barco, crear una ola o redirigir un río.",fuente:"SRD 5.2"},

{id:"animar-objetos",nombre:"Animar Objetos",nivel:5,escuela:"Transmutación",clases:["Bardo","Hechicero","Mago"],tiempo:"1 acción",alcance:"36 metros",componentes:"V, S",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Los objetos cobran vida por decreto tuyo. Elegís hasta diez objetos no mágicos del tamaño de un objeto Pequeño que puedas ver al alcance. Un espíritu animador entra en cada objeto y este se convierte en una criatura animada bajo tu control hasta que el hechizo termine.",fuente:"SRD 5.2"},
{id:"atadura-planar",nombre:"Atadura Planar",nivel:5,escuela:"Abjuración",clases:["Bardo","Clérigo","Mago"],tiempo:"1 hora",alcance:"18 metros",componentes:"V, S, M (una cadena de plata bañada con agua sagrada por valor de al menos 1000 po)",duracion:"24 horas",concentracion:false,ritual:false,desc:"Intentás atar a una criatura celestial, elemental, feérica o infernal que puedas ver al alcance. El objetivo debe superar una salvación de Carisma o quedar atado durante la duración, siempre que esté dentro de un círculo mágico especial cuando el hechizo se lance.",mejora:"La duración se extiende a 10 días con espacio de nivel 6-7, 30 días con nivel 8, o 1 año con nivel 9.",fuente:"SRD 5.2"},
{id:"apariencia",nombre:"Apariencia",nivel:5,escuela:"Ilusionismo",clases:["Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"9 metros",componentes:"V, S, M (un colorete de maquillaje pequeño aplicado en la cara antes de lanzar el hechizo)",duracion:"8 horas",concentracion:false,ritual:false,desc:"Este hechizo les otorga a hasta ocho criaturas dispuestas al alcance una nueva apariencia ilusoria durante la duración. Podés hacer que las criaturas objetivo se vean 30 centímetros más altas o más bajas, gordas o delgadas, y podés cambiar sus rasgos faciales y color de piel, pelo y ojos.",fuente:"SRD 5.2"},
{id:"comunion",nombre:"Comunión",nivel:5,escuela:"Adivinación",clases:["Clérigo"],tiempo:"1 minuto",alcance:"Uno mismo",componentes:"V, S",duracion:"1 minuto",concentracion:false,ritual:true,desc:"Vos y tu deidad (o los intermediarios de tu deidad) intercambiáis pensamientos. Al lanzar este hechizo, podés hacer hasta tres preguntas que se puedan responder con sí o no. Debéis hacer las preguntas antes de que el hechizo termine.",fuente:"SRD 5.2"},
{id:"comunion-naturaleza",nombre:"Comunión con la Naturaleza",nivel:5,escuela:"Adivinación",clases:["Druida","Explorador"],tiempo:"1 minuto",alcance:"Uno mismo",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:true,desc:"Ganás conocimiento del terreno natural en un radio de 3 kilómetros a tu alrededor. Este conocimiento puede ser tan general o específico como desees. Podés averiguar la disposición general del terreno, poblaciones de plantas y animales prominentes, cuerpos de agua, e incluso ubicaciones de asentamientos.",fuente:"SRD 5.2"},
{id:"contactar-plano",nombre:"Contactar con Otro Plano",nivel:5,escuela:"Adivinación",clases:["Hechicero","Brujo","Mago"],tiempo:"1 minuto",alcance:"Uno mismo",componentes:"V",duracion:"1 minuto",concentracion:false,ritual:true,desc:"Establecés contacto mental con una entidad conocedora de otro plano de existencia, y podés hacerle hasta cinco preguntas. Debés elegir tu método de contacto: un espíritu inteligente de alineamiento indeterminado, o una entidad de un plano específico. La comunicación puede ser confusa o el hechizo podría dañar tu mente.",fuente:"SRD 5.2"},
{id:"despertar",nombre:"Despertar",nivel:5,escuela:"Transmutación",clases:["Druida"],tiempo:"8 horas",alcance:"Toque",componentes:"V, S, M (una piedra preciosa de ágata por valor de al menos 1000 po, que se consume)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Después de completar este ritual, tocás a una bestia o planta que no sea una criatura de tipo aberración, celestial, dragón, infernal o muerto viviente y la infundís con la chispa de la razón, otorgándole una Inteligencia de 10 y la capacidad de hablar un idioma que conozcas.",fuente:"SRD 5.2"},
{id:"estatica-sinaptica",nombre:"Estática Sináptica",nivel:5,escuela:"Encantamiento",clases:["Bardo","Hechicero","Mago"],tiempo:"1 acción",alcance:"36 metros",componentes:"V",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Estallás con burlas psíquicas hacia una o más criaturas que puedas ver en una esfera de 6 metros de radio centrada en un punto al alcance. Cada criatura en el área debe hacer una salvación de Inteligencia, sufriendo 8d6 de daño psíquico si falla, o la mitad si acierta.",fuente:"SRD 5.2"},
{id:"paso-arboreo",nombre:"Paso Arbóreo",nivel:5,escuela:"Conjuración",clases:["Druida"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Adquirís la capacidad de entrar en un árbol y viajar de un árbol a otro a través de su red de raíces. Durante la duración, cada vez que uses 1,5 metros de tu movimiento mientras estés a 1,5 metros de un árbol grande, podés entrar en él y aparecer instantáneamente dentro de otro árbol grande a menos de 18 metros.",fuente:"SRD 5.2"},
{id:"alterar-recuerdos",nombre:"Alterar los Recuerdos",nivel:5,escuela:"Encantamiento",clases:["Bardo","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"9 metros",componentes:"V, S",duracion:"1 minuto",concentracion:true,ritual:false,desc:"Intentás alterar la memoria de otra criatura. Un objetivo que puedas ver al alcance debe hacer una salvación de Sabiduría. Si dañás al objetivo con este hechizo o le hacés algo hostil, tiene ventaja en la salvación. Si falla, quedás encantado mientras dure el hechizo.",fuente:"SRD 5.2"},
