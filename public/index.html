<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grimorio del Coyote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14111d; --bg-elev:#1d1930; --bg-elev2:#252140;
    --paper:#e9ddbc; --paper-edge:#d6c396; --ink:#2b2316; --ink-soft:#5a4d33;
    --text:#eee6d6; --text-dim:#a89ecb; --gold:#c6a15b; --gold-bright:#e3c07f; --line:#332c4f;
    --ab:#5c85ab; --co:#c98a3a; --di:#9a95c2; --en:#c06a92; --ev:#b8453f; --il:#4fae9c; --ne:#8358a0; --tr:#6fa14b;
    --danger:#b8453f; --ok:#6fa14b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Source Sans 3',sans-serif;overflow-x:hidden;}
  body{min-height:100vh;width:100%;}
  .bg-texture{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(198,161,91,0.10), transparent 60%),radial-gradient(ellipse 60% 40% at 90% 100%, rgba(131,88,160,0.10), transparent 60%);}

  /* ---- Auth screen ---- */
  #authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:2;}
  .auth-card{background:var(--bg-elev);border:1px solid var(--line);border-radius:16px;padding:30px 26px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.4);}
  .auth-card h1{font-family:'Cinzel',serif;font-size:26px;text-align:center;margin:0 0 4px;background:linear-gradient(180deg,var(--gold-bright),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .auth-card .sub{text-align:center;color:var(--text-dim);font-size:12.5px;margin-bottom:20px;}
  .auth-card input{width:100%;padding:11px 14px;margin-bottom:10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14.5px;font-family:inherit;}
  .auth-card input:focus{outline:2px solid var(--gold);}
  .auth-card button.main-btn{width:100%;padding:12px;border-radius:9px;border:none;background:var(--gold);color:#1a1508;font-weight:700;font-size:15px;cursor:pointer;margin-top:6px;}
  .auth-card button.main-btn:disabled{opacity:0.5;cursor:default;}
  .auth-toggle{text-align:center;margin-top:14px;font-size:13px;color:var(--text-dim);}
  .auth-toggle a{color:var(--gold-bright);cursor:pointer;text-decoration:underline;}
  .auth-error{background:rgba(184,69,63,0.15);border:1px solid var(--danger);color:#ffb3af;padding:8px 12px;border-radius:8px;font-size:12.5px;margin-bottom:10px;display:none;}
  .auth-error.show{display:block;}
  .auth-loading{text-align:center;color:var(--text-dim);padding:60px 20px;}

  /* ---- App shell ---- */
  #appShell{display:none;}
  header{position:relative;z-index:1;padding:20px 20px 14px;text-align:center;border-bottom:1px solid var(--line);}
  header .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);opacity:0.85;}
  header h1{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(26px,7vw,38px);margin:6px 0 4px;background:linear-gradient(180deg,var(--gold-bright),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:0.02em;}
  .user-bar{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;font-size:12.5px;color:var(--text-dim);flex-wrap:wrap;}
  .user-bar .logout-btn{background:none;border:1px solid var(--line);color:var(--text-dim);padding:4px 10px;border-radius:7px;font-size:11.5px;cursor:pointer;}

  .tabs{display:flex;gap:0;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:6;}
  .tab-btn{flex:1;padding:13px 10px;text-align:center;background:none;border:none;color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:.04em;cursor:pointer;border-bottom:3px solid transparent;}
  .tab-btn.active{color:var(--gold-bright);border-bottom-color:var(--gold);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  /* ---- Grimoire controls (reused) ---- */
  .controls{position:sticky;top:41px;z-index:5;background:rgba(20,17,29,0.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 14px;}
  .search-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .search-row input[type="text"]{flex:1 1 140px;min-width:0;background:var(--bg-elev);border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:10px;font-size:15px;font-family:inherit;}
  .fav-toggle{display:flex;align-items:center;gap:6px;background:var(--bg-elev);border:1px solid var(--line);color:var(--text);padding:0 12px;border-radius:10px;font-size:13.5px;cursor:pointer;white-space:nowrap;flex:0 1 auto;}
  .fav-toggle.active{background:var(--gold);color:#1a1508;border-color:var(--gold);font-weight:600;}
  .active-char-bar{margin-top:10px;padding:8px 12px;background:var(--bg-elev2);border:1px solid var(--gold);border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .active-char-bar .info{font-size:12.5px;color:var(--text);}
  .active-char-bar .info b{color:var(--gold-bright);font-family:'Cinzel',serif;}
  .active-char-bar .stats-pills{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;}
  .pill-stat{font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,0.25);color:var(--gold-bright);}
  .quit-btn{background:none;border:1px solid var(--line);color:var(--text-dim);border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;}
  .row2{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  select{background:var(--bg-elev);border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:8px;font-size:13px;font-family:inherit;flex:1 1 130px;min-width:110px;}
  .toggle-mini{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--text-dim);background:var(--bg-elev);border:1px solid var(--line);padding:6px 10px;border-radius:8px;cursor:pointer;}
  .toggle-mini.active{color:var(--gold-bright);border-color:var(--gold);}
  .grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:14px 16px 60px;}
  .card{background:var(--paper);color:var(--ink);border-radius:12px;padding:14px 12px 12px;cursor:pointer;position:relative;border-top:5px solid var(--sc,var(--gold));box-shadow:0 3px 0 var(--paper-edge), 0 8px 16px rgba(0,0,0,0.35);transition:transform .12s ease;display:flex;flex-direction:column;gap:6px;min-height:150px;}
  .card:hover{transform:translateY(-3px);}
  .card .fav-btn{position:absolute;top:8px;right:8px;background:none;border:none;font-size:18px;cursor:pointer;line-height:1;color:var(--paper-edge);padding:2px;}
  .card .fav-btn.on{color:var(--sc,#b8453f);}
  .card .prep-btn{position:absolute;top:8px;right:32px;background:none;border:none;font-size:15px;cursor:pointer;opacity:0.35;filter:grayscale(1);padding:2px;}
  .card .prep-btn.on{opacity:1;filter:none;}
  .card .level-pips{display:flex;gap:3px;align-items:center;height:8px;}
  .pip{width:6px;height:6px;border-radius:50%;background:var(--paper-edge);}
  .pip.on{background:var(--sc,var(--gold));}
  .card .cantrip-tag{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.08em;color:var(--sc,var(--ink-soft));text-transform:uppercase;font-weight:600;}
  .card h3{font-family:'Cinzel',serif;font-size:15.5px;margin:2px 0 0;line-height:1.15;font-weight:700;padding-right:20px;}
  .card .school{font-size:11px;color:var(--ink-soft);font-style:italic;}
  .card .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto;}
  .tag-mini{font-family:'JetBrains Mono',monospace;font-size:9.5px;padding:2px 6px;border-radius:5px;background:rgba(0,0,0,0.08);color:var(--ink-soft);}
  .overlay{position:fixed;inset:0;background:rgba(10,8,16,0.78);z-index:10;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s ease;}
  .overlay.show{opacity:1;pointer-events:auto;}
  @media(min-width:640px){.overlay{align-items:center;}}
  .sheet{background:var(--paper);color:var(--ink);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;border-top:6px solid var(--sc,var(--gold));transform:translateY(30px);transition:transform .2s ease;padding:22px 20px 34px;position:relative;}
  @media(min-width:640px){.sheet{border-radius:16px;transform:translateY(10px);}}
  .overlay.show .sheet{transform:translateY(0);}
  .sheet .close-btn{position:absolute;top:12px;right:14px;background:rgba(0,0,0,0.08);border:none;width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--ink);}
  .sheet .fav-btn-big{position:absolute;top:12px;right:52px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--paper-edge);}
  .sheet .fav-btn-big.on{color:var(--sc,#b8453f);}
  .sheet .prep-btn-big{position:absolute;top:12px;right:90px;background:none;border:none;font-size:20px;cursor:pointer;opacity:0.35;filter:grayscale(1);}
  .sheet .prep-btn-big.on{opacity:1;filter:none;}
  .sheet .eyebrow2{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sc,var(--ink-soft));font-weight:700;}
  .sheet h2{font-family:'Cinzel',serif;font-size:26px;margin:4px 0 2px;padding-right:70px;}
  .sheet .sub{font-size:13px;color:var(--ink-soft);font-style:italic;margin-bottom:14px;}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:rgba(0,0,0,0.05);border-radius:10px;padding:12px;margin-bottom:14px;}
  .stat-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);}
  .stat-val{font-size:13.5px;font-weight:600;margin-top:1px;}
  .badges{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .badge{font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:4px 9px;border-radius:6px;background:var(--sc,var(--gold));color:#fff;font-weight:600;}
  .sheet .desc{font-size:14.5px;line-height:1.55;white-space:pre-line;}
  .sheet .upgrade{margin-top:14px;padding:10px 12px;background:rgba(0,0,0,0.05);border-left:3px solid var(--sc,var(--gold));border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.5;}
  .sheet .classes-line{margin-top:14px;font-size:12.5px;color:var(--ink-soft);}
  .sheet .source-line{margin-top:18px;font-size:10.5px;color:var(--ink-soft);opacity:.8;font-family:'JetBrains Mono',monospace;}
  .empty-state{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--text-dim);}
  .empty-state .glyph{font-size:34px;margin-bottom:10px;opacity:.5;}

  /* ---- Personajes tab ---- */
  .char-tab-content{padding:16px;max-width:820px;margin:0 auto;}
  .char-section-title{font-family:'Cinzel',serif;font-size:16px;color:var(--gold-bright);margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);}
  .char-section-title:first-child{margin-top:0;}
  .new-char-btn{width:100%;padding:14px;border-radius:10px;border:2px dashed var(--line);background:none;color:var(--text-dim);font-size:14px;cursor:pointer;margin-bottom:6px;}
  .new-char-btn:hover{border-color:var(--gold);color:var(--gold-bright);}
  .char-list{display:flex;flex-direction:column;gap:10px;}
  .char-card{background:var(--bg-elev);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;}
  .char-card:hover{border-color:var(--gold);}
  .char-card .cc-name{font-family:'Cinzel',serif;font-weight:700;font-size:16px;color:var(--gold-bright);}
  .char-card .cc-sub{font-size:12.5px;color:var(--text-dim);margin-top:2px;}
  .char-card .cc-stats{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .char-card .cc-stat{font-family:'JetBrains Mono',monospace;font-size:10.5px;background:rgba(0,0,0,0.25);padding:2px 7px;border-radius:5px;color:var(--gold-bright);}
  .char-card .cc-shared-badge{font-size:10px;background:var(--ab);color:#fff;padding:2px 8px;border-radius:5px;font-family:'JetBrains Mono',monospace;}
  .empty-hint{text-align:center;color:var(--text-dim);padding:30px 10px;font-size:13.5px;}

  /* character editor overlay (full sheet) */
  .char-sheet{background:var(--paper);color:var(--ink);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:22px 20px 40px;position:relative;}
  @media(min-width:640px){.char-sheet{border-radius:16px;}}
  .cf-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .cf-row input, .cf-row select, .cf-row textarea{flex:1 1 120px;min-width:90px;padding:9px 11px;border-radius:8px;border:1px solid var(--ink-soft);background:#fffdf5;color:var(--ink);font-size:13.5px;font-family:inherit;}
  .cf-row textarea{width:100%;min-height:70px;resize:vertical;font-family:inherit;}
  .cf-label{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:3px;display:block;}
  .ability-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  @media(min-width:480px){.ability-grid{grid-template-columns:repeat(6,1fr);}}
  .ability-box{background:rgba(0,0,0,0.05);border-radius:10px;padding:8px;text-align:center;}
  .ability-box .ab-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;text-transform:uppercase;color:var(--ink-soft);}
  .ability-box input{width:100%;text-align:center;border:1px solid var(--ink-soft);border-radius:6px;padding:5px;margin:4px 0;background:#fffdf5;font-size:14px;}
  .ability-box .ab-mod{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink);font-weight:700;}
  .save-skill-grid{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:14px;}
  .save-skill-row{display:flex;align-items:center;gap:8px;font-size:13px;background:rgba(0,0,0,0.04);padding:6px 10px;border-radius:7px;}
  .save-skill-row input[type="checkbox"]{width:16px;height:16px;flex:none;}
  .save-skill-row .ss-name{flex:1;}
  .save-skill-row .ss-bonus{font-family:'JetBrains Mono',monospace;font-weight:700;width:36px;text-align:right;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:480px){.two-col{grid-template-columns:1fr;}}
  .spell-picker-list{max-height:220px;overflow-y:auto;border:1px solid var(--ink-soft);border-radius:8px;margin-top:6px;}
  .spell-picker-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:13px;border-bottom:1px solid rgba(0,0,0,0.06);cursor:pointer;}
  .spell-picker-item:last-child{border-bottom:none;}
  .spell-picker-item.checked{background:rgba(198,161,91,0.18);}
  .prepared-chip{display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,0.08);padding:3px 9px;border-radius:6px;font-size:12px;margin:2px 3px 0 0;}
  .prepared-chip button{background:none;border:none;color:var(--danger);cursor:pointer;font-weight:700;padding:0 2px;}
  .share-row{display:flex;gap:8px;margin-top:6px;}
  .share-row input{flex:1;}
  .share-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,0.08);padding:4px 10px;border-radius:7px;font-size:12.5px;margin:3px 4px 0 0;}
  .share-chip button{background:none;border:none;color:var(--danger);cursor:pointer;font-weight:700;}
  .char-actions-row{display:flex;gap:10px;margin-top:22px;}
  .char-actions-row button{flex:1;padding:12px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;border:none;}
  .btn-save{background:var(--gold);color:#1a1508;}
  .btn-delete{background:var(--danger);color:#fff;}
  .readonly-banner{background:rgba(92,133,171,0.18);border:1px solid var(--ab);color:var(--ink);padding:8px 12px;border-radius:8px;font-size:12.5px;margin-bottom:14px;}
</style>
</head>
<body>

<div class="bg-texture"></div>

<!-- ===================== AUTH SCREEN ===================== -->
<div id="authScreen">
  <div class="auth-card">
    <h1>Grimorio del Coyote</h1>
    <div class="sub">Manual de Conjuros Virtual</div>
    <div class="auth-error" id="authError"></div>

    <div id="loginForm">
      <input type="email" id="li-email" placeholder="Email" autocomplete="email">
      <input type="password" id="li-pass" placeholder="Contraseña" autocomplete="current-password">
      <button class="main-btn" id="btnLogin">Ingresar</button>
      <div class="auth-toggle">¿No tenés cuenta? <a id="goRegister">Registrate</a></div>
    </div>

    <div id="registerForm" style="display:none;">
      <input type="text" id="re-nombre" placeholder="Tu nombre">
      <input type="email" id="re-email" placeholder="Email" autocomplete="email">
      <input type="password" id="re-pass" placeholder="Contraseña (mínimo 6 caracteres)" autocomplete="new-password">
      <button class="main-btn" id="btnRegister">Crear cuenta</button>
      <div class="auth-toggle">¿Ya tenés cuenta? <a id="goLogin">Ingresá</a></div>
    </div>

    <div class="auth-loading" id="authLoading" style="display:none;">Conectando…</div>
  </div>
</div>

<!-- ===================== APP SHELL ===================== -->
<div id="appShell">
  <header>
    <div class="eyebrow">Manual de Conjuros Virtual</div>
    <h1>Grimorio del Coyote</h1>
    <div class="user-bar">
      <span id="userLabel"></span>
      <button class="logout-btn" id="btnLogout">Cerrar sesión</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="grimorio">📖 Grimorio</button>
    <button class="tab-btn" data-tab="personajes">🧙 Personajes</button>
  </div>

  <!-- ---- TAB: GRIMORIO ---- -->
  <div class="tab-panel active" id="tab-grimorio">
    <div class="controls">
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="Buscar hechizo…" autocomplete="off">
        <button class="fav-toggle" id="favToggle">★ Favoritos</button>
      </div>
      <div class="active-char-bar" id="activeCharBar" style="display:none;"></div>
      <div class="row2">
        <select id="levelFilter"><option value="">Todos los niveles</option></select>
        <select id="schoolFilter"><option value="">Todas las escuelas</option></select>
        <select id="classFilter"><option value="">Todas las clases</option></select>
        <div class="toggle-mini" id="concFilter">◐ Concentración</div>
        <div class="toggle-mini" id="ritFilter">✦ Ritual</div>
        <div class="toggle-mini" id="prepFilter">📖 Preparados</div>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- ---- TAB: PERSONAJES ---- -->
  <div class="tab-panel" id="tab-personajes">
    <div class="char-tab-content">
      <div class="char-section-title">Mis personajes</div>
      <button class="new-char-btn" id="btnNuevoPersonaje">+ Crear nuevo personaje</button>
      <div class="char-list" id="misPersonajesList"></div>

      <div class="char-section-title">Compartidos conmigo</div>
      <div class="char-list" id="compartidosList"></div>
    </div>
  </div>
</div>

<!-- spell detail overlay -->
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

<!-- character editor overlay -->
<div class="overlay" id="charOverlay"><div class="char-sheet" id="charSheetEl"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, signOut, updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, doc, setDoc, addDoc, updateDoc, deleteDoc,
  collection, query, where, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ================= AUTH LOGIC =================
const authError = document.getElementById('authError');
function showAuthError(msg){ authError.textContent = msg; authError.classList.add('show'); }
function clearAuthError(){ authError.classList.remove('show'); authError.textContent=''; }

document.getElementById('goRegister').onclick = ()=>{ clearAuthError(); document.getElementById('loginForm').style.display='none'; document.getElementById('registerForm').style.display='block'; };
document.getElementById('goLogin').onclick = ()=>{ clearAuthError(); document.getElementById('registerForm').style.display='none'; document.getElementById('loginForm').style.display='block'; };

document.getElementById('btnLogin').onclick = async ()=>{
  clearAuthError();
  const email = document.getElementById('li-email').value.trim();
  const pass = document.getElementById('li-pass').value;
  if(!email || !pass){ showAuthError('Completá email y contraseña.'); return; }
  try{
    await signInWithEmailAndPassword(auth, email, pass);
  }catch(e){
    showAuthError(traducirErrorAuth(e.code));
  }
};

document.getElementById('btnRegister').onclick = async ()=>{
  clearAuthError();
  const nombre = document.getElementById('re-nombre').value.trim();
  const email = document.getElementById('re-email').value.trim();
  const pass = document.getElementById('re-pass').value;
  if(!nombre || !email || !pass){ showAuthError('Completá todos los campos.'); return; }
  if(pass.length < 6){ showAuthError('La contraseña debe tener al menos 6 caracteres.'); return; }
  try{
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: nombre });
    await setDoc(doc(db, 'usuarios', cred.user.uid), {
      nombre, email: email.toLowerCase(), creadoEn: serverTimestamp()
    });
  }catch(e){
    showAuthError(traducirErrorAuth(e.code));
  }
};

document.getElementById('btnLogout').onclick = ()=> signOut(auth);

function traducirErrorAuth(code){
  const map = {
    'auth/invalid-email':'El email no es válido.',
    'auth/user-not-found':'No existe una cuenta con ese email.',
    'auth/wrong-password':'Contraseña incorrecta.',
    'auth/invalid-credential':'Email o contraseña incorrectos.',
    'auth/email-already-in-use':'Ya existe una cuenta con ese email.',
    'auth/weak-password':'La contraseña es muy débil (mínimo 6 caracteres).',
    'auth/too-many-requests':'Demasiados intentos. Probá de nuevo en unos minutos.',
    'auth/network-request-failed':'Error de conexión. Revisá tu internet.'
  };
  return map[code] || ('Error: ' + code);
}

let currentUser = null;
let currentUserEmail = null;

onAuthStateChanged(auth, (user)=>{
  if(user){
    currentUser = user;
    currentUserEmail = (user.email||'').toLowerCase();
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('appShell').style.display = 'block';
    document.getElementById('userLabel').textContent = user.displayName ? `${user.displayName} (${user.email})` : user.email;
    iniciarListenersPersonajes();
  } else {
    currentUser = null;
    currentUserEmail = null;
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('appShell').style.display = 'none';
  }
});

{id:"bola-fuego",nombre:"Bola de Fuego",nivel:3,escuela:"Evocación",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"45 metros",componentes:"V, S, M (una bolita de guano de murciélago y azufre)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Una brillante chispa sale disparada desde tu dedo hacia un punto al alcance, donde explota con un rugido bajo en llamas. Cada criatura en una esfera de 6 metros de radio debe hacer una salvación de Destreza, sufriendo 8d6 de daño de fuego si falla, o la mitad si acierta. El fuego prende objetos inflamables en el área que nadie lleve.",mejora:"El daño aumenta en 1d6 por cada espacio de conjuro por encima del nivel 3.",fuente:"SRD 5.2"},
{id:"rayo-relampago",nombre:"Rayo Relámpago",nivel:3,escuela:"Evocación",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"Uno mismo (línea de 30x1,5 m)",componentes:"V, S, M (un trozo de piel de gato frotado con ámbar)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Un rayo de electricidad forma una línea de 30 metros de largo y 1,5 metros de ancho que sale de vos en la dirección que elijas. Cada criatura en la línea debe hacer una salvación de Destreza, sufriendo 8d6 de daño eléctrico si falla, o la mitad si acierta.",mejora:"El daño aumenta en 1d6 por cada espacio de conjuro por encima del nivel 3.",fuente:"SRD 5.2"},
{id:"contraconjuro",nombre:"Contrahechizo",nivel:3,escuela:"Abjuración",clases:["Hechicero","Brujo","Mago"],tiempo:"1 reacción (cuando ves lanzar un conjuro)",alcance:"18 metros",componentes:"S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Intentás interrumpir a una criatura en pleno proceso de lanzar un conjuro. Si la criatura está lanzando un conjuro de nivel 3 o menos, su conjuro falla y no tiene efecto. Si está lanzando un conjuro de nivel 4 o más, hacé una prueba de característica de lanzamiento de conjuros; la CD es igual a 10 + el nivel del conjuro.",mejora:"Podés interrumpir automáticamente conjuros de nivel igual o menor al del espacio usado, sin necesitar prueba.",fuente:"SRD 5.2"},
{id:"disipar-magia",nombre:"Disipar Magia",nivel:3,escuela:"Abjuración",clases:["Bardo","Clérigo","Druida","Paladín","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"36 metros",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Elegí una criatura, objeto o efecto mágico al alcance. Cualquier hechizo de nivel 3 o inferior sobre el objetivo termina. Para cada hechizo de nivel más alto activo sobre el objetivo, hacé una prueba de característica de lanzamiento de conjuros; la CD es 10 + el nivel del hechizo. Si tenés éxito, ese hechizo también termina.",fuente:"SRD 5.2"},
{id:"volar",nombre:"Volar",nivel:3,escuela:"Transmutación",clases:["Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S, M (una pluma de ave)",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Tocás a una criatura voluntaria; el objetivo gana una velocidad de vuelo de 18 metros mientras dure el hechizo. Cuando el hechizo termina, la criatura afectada cae si sigue en el aire, a menos que pueda evitar la caída de algún modo.",mejora:"Podés apuntar a una criatura adicional por cada espacio por encima del nivel 3.",fuente:"SRD 5.2"},
{id:"prisa",nombre:"Acelerar",nivel:3,escuela:"Transmutación",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"9 metros",componentes:"V, S, M (una brizna de hierba lubricante)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Elegís una criatura voluntaria que puedas ver al alcance; hasta que el hechizo termine, su velocidad se duplica, gana un +2 a la CA, tiene ventaja en salvaciones de Destreza y gana una acción adicional en cada uno de sus turnos. Esa acción solo puede usarse para las acciones de Atacar (una sola vez), Correr, Desengancharse, Esconderse u Objeto.",fuente:"SRD 5.2"},
{id:"revivificar",nombre:"Revivir",nivel:3,escuela:"Nigromancia",clases:["Clérigo","Paladín"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S, M (diamantes por valor de 300 po, que se consumen)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Tocás a una criatura que haya muerto en el último minuto. Esa criatura revive con 1 punto de golpe. Este hechizo no puede revivir a una criatura que haya muerto de vejez, ni restaurar partes del cuerpo que falten.",fuente:"SRD 5.2"},
{id:"espiritus-guardianes",nombre:"Espíritus Guardianes",nivel:3,escuela:"Conjuración",clases:["Clérigo"],tiempo:"1 acción",alcance:"Uno mismo (radio de 4,5 m)",componentes:"V, S, M (una figurilla religiosa)",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Espíritus difusos y protectores emanan de vos en un radio de 4,5 metros. Hasta que el hechizo termine, los espíritus acompañan al lanzador y ocupan el área alrededor de él. Cuando el hechizo se lanza, podés hacer que el área sea difícil de atravesar para tus enemigos. Cada enemigo que entre en el área por primera vez en un turno o empiece su turno allí debe hacer una salvación de Sabiduría, sufriendo 3d8 de daño (radiante o necrótico, a tu elección) si falla, o la mitad si acierta.",mejora:"El daño aumenta en 1d8 por cada espacio de conjuro por encima del nivel 3.",fuente:"SRD 5.2"},

{id:"invisibilidad-mayor",nombre:"Invisibilidad Mayor",nivel:4,escuela:"Ilusionismo",clases:["Bardo","Hechicero","Mago"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Vos, o una criatura que toqués, os volvéis invisibles hasta que el hechizo termine. Todo lo que el objetivo lleve o porte también es invisible mientras lo lleve encima. A diferencia de la invisibilidad normal, este efecto no termina aunque el objetivo ataque o lance conjuros.",fuente:"SRD 5.2"},
{id:"polimorfar",nombre:"Polimorfar",nivel:4,escuela:"Transmutación",clases:["Bardo","Druida","Hechicero","Mago"],tiempo:"1 acción",alcance:"27 metros",componentes:"V, S, M (un capullo de oruga)",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Este hechizo transforma a una criatura que puedas ver al alcance en una nueva forma de bestia. Una criatura no dispuesta debe superar una salvación de Sabiduría para evitar el efecto. La criatura objetivo se transforma, junto con todo lo que lleve puesto o portando, en la forma de bestia elegida. Su perfil de juego se reemplaza por el de la bestia, pero conserva su alineamiento y personalidad.",fuente:"SRD 5.2"},
{id:"muro-fuego",nombre:"Muro de Fuego",nivel:4,escuela:"Evocación",clases:["Druida","Hechicero","Mago"],tiempo:"1 acción",alcance:"36 metros",componentes:"V, S, M (una mecha de vela pequeña)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Creás un muro de fuego en una superficie sólida al alcance. Podés hacer que el muro sea de hasta 18 metros de largo, 6 metros de alto y 0,3 metros de espesor, o un anillo de hasta 6 metros de radio, 6 metros de alto y 0,3 metros de espesor. Cuando el muro aparece, cada criatura en su espacio inicial sufre 5d8 de daño de fuego. Cada criatura que termine su turno cerca del muro sufre 5d8 de daño de fuego.",mejora:"El daño aumenta en 1d8 por cada espacio de conjuro por encima del nivel 4.",fuente:"SRD 5.2"},
{id:"puerta-dimensional",nombre:"Puerta Dimensional",nivel:4,escuela:"Conjuración",clases:["Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"150 metros",componentes:"V",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Te teletransportás junto con hasta un objeto que puedas llevar o vestir, desde tu ubicación actual hasta cualquier otro punto al alcance que hayas visto antes o que puedas describir por dirección aproximada. Podés llevar a otra criatura voluntaria a 1,5 metros si esta accede.",fuente:"SRD 5.2"},
{id:"destierro",nombre:"Destierro",nivel:4,escuela:"Abjuración",clases:["Clérigo","Paladín","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S, M (un fragmento de concha de ostra ley)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Intentás enviar a una criatura que puedas ver al alcance a otro plano de existencia. El objetivo debe superar una salvación de Carisma o quedar transportado a un plano no nativo elegido por vos, o quedar incapacitado en un bolsillo dimensional si ya está en su plano de origen, mientras dure el hechizo.",mejora:"Podés apuntar a una criatura adicional por cada espacio por encima del nivel 4.",fuente:"SRD 5.2"},
{id:"confusion",nombre:"Confusión",nivel:4,escuela:"Encantamiento",clases:["Bardo","Druida","Hechicero","Mago"],tiempo:"1 acción",alcance:"27 metros",componentes:"V, S, M (tres nueces secas)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Este hechizo confunde las mentes de las criaturas en una esfera de 3 metros de radio centrada en un punto al alcance, haciendo que actúen erráticamente. Cada criatura en el área debe superar una salvación de Sabiduría o quedar confusa mientras dure el hechizo, tirando en una tabla de comportamiento aleatorio en cada uno de sus turnos.",fuente:"SRD 5.2"},

{id:"cono-frio",nombre:"Cono de Frío",nivel:5,escuela:"Evocación",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"Uno mismo (cono de 18 m)",componentes:"V, S, M (una esquirla de cristal pequeña)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Una ráfaga de aire helado se dispara desde tus manos en un cono de 18 metros. Cada criatura en el área debe hacer una salvación de Constitución, sufriendo 8d8 de daño de frío si falla, o la mitad si acierta.",mejora:"El daño aumenta en 1d8 por cada espacio de conjuro por encima del nivel 5.",fuente:"SRD 5.2"},
{id:"muro-fuerza",nombre:"Muro de Fuerza",nivel:5,escuela:"Evocación",clases:["Mago"],tiempo:"1 acción",alcance:"36 metros",componentes:"V, S, M (una esquirla de cuarzo transparente)",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Un muro invisible de fuerza aparece en un punto al alcance. Podés darle forma de plano de hasta diez losas de 3 metros de lado, o de esfera o hemisferio de hasta 3 metros de radio. El muro es completamente impenetrable y no puede ser dañado por daño físico ni por la mayoría de la magia.",fuente:"SRD 5.2"},
{id:"dominar-persona",nombre:"Dominar Persona",nivel:5,escuela:"Encantamiento",clases:["Bardo","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S, M (una joya tallada como cabeza humanoide)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Intentás dominar la mente de un humanoide que puedas ver al alcance. Debe superar una salvación de Sabiduría o quedar hechizado por vos mientras dure el hechizo. Mientras esté hechizado, podés comunicarte telepáticamente con él y usar tu acción para decirle mentalmente cómo actuar en su próximo turno.",mejora:"La duración se extiende a horas o días con espacios de nivel superior.",fuente:"SRD 5.2"},
{id:"restauracion-mayor",nombre:"Restablecimiento Mayor",nivel:5,escuela:"Abjuración",clases:["Bardo","Clérigo","Druida"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S, M (diamante en polvo por valor de 100 po, que se consume)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Tocás a una criatura y podés eliminar uno de los siguientes efectos: un punto de exhausto, una reducción a una puntuación de característica, un efecto que reduzca el máximo de puntos de golpe, o una condición de aturdido, cegado, ensordecido, paralizado, petrificado o hechizado.",fuente:"SRD 5.2"},

{id:"desintegrar",nombre:"Desintegrar",nivel:6,escuela:"Transmutación",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S, M (una lente de vidrio dentro de un tubo hueco de hierro y cobre)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Un rayo verde delgado sale de tu dedo apuntador hacia un objetivo al alcance. El objetivo debe superar una salvación de Destreza o sufrir 10d6+40 de daño de fuerza. Si este daño reduce al objetivo a 0 puntos de golpe, queda desintegrado.",mejora:"El daño aumenta en 3d6 por cada espacio de conjuro por encima del nivel 6.",fuente:"SRD 5.2"},
{id:"relampago-cadena",nombre:"Relámpago en Cadena",nivel:6,escuela:"Evocación",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"45 metros",componentes:"V, S, M (un trozo de piel de gato y una vara de vidrio o ámbar)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Lanzás un relámpago hacia un objetivo al alcance que luego salta hasta a tres objetivos adicionales a tu elección, siempre que estén a 9 metros de distancia del primer objetivo. Cada objetivo debe hacer una salvación de Destreza, sufriendo 10d8 de daño eléctrico si falla, o la mitad si acierta.",mejora:"Se puede afectar a un objetivo adicional por cada espacio de conjuro por encima del nivel 6.",fuente:"SRD 5.2"},
{id:"vision-verdadera",nombre:"Visión Veraz",nivel:6,escuela:"Adivinación",clases:["Bardo","Clérigo","Druida","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S, M (un ungüento de hierbas raras que cuesta 25 po, aplicado a los ojos)",duracion:"1 hora",concentracion:false,ritual:false,desc:"Este hechizo otorga al objetivo tocado la capacidad de ver las cosas tal como son. Mientras dure, el objetivo tiene visión verdadera hasta 36 metros, puede ver en la oscuridad mágica, detecta formas cambiantes o transmutadas, y puede ver hacia el Plano Etéreo.",fuente:"SRD 5.2"},

{id:"teletransportar",nombre:"Teletransportar",nivel:7,escuela:"Conjuración",clases:["Bardo","Hechicero","Mago"],tiempo:"1 acción",alcance:"3 metros",componentes:"V",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Este hechizo te transporta instantáneamente, junto con hasta ocho criaturas voluntarias dispuestas en un círculo a 3 metros de vos, a un destino que conozcas en el mismo plano de existencia. El destino puede ser un edificio familiar, un lugar visto una vez, o incluso una descripción general; cuanto más lo conozcas, mayor la probabilidad de éxito exacto.",fuente:"SRD 5.2"},
{id:"dedo-muerte",nombre:"Dedo de la Muerte",nivel:7,escuela:"Nigromancia",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Apuntás con un dedo huesudo hacia una criatura al alcance y susurrás las sílabas fatales. El objetivo debe hacer una salvación de Constitución, sufriendo 7d8+30 de daño necrótico si falla, o la mitad si acierta. Un humanoide que muera por este daño se levanta al inicio de tu próximo turno como zombi bajo tu control.",fuente:"SRD 5.2"},

{id:"palabra-poder-aturdir",nombre:"Palabra de Poder Aturdir",nivel:8,escuela:"Encantamiento",clases:["Bardo","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Pronunciás una palabra de poder que puede aturdir a una criatura que puedas ver al alcance. Si el objetivo tiene 150 puntos de golpe o menos, queda aturdido. De lo contrario, el hechizo no tiene efecto. No requiere salvación.",fuente:"SRD 5.2"},
{id:"campo-antimagico",nombre:"Campo Antimagia",nivel:8,escuela:"Abjuración",clases:["Clérigo","Mago"],tiempo:"1 acción",alcance:"Uno mismo (esfera de 3 m)",componentes:"V, S, M (piedra de hierro pura en polvo por valor de 150 po)",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Una esfera de 3 metros de radio centrada en vos se llena de una zona de supresión mágica. En el área, los efectos de conjuros no pueden aparecer, ningún conjuro puede ser lanzado, las criaturas y objetos invocados desaparecen momentáneamente, y los objetos mágicos se comportan como no mágicos.",fuente:"SRD 5.2"},

{id:"deseo",nombre:"Deseo",nivel:9,escuela:"Conjuración",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V",duracion:"Instantánea",concentracion:false,ritual:false,desc:"El más poderoso de todos los conjuros de mortales, Deseo permite duplicar cualquier otro conjuro de nivel 8 o inferior sin cumplir sus requisitos, o crear un efecto de tu elección con esencialmente cualquier propósito de alcance razonable. Usar el hechizo para algo más que duplicar otro conjuro implica un riesgo real de daño físico y psíquico, e incluso podés perder la capacidad de volver a lanzar Deseo.",fuente:"SRD 5.2"},
{id:"enjambre-meteoros",nombre:"Enjambre de Meteoros",nivel:9,escuela:"Evocación",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"1 kilómetro",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Cuatro esferas ígneas de energía centellante se estrellan a tierra en puntos que elijas al alcance. Cada criatura en una esfera de 12 metros de radio centrada en cada punto debe hacer una salvación de Destreza, sufriendo 20d6 de daño de fuego combinado con daño contundente (mitad y mitad) si falla, o la mitad si acierta.",fuente:"SRD 5.2"},
{id:"resurreccion-verdadera",nombre:"Resurrección Verdadera",nivel:9,escuela:"Nigromancia",clases:["Clérigo","Druida"],tiempo:"1 hora",alcance:"Toque",componentes:"V, S, M (diamantes por valor de 25.000 po, que se consumen)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Tocás a una criatura que haya muerto hace no más de 200 años y que haya muerto por cualquier motivo excepto vejez. Si su alma está libre y dispuesta, la criatura vuelve a la vida con todas sus heridas curadas. Este hechizo puede incluso proveer un nuevo cuerpo si el original ha sido destruido.",fuente:"SRD 5.2"},

{id:"detectar-magia",nombre:"Detectar Magia",nivel:1,escuela:"Adivinación",clases:["Bardo","Clérigo","Druida","Paladín","Explorador","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S",duracion:"Hasta 10 minutos",concentracion:true,ritual:true,desc:"Durante el hechizo, percibís la presencia de magia a 9 metros de vos. Si detectás magia de esta forma, podés usar tu acción para ver una aura tenue alrededor de cualquier criatura u objeto visible que porte magia, y aprender su escuela de magia si la hay.",fuente:"SRD 5.2"},
{id:"identificar",nombre:"Identificar",nivel:1,escuela:"Adivinación",clases:["Bardo","Hechicero","Mago"],tiempo:"1 minuto",alcance:"Toque",componentes:"V, S, M (una perla por valor de 100 po y una pluma de búho)",duracion:"Instantánea",concentracion:false,ritual:true,desc:"Elegís un objeto que debes tocar durante todo el conjuro. Si es un objeto mágico o portador de magia, aprendés sus propiedades y cómo usarlas, si requiere sintonización y cuántos cargos tiene, si tiene alguna, si algún conjuro lo afecta y qué conjuro es.",fuente:"SRD 5.2"},
{id:"familiar",nombre:"Encontrar Familiar",nivel:1,escuela:"Conjuración",clases:["Hechicero","Brujo","Mago"],tiempo:"1 hora",alcance:"3 metros",componentes:"V, S, M (10 po de carbón, incienso y hierbas que se consumen al quemarse en un brasero de plata)",duracion:"Instantánea",concentracion:false,ritual:true,desc:"Convocás a un espíritu que adopta la forma de un familiar animal que elijas, para que te ayude en tus aventuras. Podés comunicarte telepáticamente con tu familiar mientras esté a 100 millas, y podés percibir a través de sus sentidos y hablar mientras esté cerca.",fuente:"SRD 5.2"},
{id:"maleficio",nombre:"Maleficio",nivel:1,escuela:"Encantamiento",clases:["Brujo"],tiempo:"1 acción adicional",alcance:"27 metros",componentes:"V, S",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Maldecís a una criatura que puedas ver al alcance. Hasta que el hechizo termine, infligís 1d6 de daño necrótico adicional al objetivo cada vez que le pegás con un ataque, y tenés ventaja en las pruebas de Sabiduría (Percepción) para localizarlo. Si el objetivo muere mientras esté maldecido, podés trasladar la maldición a otra criatura como acción adicional en un turno posterior.",mejora:"Con espacios de nivel 3-4 la duración se extiende a 8 horas; con 5+ a 24 horas.",fuente:"SRD 5.2"},

{id:"saeta-fuego",nombre:"Descarga de Fuego",nivel:0,escuela:"Evocación",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"36 metros",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Lanzás un dardo de fuego hacia una criatura o un objeto al alcance. Realizá un ataque de conjuro a distancia; si acierta, el objetivo sufre 1d10 de daño de fuego. El fuego prende objetos inflamables que no lleve nadie encima.",mejora:"El daño aumenta en 1d10 en los niveles 5, 11 y 17.",fuente:"SRD 5.2"},
{id:"luces-danzantes",nombre:"Luces Danzantes",nivel:0,escuela:"Evocación",clases:["Bardo","Hechicero","Mago"],tiempo:"1 acción",alcance:"36 metros",componentes:"V, S, M (un trozo de fósforo o musgo luminoso)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Creás hasta cuatro luces del tamaño de una antorcha al alcance, con forma de orbes, llamas o esferas que flotan en el aire mientras dure el hechizo. También podés combinarlas en una figura luminosa tenue. Como acción adicional, podés mover las luces hasta 18 metros.",fuente:"SRD 5.2"},
{id:"remendar",nombre:"Remendar",nivel:0,escuela:"Transmutación",clases:["Bardo","Hechicero","Mago"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Este hechizo repara una sola rotura o desgarro en un objeto que toques, como un eslabón roto de una cadena, dos mitades de una llave rota, un desgarro en una capa o un odre con una fuga. Mientras el daño no supere 1 pie en cualquier dimensión, lo reparás sin dejar rastro del daño original.",fuente:"SRD 5.2"},
{id:"prestidigitacion",nombre:"Prestidigitación",nivel:0,escuela:"Transmutación",clases:["Bardo","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"9 metros",componentes:"V, S",duracion:"Hasta 1 hora",concentracion:false,ritual:false,desc:"Este hechizo es un truco mágico menor que los lanzadores de conjuros novatos usan para practicar. Creás uno de varios efectos sensoriales menores al alcance: una chispa, una brisa, un sonido suave, un olor u sabor, limpiar o ensuciar un objeto pequeño, encender o apagar una vela o antorcha pequeña, enfriar, calentar o dar color a un objeto pequeño, o crear una marca o símbolo temporal en una superficie.",fuente:"SRD 5.2"},
{id:"mensaje",nombre:"Mensaje",nivel:0,escuela:"Transmutación",clases:["Bardo","Hechicero","Mago"],tiempo:"1 acción",alcance:"36 metros",componentes:"V, S, M (un trozo de hilo de cobre)",duracion:"1 asalto",concentracion:false,ritual:false,desc:"Apuntás un dedo hacia una criatura al alcance y susurrás un mensaje. El objetivo (y solo él) escucha el mensaje y puede responder en un susurro que solo vos podés oír.",fuente:"SRD 5.2"},
{id:"taumaturgia",nombre:"Taumaturgia",nivel:0,escuela:"Transmutación",clases:["Clérigo"],tiempo:"1 acción",alcance:"9 metros",componentes:"V",duracion:"Hasta 1 minuto",concentracion:false,ritual:false,desc:"Manifestás una señal menor de poder sobrenatural, eligiendo un efecto entre varios: tu voz retumba, llamas parpadean, un ruido sordo, puertas y ventanas se abren o cierran violentamente, tus ojos cambian de color momentáneamente, entre otros.",fuente:"SRD 5.2"},
{id:"resistencia",nombre:"Resistencia",nivel:0,escuela:"Abjuración",clases:["Clérigo","Druida"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S, M (un amuleto pequeño)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Tocás a una criatura voluntaria. Una vez antes de que el hechizo termine, el objetivo puede tirar un d4 y sumarlo a una salvación de su elección.",fuente:"SRD 5.2"},

{id:"comprender-idiomas",nombre:"Entender Idiomas",nivel:1,escuela:"Adivinación",clases:["Bardo","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S, M (un poco de hollín y sal)",duracion:"1 hora",concentracion:false,ritual:true,desc:"Durante el hechizo, entendés el significado literal de cualquier idioma hablado que oigas o texto escrito que veas y toques. También entendés cualquier forma especializada de comunicación, como sonidos de tambor, cánticos o grito de aves.",fuente:"SRD 5.2"},
{id:"alarma",nombre:"Alarma",nivel:1,escuela:"Abjuración",clases:["Explorador","Hechicero","Mago"],tiempo:"1 minuto",alcance:"9 metros",componentes:"V, S, M (una campanita de plata y un trozo de alambre fino)",duracion:"8 horas",concentracion:false,ritual:true,desc:"Colocás una alarma mágica contra intrusos. Elegí una puerta, ventana u otro punto al alcance por el que una criatura pudiera acceder a un área que querés proteger. Cuando una criatura del tamaño de un rocín o menor que no hayas designado toque o cruce el área elegida sin tu permiso, la alarma se activa, avisándote mentalmente si estás a 1 milla o menos.",fuente:"SRD 5.2"},
{id:"rociada-color",nombre:"Rociada de Color",nivel:1,escuela:"Ilusionismo",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"Uno mismo (cono de 4,5 m)",componentes:"V, S, M (un puñado de arena de colores)",duracion:"1 asalto",concentracion:false,ritual:false,desc:"Una brillante explosión de colores parpadeantes se dispara desde tu mano. Tirá 6d10; ese es el total de puntos de golpe de criaturas que este hechizo puede afectar. Las criaturas en un cono de 4,5 metros desde vos, empezando por la de menos puntos de golpe, quedan cegadas hasta el final de tu próximo turno.",mejora:"Sumá 2d10 al total por cada espacio de conjuro por encima del nivel 1.",fuente:"SRD 5.2"},
{id:"enredar",nombre:"Enmarañar",nivel:1,escuela:"Conjuración",clases:["Druida","Explorador"],tiempo:"1 acción",alcance:"27 metros",componentes:"V, S",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Zarcillos y enredaderas retorcidas brotan del suelo en un área de 6 metros de lado al alcance. Cada criatura que empiece su turno en el área debe superar una salvación de Fuerza o quedar apresada hasta que el hechizo termine. El terreno en el área queda difícil de atravesar.",fuente:"SRD 5.2"},
{id:"escudo-fe",nombre:"Escudo de Fe",nivel:1,escuela:"Abjuración",clases:["Clérigo","Paladín"],tiempo:"1 acción adicional",alcance:"18 metros",componentes:"V, S, M (una pequeña reliquia religiosa)",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Un campo brillante y semitransparente rodea a una criatura al alcance, otorgándole un bono de +2 a la CA mientras dure el hechizo.",fuente:"SRD 5.2"},
{id:"absorber-elementos",nombre:"Absorber Elementos",nivel:1,escuela:"Abjuración",clases:["Druida","Explorador","Hechicero","Mago"],tiempo:"1 reacción (cuando sufrís daño de un tipo elemental)",alcance:"Uno mismo",componentes:"S",duracion:"Hasta 1 asalto",concentracion:false,ritual:false,desc:"El poder mágico del daño elemental que sufrís se desvía para reforzar temporalmente tu propia magia, reduciendo a la mitad el daño de ácido, frío, fuego, eléctrico o trueno que estás sufriendo. Además, la próxima vez que impactes con un ataque cuerpo a cuerpo antes de que termine el hechizo, el objetivo sufre 1d6 de daño adicional del mismo tipo.",mejora:"El daño adicional aumenta en 1d6 por cada espacio de conjuro por encima del nivel 1.",fuente:"SRD 5.2"},
{id:"caida-pluma",nombre:"Caída de Pluma",nivel:1,escuela:"Transmutación",clases:["Bardo","Hechicero","Mago"],tiempo:"1 reacción (cuando vos u otra criatura al alcance caéis)",alcance:"18 metros",componentes:"V, M (una pluma pequeña)",duracion:"1 minuto",concentracion:false,ritual:false,desc:"Elegí hasta cinco criaturas en caída al alcance. La velocidad de caída de una criatura afectada se reduce a 18 metros por asalto hasta el final del hechizo. Si la criatura aterriza antes de que el hechizo termine, no sufre daño de caída y puede aterrizar de pie.",fuente:"SRD 5.2"},

{id:"ver-invisible",nombre:"Ver lo Invisible",nivel:2,escuela:"Adivinación",clases:["Bardo","Hechicero","Mago"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S, M (talco y un poco de plata en polvo)",duracion:"1 hora",concentracion:false,ritual:false,desc:"Durante el hechizo, ves criaturas y objetos invisibles como si fueran visibles, y podés ver hacia el Plano Etéreo. Las criaturas y objetos etéreos aparecen fantasmales y translúcidos.",fuente:"SRD 5.2"},
{id:"levitar",nombre:"Levitar",nivel:2,escuela:"Transmutación",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S, M (una pestaña pequeña de cuero curtido)",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Una criatura o un objeto de tu elección que puedas ver al alcance se eleva verticalmente hasta 6 metros y permanece suspendido en el aire mientras dure el hechizo. Una criatura no dispuesta que supere una salvación de Constitución no se ve afectada.",fuente:"SRD 5.2"},
{id:"oscuridad",nombre:"Oscuridad",nivel:2,escuela:"Evocación",clases:["Hechicero","Brujo"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, M (carbón de leña, una pluma de cuervo y un trozo de hígado de rana)",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Se crea oscuridad mágica en un punto al alcance, en un radio de 4,5 metros, y se extiende alrededor de esquinas. Persiste mientras dure el hechizo. La oscuridad creada por este conjuro bloquea la visión en la oscuridad, incluso la visión en la oscuridad de las criaturas.",fuente:"SRD 5.2"},
{id:"detectar-pensamientos",nombre:"Detectar Pensamientos",nivel:2,escuela:"Adivinación",clases:["Bardo","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S, M (una moneda de cobre)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Durante el hechizo, podés leer los pensamientos superficiales de ciertas criaturas. Al lanzarlo y como acción en turnos posteriores, podés concentrarte en una criatura a 9 metros que puedas ver; si tiene una Sabiduría de 3 o menos o no tiene mente, ese objetivo no se ve afectado. De lo contrario, percibís sus pensamientos superficiales a menos que supere una salvación de Sabiduría.",fuente:"SRD 5.2"},
{id:"localizar-objeto",nombre:"Localizar Objeto",nivel:2,escuela:"Adivinación",clases:["Bardo","Clérigo","Druida","Paladín","Explorador","Hechicero","Mago"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S, M (una aguja de zahorí de bronce o hierro)",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Sentís la dirección hacia un objeto familiar o un tipo de objeto genérico, siempre que no esté a más de 1000 pies. Si el objeto se mueve, sentís la dirección de su movimiento, siempre que permanezca en rango.",fuente:"SRD 5.2"},
{id:"paso-sin-rastro",nombre:"Pasar sin Rastro",nivel:2,escuela:"Abjuración",clases:["Druida","Explorador"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S, M (hojas mullidas o musgo)",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Un manto de silencio y sombra rodea a un grupo de viajeros. Elegí hasta seis criaturas voluntarias a 9 metros. Hasta que el hechizo termine, las criaturas elegidas ganan un bono de +10 a las pruebas de Destreza (Sigilo) y no pueden ser rastreadas excepto por medios mágicos.",fuente:"SRD 5.2"},
{id:"piel-corteza",nombre:"Piel Robliza",nivel:2,escuela:"Transmutación",clases:["Druida","Explorador"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S, M (un poco de corteza de árbol)",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Al tocar a una criatura voluntaria, le otorgás una protección similar a la corteza mientras dure el hechizo. La CA del objetivo no puede ser inferior a 16, sin importar qué armadura lleve.",fuente:"SRD 5.2"},
{id:"encontrar-montura",nombre:"Hallar Corcel",nivel:2,escuela:"Conjuración",clases:["Druida","Paladín"],tiempo:"10 minutos",alcance:"9 metros",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Invocás a un espíritu que adopta la forma de una montura inusualmente inteligente, fuerte y leal, dando forma a un lazo mágico de propósito con él. La montura desaparece cuando llega a 0 puntos de golpe o cuando la despedís.",fuente:"SRD 5.2"},
{id:"zona-verdad",nombre:"Zona de la Verdad",nivel:2,escuela:"Encantamiento",clases:["Clérigo","Paladín"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S",duracion:"10 minutos",concentracion:false,ritual:false,desc:"Creás una zona mágica que impide decir mentiras deliberadas en una esfera de 4,5 metros de radio centrada en un punto al alcance. Cada criatura que entre en el área por primera vez o empiece su turno allí debe superar una salvación de Carisma o no poder decir mentiras deliberadas mientras permanezca en el área.",fuente:"SRD 5.2"},
{id:"silencio",nombre:"Silencio",nivel:2,escuela:"Ilusionismo",clases:["Bardo","Clérigo","Explorador"],tiempo:"1 acción",alcance:"36 metros",componentes:"V, S",duracion:"Hasta 10 minutos",concentracion:true,ritual:true,desc:"Ningún sonido puede iniciarse, continuar existiendo, ni ser oído dentro de una esfera de 6 metros de radio centrada en un punto al alcance. Cualquier criatura u objeto totalmente dentro del área es inmune a daño de trueno, y las criaturas quedan ensordecidas mientras estén totalmente dentro. Lanzar un conjuro con un componente verbal es imposible ahí dentro.",fuente:"SRD 5.2"},
{id:"calmar-emociones",nombre:"Calmar Emociones",nivel:2,escuela:"Encantamiento",clases:["Bardo","Clérigo"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Intentás estabilizar las emociones violentas de hasta cinco criaturas de tu elección en un radio de 6 metros centrado en un punto al alcance. Cada objetivo debe superar una salvación de Carisma; si falla, elegís entre suprimir cualquier efecto de encantamiento o miedo, o hacer que sea indiferente hacia las criaturas que elijas durante la duración.",fuente:"SRD 5.2"},

{id:"nube-apestosa",nombre:"Nube Apestosa",nivel:3,escuela:"Conjuración",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"27 metros",componentes:"V, S, M (huevo podrido o hojas de repollo hediondo)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Creás una esfera de gas nauseabundo y amarillento de 6 metros de radio centrada en un punto al alcance. El gas se propaga por esquinas. Cada criatura que empiece su turno en el área debe superar una salvación de Constitución o quedar envenenada hasta el inicio de su próximo turno; mientras esté envenenada así, la criatura solo puede usar acción o acción adicional en su turno, no ambas.",fuente:"SRD 5.2"},
{id:"miedo",nombre:"Terror",nivel:3,escuela:"Ilusionismo",clases:["Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"Uno mismo (cono de 9 m)",componentes:"V, S, M (una pluma blanca)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Proyectás una ilusión de fantasmagórico terror en un cono de 9 metros. Cada criatura en el área debe superar una salvación de Sabiduría o soltar lo que lleve en las manos y quedar asustada mientras dure el hechizo. Mientras esté asustada, la criatura debe usar sus movimientos para alejarse de vos por la ruta más segura.",fuente:"SRD 5.2"},
{id:"proteccion-energia",nombre:"Protección contra Energía",nivel:3,escuela:"Abjuración",clases:["Clérigo","Druida","Explorador","Hechicero","Mago"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Para la duración, la criatura voluntaria que toques tiene resistencia a un tipo de daño de tu elección entre ácido, frío, fuego, eléctrico o trueno.",fuente:"SRD 5.2"},
{id:"clarividencia",nombre:"Clarividencia",nivel:3,escuela:"Adivinación",clases:["Bardo","Clérigo","Hechicero","Mago"],tiempo:"10 minutos",alcance:"1600 metros",componentes:"V, S, M (un botón de cristal o vidrio)",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Creás un sensor invisible dentro del alcance en una ubicación familiar o visible al alcance. El sensor permanece en su lugar mientras dure el hechizo, y podés recibir a través de él imágenes o sonidos, según elijas al lanzar el hechizo, como si estuvieras ahí.",fuente:"SRD 5.2"},
{id:"patron-hipnotico",nombre:"Patrón Hipnótico",nivel:3,escuela:"Ilusionismo",clases:["Bardo","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"36 metros",componentes:"S, M (un mechero incandescente o cristal centelleante)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Creás un patrón vívido y llamativo de luces al alcance, en un cubo de 9 metros de lado. Cada criatura en el cubo cuando el patrón aparece debe superar una salvación de Sabiduría o quedar hechizada mientras dure el hechizo, siendo incapacitada y con velocidad 0.",fuente:"SRD 5.2"},
{id:"vampirismo",nombre:"Toque Vampírico",nivel:3,escuela:"Nigromancia",clases:["Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V, S",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"El toque de tu mano puede drenar la fuerza vital de otros para curar tus propias heridas. Realizá un ataque de conjuro cuerpo a cuerpo contra una criatura al alcance; si acierta, el objetivo sufre 3d6 de daño necrótico y recuperás puntos de golpe iguales a la mitad de la cantidad de daño necrótico infligido.",mejora:"El daño aumenta en 1d6 por cada espacio de conjuro por encima del nivel 3.",fuente:"SRD 5.2"},
{id:"conjurar-animales",nombre:"Conjurar Animales",nivel:3,escuela:"Conjuración",clases:["Druida","Explorador"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Invocás espíritus fey que adoptan la forma de bestias y aparecen en espacios desocupados al alcance. Elegís una forma de entre varias opciones y aparece la cantidad correspondiente de bestias espirituales para luchar a tu lado, obedeciendo tus órdenes mentales.",mejora:"Con espacios de nivel superior aparecen más bestias o de mayor tamaño.",fuente:"SRD 5.2"},

{id:"libertad-movimiento",nombre:"Libertad de Movimiento",nivel:4,escuela:"Abjuración",clases:["Bardo","Clérigo","Druida","Explorador"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S, M (un correa o cordón de cuero, atado alrededor del brazo)",duracion:"1 hora",concentracion:false,ritual:false,desc:"Tocás a una criatura voluntaria. Mientras dure el hechizo, el movimiento del objetivo no se ve afectado por terreno difícil, y los conjuros y otros efectos mágicos no pueden reducir su velocidad ni hacer que quede paralizado o apresado.",fuente:"SRD 5.2"},
{id:"guardian-fe",nombre:"Guardián de la Fe",nivel:4,escuela:"Conjuración",clases:["Clérigo"],tiempo:"1 acción",alcance:"9 metros",componentes:"V",duracion:"Hasta 8 horas",concentracion:true,ritual:false,desc:"Un guardián espectral aparece y te custodia mientras dure el hechizo, o hasta que golpee a una criatura. El guardián ocupa el espacio en que apareció y no se mueve. Cualquier enemigo que se mueva por primera vez en un turno a menos de 3 metros del guardián debe superar una salvación de Sabiduría o sufrir 20 de daño radiante o necrótico (a elección del guardián).",fuente:"SRD 5.2"},
{id:"ojo-arcano",nombre:"Ojo Arcano",nivel:4,escuela:"Adivinación",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"9 metros",componentes:"V, S, M (una pluma pequeña de vidrio y plata)",duracion:"Hasta 1 hora",concentracion:false,ritual:false,desc:"Creás un ojo invisible y mágico dentro del alcance que flota en el aire y te acompaña telepáticamente durante la duración del hechizo. Podés ver a través del ojo como si estuvieras ahí, y podés hacer que se mueva 9 metros en cualquier dirección como acción.",fuente:"SRD 5.2"},
{id:"piel-petrea",nombre:"Piel Pétrea",nivel:4,escuela:"Abjuración",clases:["Druida","Hechicero","Mago"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S, M (diamante en polvo por valor de 100 po, que se consume)",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Este hechizo confiere resistencia a daños no mágicos contundente, perforante y cortante a la criatura voluntaria que toques mientras dure el hechizo.",fuente:"SRD 5.2"},

{id:"muralla-piedra",nombre:"Muro de Piedra",nivel:5,escuela:"Transmutación",clases:["Druida","Mago"],tiempo:"1 acción",alcance:"36 metros",componentes:"V, S, M (un pequeño bloque de granito)",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Un muro no mágico de piedra sólida cobra vida en un punto que elijas al alcance. El muro tiene 15 cm de espesor y se compone de diez paneles de 3 metros de lado, o podés adoptar formas curvas usando dos paneles como uno solo.",fuente:"SRD 5.2"},
{id:"curacion-masa",nombre:"Curación en Masa",nivel:5,escuela:"Abjuración",clases:["Bardo","Clérigo","Druida"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Una ola de energía curativa sale de vos hacia criaturas heridas que elijas al alcance. Elegí hasta seis criaturas en el área. Cada objetivo recupera puntos de golpe iguales a 3d8 + tu modificador de la característica de lanzamiento de conjuros.",mejora:"La curación aumenta en 1d8 por cada espacio de conjuro por encima del nivel 5.",fuente:"SRD 5.2"},
{id:"alzar-muertos",nombre:"Alzar Muertos",nivel:5,escuela:"Nigromancia",clases:["Bardo","Clérigo","Paladín"],tiempo:"1 hora",alcance:"Toque",componentes:"V, S, M (diamante por valor de 500 po, que se consume)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Devolvés la vida a una criatura muerta hace no más de 10 días. Si el alma del objetivo no está libre y dispuesta, no vuelve a la vida. La criatura vuelve con 1 punto de golpe, y este hechizo también neutraliza cualquier veneno y cura enfermedades no mágicas que la afectaban al momento de morir.",fuente:"SRD 5.2"},
{id:"contagio",nombre:"Contagio",nivel:5,escuela:"Nigromancia",clases:["Clérigo","Druida"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S",duracion:"7 días",concentracion:false,ritual:false,desc:"Tu toque puede infligir una de varias enfermedades terribles. Realizá un ataque de conjuro cuerpo a cuerpo contra una criatura al alcance. Si acierta, el objetivo debe superar una salvación de Constitución o quedar envenenado. Al final de cada uno de sus turnos, el objetivo repite la salvación; tras tres fallos, contrae una enfermedad mágica que elijas.",fuente:"SRD 5.2"},
{id:"videncia",nombre:"Escudriñar",nivel:5,escuela:"Adivinación",clases:["Bardo","Clérigo","Druida","Hechicero","Brujo","Mago"],tiempo:"10 minutos",alcance:"Uno mismo",componentes:"V, S, M (un espejo de plata pulida por valor de al menos 1000 po)",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Establecés contacto visual y auditivo con una criatura conocida que esté en el mismo plano de existencia. Debe superar una salvación de Sabiduría o el hechizo establece un vínculo mágico con la mente de esa criatura, dejándote ver y oír todo lo que le rodea.",fuente:"SRD 5.2"},

{id:"curar",nombre:"Curar",nivel:6,escuela:"Abjuración",clases:["Clérigo","Druida"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Una oleada de energía curativa positiva fluye a través de una criatura que elijas y puedas ver al alcance. El objetivo recupera puntos de golpe iguales a 70 más tu modificador de la característica de lanzamiento de conjuros. El hechizo también cura cualquier enfermedad y termina el efecto de estar cegado o ensordecido en el objetivo.",mejora:"La curación aumenta en 10 por cada espacio de conjuro por encima del nivel 6.",fuente:"SRD 5.2"},
{id:"sugestion-masa",nombre:"Sugestión en Masa",nivel:6,escuela:"Encantamiento",clases:["Bardo","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, M (un trozo de lengua de serpiente y una golosina, en forma de miel, azúcar en polvo o galleta)",duracion:"Hasta 24 horas",concentracion:false,ritual:false,desc:"Sugerís un curso de actividad de una sola frase a hasta doce criaturas de tu elección que puedas ver al alcance y que te puedan oír y entender. Cada objetivo debe superar una salvación de Sabiduría o seguir la sugerencia mientras dure el hechizo.",fuente:"SRD 5.2"},
{id:"globo-invulnerabilidad",nombre:"Globo de Invulnerabilidad",nivel:6,escuela:"Abjuración",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"Uno mismo (esfera de 3 m)",componentes:"V, S, M (una esfera de cristal hueca y una perla)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Se forma una esfera invisible de fuerza mágica de 6 metros de radio a tu alrededor y se mueve con vos. Cualquier conjuro de nivel 5 o inferior lanzado desde fuera del globo no puede afectar a criaturas u objetos dentro de él, incluso si el conjuro se lanza usando un espacio de conjuro de nivel superior.",fuente:"SRD 5.2"},

{id:"cambio-plano",nombre:"Desplazamiento entre Planos",nivel:7,escuela:"Conjuración",clases:["Clérigo","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"Toque",componentes:"V, S, M (un fragmento afinado a un plano de existencia particular)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Vos y hasta ocho criaturas voluntarias que formen un círculo tomados de las manos os transportáis a otro plano de existencia. Tres de esas criaturas pueden ser objetivos involuntarios, que deben superar una salvación de Carisma o ser transportadas igualmente.",fuente:"SRD 5.2"},
{id:"resurreccion",nombre:"Resurrección",nivel:7,escuela:"Nigromancia",clases:["Bardo","Clérigo"],tiempo:"1 hora",alcance:"Toque",componentes:"V, S, M (diamante por valor de 1000 po, que se consume)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Tocás a una criatura muerta hace no más de un siglo que no haya muerto de vejez. Si su alma está libre y dispuesta, el objetivo vuelve a la vida con todos sus puntos de golpe. Este hechizo también neutraliza cualquier veneno, cura enfermedades y restaura cualquier parte del cuerpo faltante.",fuente:"SRD 5.2"},
{id:"regenerar",nombre:"Regenerar",nivel:7,escuela:"Transmutación",clases:["Bardo","Clérigo","Druida"],tiempo:"1 minuto",alcance:"Toque",componentes:"V, S, M (perla de musgo fresco)",duracion:"1 hora",concentracion:false,ritual:false,desc:"Tocás a una criatura y otorgás una infusión de fuerza vital positiva. El objetivo recupera 4d8+15 puntos de golpe. Durante la hora siguiente, el objetivo recupera 1 punto de golpe al inicio de cada uno de sus turnos, y los miembros u órganos perdidos vuelven a crecer si el hechizo se lanza dentro de la hora de haberlos perdido.",fuente:"SRD 5.2"},
{id:"bola-fuego-retardada",nombre:"Bola de Fuego de Estallido Retardado",nivel:7,escuela:"Evocación",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"45 metros",componentes:"V, S, M (una bola de guano de murciélago y ámbar)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Una brillante esfera de energía centellante sale disparada desde tu dedo hasta un punto al alcance donde permanece suspendida hasta el final de tu próximo turno. Entonces explota. Cada criatura en una esfera de 6 metros de radio debe hacer una salvación de Destreza, sufriendo 12d6 de daño de fuego si falla, o la mitad si acierta.",mejora:"El daño aumenta en 1d6 por cada espacio de conjuro por encima del nivel 7.",fuente:"SRD 5.2"},

{id:"dominar-monstruo",nombre:"Dominar Monstruo",nivel:8,escuela:"Encantamiento",clases:["Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S, M (una joya tallada como cabeza humanoide)",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Intentás dominar la mente de una criatura que puedas ver al alcance. Debe superar una salvación de Sabiduría o quedar hechizada por vos mientras dure el hechizo. Mientras esté hechizada, podés comunicarte telepáticamente con ella y usar tu acción para decirle mentalmente cómo actuar en su próximo turno.",fuente:"SRD 5.2"},
{id:"estallido-solar",nombre:"Explosión Solar",nivel:8,escuela:"Evocación",clases:["Druida","Hechicero","Mago"],tiempo:"1 acción",alcance:"45 metros",componentes:"V, S, M (una lupa)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Un destello de luz brillante forma una esfera de radiancia de 18 metros de radio centrada en un punto al alcance. Cada criatura en la esfera debe superar una salvación de Constitución, sufriendo 12d6 de daño radiante si falla, o la mitad si acierta. Las criaturas y objetos vulnerables a la luz solar sufren desventaja en la salvación.",fuente:"SRD 5.2"},
{id:"mente-blanco",nombre:"Mente en Blanco",nivel:8,escuela:"Encantamiento",clases:["Bardo","Brujo","Mago"],tiempo:"1 acción",alcance:"9 metros",componentes:"V",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Intentás sobrecargar la mente de una criatura, dejándola sin capacidad de pensar racionalmente ni lanzar conjuros. El objetivo debe superar una salvación de Inteligencia o quedar afectado por este hechizo mientras dure. El objetivo afectado no puede lanzar conjuros, activar objetos mágicos, entender el lenguaje ni comunicarse de forma coherente, y su Inteligencia y Carisma se convierten en 1.",fuente:"SRD 5.2"},

{id:"palabra-poder-matar",nombre:"Palabra de Poder Matar",nivel:9,escuela:"Encantamiento",clases:["Bardo","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Pronunciás una palabra de poder que puede matar instantáneamente a una criatura que puedas ver al alcance. Si el objetivo tiene 100 puntos de golpe o menos, muere. De lo contrario, el hechizo no tiene efecto. No requiere salvación.",fuente:"SRD 5.2"},
{id:"presciencia",nombre:"Presciencia",nivel:9,escuela:"Adivinación",clases:["Bardo","Druida","Hechicero","Mago"],tiempo:"1 minuto",alcance:"Toque",componentes:"V, S, M (una pluma de un tótem u oráculo)",duracion:"Hasta 8 horas",concentracion:true,ritual:false,desc:"Tocás a una criatura voluntaria y le otorgás un vistazo limitado del futuro inmediato. Mientras dure el hechizo, el objetivo no puede ser sorprendido y tiene ventaja en tiradas de ataque, pruebas de característica y salvaciones, mientras que los demás tienen desventaja en tiradas de ataque contra él.",fuente:"SRD 5.2"},
{id:"detener-tiempo",nombre:"Parar el Tiempo",nivel:9,escuela:"Transmutación",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"Uno mismo",componentes:"V",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Detenés el flujo del tiempo para todos excepto para vos mismo. Nadie más se mueve, y ningún efecto que dependa del tiempo transcurrido progresa. Podés usar hasta 1d4+1 turnos consecutivos en este estado, actuando y moviéndote libremente. El hechizo termina antes si una de tus acciones o efectos afecta a otra criatura o un objeto que otra criatura porta.",fuente:"SRD 5.2"},
{id:"portal",nombre:"Portal",nivel:9,escuela:"Conjuración",clases:["Clérigo","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S, M (una esfera de diamante por valor de 5000 po)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Abrís un portal que conecta un punto al alcance con una ubicación precisa en otro plano de existencia. El portal es una superficie circular de hasta 3 metros de diámetro, orientada como elijas, y dura mientras el hechizo esté activo. Cualquier criatura u objeto que atraviese el portal aparece instantáneamente en la ubicación correspondiente del otro plano.",fuente:"SRD 5.2"},

{id:"descarga-sobrenatural",nombre:"Descarga Sobrenatural",nivel:0,escuela:"Evocación",clases:["Brujo"],tiempo:"1 acción",alcance:"36 metros",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Un haz crepitante de energía sobrenatural se dispara hacia una criatura al alcance. Realizá un ataque de conjuro a distancia contra el objetivo; si acierta, sufre 1d10 de daño de fuerza. El hechizo crea más de un haz cuando alcanzás niveles superiores: dos haces a nivel 5, tres a nivel 11 y cuatro a nivel 17. Podés dirigir los haces al mismo objetivo o a otros distintos, realizando un ataque separado por cada haz.",fuente:"SRD 5.2"},
{id:"rayo-hechiceria",nombre:"Rayo de Hechicería",nivel:1,escuela:"Evocación",clases:["Brujo"],tiempo:"1 acción",alcance:"9 metros",componentes:"V, S, M (un trozo de piel de gato erizada por relámpagos)",duracion:"Hasta 1 minuto",concentracion:true,ritual:false,desc:"Un latigazo de energía relampagueante forma un rayo entre vos y una criatura al alcance. Realizá un ataque de conjuro a distancia; si acierta, el objetivo sufre 1d12 de daño eléctrico y queda afectado por el hechizo mientras dure. En cada uno de tus turnos posteriores, podés usar tu acción para infligir automáticamente 1d12 de daño eléctrico adicional al objetivo, siempre que siga a 9 metros de vos.",mejora:"El daño inicial aumenta en 1d12 por cada espacio de conjuro por encima del nivel 1.",fuente:"SRD 5.2"},
{id:"toque-gelido",nombre:"Toque Helado",nivel:0,escuela:"Nigromancia",clases:["Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"36 metros",componentes:"V, S",duracion:"1 asalto",concentracion:false,ritual:false,desc:"Creás un espectro de manos esqueléticas gélidas en el espacio de una criatura al alcance. Realizá un ataque de conjuro a distancia; si acierta, el objetivo sufre 1d8 de daño necrótico y no puede recuperar puntos de golpe hasta el inicio de tu próximo turno. Hasta entonces, la mano se aferra al objetivo.",mejora:"El daño aumenta en 1d8 en los niveles 5, 11 y 17.",fuente:"SRD 5.2"},
{id:"salpicadura-acido",nombre:"Salpicadura de Ácido",nivel:0,escuela:"Conjuración",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"18 metros",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Lanzás una burbuja de ácido. Elegí una o dos criaturas al alcance que estén a menos de 1,5 metros entre sí. Un objetivo debe superar una salvación de Destreza o sufrir 1d6 de daño ácido.",mejora:"El daño aumenta en 1d6 en los niveles 5, 11 y 17.",fuente:"SRD 5.2"},
{id:"rociada-veneno",nombre:"Rociada Venenosa",nivel:0,escuela:"Conjuración",clases:["Druida","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"3 metros",componentes:"V, S",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Extendés tu mano hacia una criatura que puedas ver al alcance y hacés que un veneno nauseabundo brote de ella. El objetivo debe superar una salvación de Constitución o sufrir 1d12 de daño de veneno.",mejora:"El daño aumenta en 1d12 en los niveles 5, 11 y 17.",fuente:"SRD 5.2"},
{id:"impacto-verdadero",nombre:"Impacto Certero",nivel:0,escuela:"Adivinación",clases:["Bardo","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"9 metros",componentes:"S",duracion:"1 asalto",concentracion:false,ritual:false,desc:"Apuntás un dedo hacia una criatura al alcance. Tu magia te otorga una breve visión de sus defensas. En tu próximo turno, ganás ventaja en tu primera tirada de ataque contra el objetivo, siempre que el hechizo no haya terminado.",fuente:"SRD 5.2"},

{id:"persona-encantada",nombre:"Hechizar Persona",nivel:1,escuela:"Encantamiento",clases:["Bardo","Druida","Hechicero","Brujo","Mago"],tiempo:"1 acción",alcance:"9 metros",componentes:"V, S",duracion:"Hasta 1 hora",concentracion:true,ritual:false,desc:"Intentás encantar a un humanoide que puedas ver al alcance. Debe superar una salvación de Sabiduría o quedar hechizado por vos mientras dure el hechizo, o hasta que vos o tus compañeros le hagáis algo dañino. La criatura hechizada te considera un conocido amistoso.",mejora:"Podés apuntar a un humanoide adicional por cada espacio por encima del nivel 1.",fuente:"SRD 5.2"},
{id:"orbe-cromatico",nombre:"Orbe Cromático",nivel:1,escuela:"Evocación",clases:["Hechicero","Mago"],tiempo:"1 acción",alcance:"27 metros",componentes:"V, S, M (diamante por valor de 50 po)",duracion:"Instantánea",concentracion:false,ritual:false,desc:"Lanzás una esfera de energía crepitante hacia una criatura al alcance. Elegí ácido, frío, fuego, eléctrico, veneno o trueno para el tipo de daño del orbe. Realizá un ataque de conjuro a distancia contra el objetivo; si acierta, sufre 3d8 de daño del tipo elegido.",mejora:"El daño aumenta en 1d8 por cada espacio de conjuro por encima del nivel 1.",fuente:"SRD 5.2"},
{id:"retirada-expeditiva",nombre:"Retirada Expeditiva",nivel:1,escuela:"Transmutación",clases:["Hechicero","Brujo","Mago"],tiempo:"1 acción adicional",alcance:"Uno mismo",componentes:"V, S",duracion:"Hasta 10 minutos",concentracion:true,ritual:false,desc:"Tu velocidad aumenta en 3 metros y no provocás ataques de oportunidad mientras dure el hechizo. En cada uno de tus turnos antes de que el hechizo termine, podés usar tu acción adicional para tomar de nuevo la acción de Correr.",fuente:"SRD 5.2"},
